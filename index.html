  /* ============ TRAVEL: render (v23) ============
     Structure mirrors Challenges (overview list -> detail page with its own subtabs) and reuses
     the same primitives everywhere: .cal-subtabs/.cal-subtab for horizontal tab strips (chosen
     over a Body-style secondary sidebar since the user's own mockups show horizontal tabs),
     .modal-backdrop/.modal-card + .drawer-backdrop/.drawer-card for add/edit forms, .chal-badge/
     .chal-type-icon for status pills and colored icon tiles, .panel/.hero-stat/.row for layout. */

  var TRAVEL_TOP_TABS = [["overview","Overview"],["trips","Trips"],["map","Map"],["places","Places"],["reviews","Reviews"],["itineraries","Itineraries"],["stats","Stats"]];
  function travelSubtabsHTML(){
    return '<div class="cal-subtabs" style="margin-bottom:18px">'+TRAVEL_TOP_TABS.map(function(t){
      return '<button type="button" class="cal-subtab'+(travelPage===t[0]?" active":"")+'" data-trv-page="'+t[0]+'">'+t[1]+'</button>';
    }).join("")+'</div>';
  }

  function travelStatusColor(status){ return (TRIP_STATUS_META[status]||TRIP_STATUS_META.planning).color; }
  function placeStatusMeta(status){
    return { saved:{label:"Saved",color:"var(--steel)"}, planned:{label:"Planned",color:"var(--mustard)"}, visited:{label:"Visited",color:"var(--good)"} }[status] || { label:"Saved", color:"var(--steel)" };
  }

  function tripRowHTML(t){
    var status = tripStatus(t);
    var meta = [t.city, countryName(t.countryCode)].filter(Boolean).join(", ");
    var dateLabel = t.startDate ? (fmtShort(t.startDate)+(t.endDate && t.endDate!==t.startDate ? " – "+fmtShort(t.endDate) : "")) : "No dates set";
    return '<div class="row" data-trv-open-trip="'+t.id+'" style="cursor:pointer">'+
      '<span class="chal-type-icon" style="background:'+(t.color||"var(--teal)")+'">'+PIN_SVG+'</span>'+
      '<div class="main"><div class="title">'+esc(t.name||meta||"Untitled trip")+'</div><div class="meta">'+esc(meta||"No destination set")+' · '+esc(dateLabel)+'</div></div>'+
      '<span class="chal-badge" style="color:'+travelStatusColor(status)+';border-color:'+travelStatusColor(status)+'">'+TRIP_STATUS_META[status].label+'</span>'+
    '</div>';
  }

  function placeRowHTML(p){
    var cat = placeCategoryMeta(p.category);
    var meta = [p.city, countryName(p.countryCode)].filter(Boolean).join(", ") || cat.label;
    var sMeta = placeStatusMeta(p.status);
    return '<div class="row" data-trv-open-place="'+p.id+'" style="cursor:pointer">'+
      catIconHTML(p.name||cat.label, cat.color)+
      '<div class="main"><div class="title">'+esc(p.name||"Untitled place")+(p.favorite?' <span title="Favorite" style="color:var(--ember)">&#9733;</span>':"")+'</div><div class="meta">'+esc(cat.label)+' · '+esc(meta)+(p.rating?' · '+p.rating+"/5":"")+'</div></div>'+
      '<span class="chal-badge" style="color:'+sMeta.color+';border-color:'+sMeta.color+'">'+sMeta.label+'</span>'+
    '</div>';
  }

  function renderTravel(){
    if(travelPage==="trip" && travelTripId) return travelTripDetailHTML(travelTripId);
    if(travelPage==="place" && travelPlaceId) return travelPlaceDetailHTML(travelPlaceId);
    var head = '<div class="habits-head"><div><h2>Travel</h2><p>Where you have been, and where you are headed.</p></div>'+
      '<button type="button" class="btn btn-primary" style="background:var(--teal)" data-trv-new-trip>+ Add trip</button></div>';
    var body;
    switch(travelPage){
      case "trips": body = travelTripsPageHTML(); break;
      case "map": body = travelMapPageHTML(); break;
      case "places": body = travelPlacesPageHTML(); break;
      case "reviews": body = travelReviewsPageHTML(); break;
      case "itineraries": body = travelItinerariesPageHTML(); break;
      case "stats": body = travelStatsPageHTML(); break;
      default: body = travelOverviewPageHTML();
    }
    var modals = (travelShowAddTrip?travelTripModalHTML():"") + (travelShowAddPlace?travelPlaceModalHTML():"") + (travelShowAddItinerary?travelItineraryModalHTML():"");
    return head + travelSubtabsHTML() + body + modals;
  }

  /* ---- Overview ---- */
  function travelOverviewPageHTML(){
    var trips = state.travel.trips.filter(function(t){ return !t.archived; });
    var visitedCountries = {};
    state.travel.places.forEach(function(p){ if(p.status==="visited" && p.countryCode) visitedCountries[p.countryCode]=true; });
    trips.forEach(function(t){ if(tripStatus(t)==="completed" && t.countryCode) visitedCountries[t.countryCode]=true; });
    var countryCount = Object.keys(visitedCountries).length;
    var visitedPlacesCount = state.travel.places.filter(function(p){ return p.status==="visited"; }).length;
    var savedCount = state.travel.places.filter(function(p){ return p.status==="saved"; }).length;

    var html = '<div class="hero-stat">'+
      '<div><div class="hero-label">Countries visited</div><div class="hero-num">'+countryCount+'</div><div class="hero-sub">'+trips.length+' trip'+(trips.length===1?"":"s")+' logged</div></div>'+
      '<div class="trv-mini-stats">'+
        '<div class="trv-mini"><div class="trv-mini-num">'+visitedPlacesCount+'</div><div class="trv-mini-label">Places visited</div></div>'+
        '<div class="trv-mini"><div class="trv-mini-num">'+savedCount+'</div><div class="trv-mini-label">Saved for later</div></div>'+
      '</div>'+
    '</div>';

    var cur = currentTrip();
    if(cur){
      html += '<div class="panel" style="--accent:var(--good);border-color:var(--good)"><div class="panel-head"><h2>Current trip</h2></div>'+
        tripRowHTML(cur) + '</div>';
    }

    var upcoming = upcomingTrips(3);
    html += '<div class="panel"><div class="panel-head"><h2>Looking ahead</h2><button type="button" class="btn-ghost" data-trv-page="trips">See all trips</button></div>'+
      (upcoming.length ? '<div class="stack">'+upcoming.map(tripRowHTML).join("")+'</div>' : '<p class="empty">No upcoming trips planned yet.</p>')+
    '</div>';

    var recentPlaces = state.travel.places.filter(function(p){ return p.status==="visited"; })
      .slice().sort(function(a,b){ return (b.reviewDate||b.updatedAt)<(a.reviewDate||a.updatedAt) ? -1 : 1; }).slice(0,5);
    html += '<div class="panel"><div class="panel-head"><h2>Recently visited</h2><button type="button" class="btn-ghost" data-trv-page="places">See all places</button></div>'+
      (recentPlaces.length ? '<div class="stack">'+recentPlaces.map(placeRowHTML).join("")+'</div>' : '<p class="empty">Mark a place as visited to see it here.</p>')+
    '</div>';

    return html;
  }

  /* ---- Trips list ---- */
  function travelTripsPageHTML(){
    var trips = state.travel.trips.slice().sort(function(a,b){
      var order = { ongoing:0, upcoming:1, planning:2, completed:3, archived:4 };
      var sa = tripStatus(a), sb = tripStatus(b);
      if(order[sa]!==order[sb]) return order[sa]-order[sb];
      return (b.startDate||"")<(a.startDate||"") ? -1 : 1;
    });
    if(!trips.length) return '<div class="panel"><p class="empty">No trips yet — add your first one to start building your travel log.</p></div>';
    return '<div class="panel"><div class="stack">'+trips.map(tripRowHTML).join("")+'</div></div>';
  }

  /* ---- Places (filterable list, doubles as the saved/bucket-list view via the Status filter) ---- */
  function travelFilteredPlaces(){
    var f = travelPlacesFilter;
    var q = travelSearchQuery.trim().toLowerCase();
    return state.travel.places.filter(function(p){
      if(f.category!=="all" && p.category!==f.category) return false;
      if(f.status!=="all" && p.status!==f.status) return false;
      if(f.country!=="all" && p.countryCode!==f.country) return false;
      if(q && (p.name||"").toLowerCase().indexOf(q)===-1 && (p.city||"").toLowerCase().indexOf(q)===-1) return false;
      return true;
    }).slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); });
  }
  function travelUsedCountryOptions(){
    var used = {};
    state.travel.places.forEach(function(p){ if(p.countryCode) used[p.countryCode]=true; });
    state.travel.trips.forEach(function(t){ if(t.countryCode) used[t.countryCode]=true; });
    return Object.keys(used).sort(function(a,b){ return countryName(a).localeCompare(countryName(b)); });
  }
  function travelPlacesPageHTML(){
    var list = travelFilteredPlaces();
    var countryOpts = travelUsedCountryOptions();
    var filters = '<div class="field-row" style="align-items:flex-end;flex-wrap:wrap;gap:10px">'+
      '<label class="f" style="flex:1;min-width:160px">Search<input type="text" id="trv-places-search" value="'+esc(travelSearchQuery)+'" placeholder="Search places..."></label>'+
      '<div class="f"><label style="font-size:.76rem;color:var(--ink-faint)">Category</label><select id="trv-filter-category" data-picker="select">'+
        '<option value="all"'+(travelPlacesFilter.category==="all"?" selected":"")+'>All categories</option>'+
        PLACE_CATEGORIES.map(function(c){ return '<option value="'+c.id+'"'+(travelPlacesFilter.category===c.id?" selected":"")+'>'+esc(c.label)+'</option>'; }).join("")+
      '</select></div>'+
      '<div class="f"><label style="font-size:.76rem;color:var(--ink-faint)">Status</label><select id="trv-filter-status" data-picker="select">'+
        ["all","saved","planned","visited"].map(function(s){ return '<option value="'+s+'"'+(travelPlacesFilter.status===s?" selected":"")+'>'+(s==="all"?"All statuses":placeStatusMeta(s).label)+'</option>'; }).join("")+
      '</select></div>'+
      (countryOpts.length ? '<div class="f"><label style="font-size:.76rem;color:var(--ink-faint)">Country</label><select id="trv-filter-country" data-picker="select">'+
        '<option value="all"'+(travelPlacesFilter.country==="all"?" selected":"")+'>All countries</option>'+
        countryOpts.map(function(cc){ return '<option value="'+cc+'"'+(travelPlacesFilter.country===cc?" selected":"")+'>'+esc(countryName(cc))+'</option>'; }).join("")+
      '</select></div>' : "")+
      '<button type="button" class="btn btn-primary" data-trv-new-place>+ Add place</button>'+
    '</div>';
    var body = list.length ? '<div class="stack">'+list.map(placeRowHTML).join("")+'</div>' : '<p class="empty">No places match these filters yet.</p>';
    return '<div class="panel">'+filters+'</div><div class="panel">'+body+'</div>';
  }

  /* ---- Reviews: every place with a rating or written review ---- */
  function travelReviewsPageHTML(){
    var reviewed = state.travel.places.filter(function(p){ return p.rating!=null || (p.reviewText||"").trim(); })
      .slice().sort(function(a,b){ return (b.reviewDate||"")<(a.reviewDate||"") ? -1 : 1; });
    if(!reviewed.length) return '<div class="panel"><p class="empty">No reviews yet — add a rating or notes to a visited place to see it here.</p></div>';
    return '<div class="panel"><div class="stack">'+reviewed.map(function(p){
      var cat = placeCategoryMeta(p.category);
      var meta = [p.city, countryName(p.countryCode)].filter(Boolean).join(", ");
      return '<div class="row" data-trv-open-place="'+p.id+'" style="cursor:pointer;align-items:flex-start">'+
        catIconHTML(p.name||cat.label, cat.color)+
        '<div class="main"><div class="title">'+esc(p.name)+(p.rating?' <span style="color:var(--gold);font-weight:600">'+p.rating+'/5</span>':"")+'</div>'+
        '<div class="meta">'+esc(meta)+(p.reviewDate?" · "+fmtShort(p.reviewDate):"")+'</div>'+
        (p.reviewText ? '<p style="margin:6px 0 0;font-size:.84rem;color:var(--ink-soft)">'+esc(p.reviewText)+'</p>' : "")+
        '</div>'+
      '</div>';
    }).join("")+'</div></div>';
  }

  /* ---- Itineraries: a trip index linking into each trip's own itinerary builder ---- */
  function travelItinerariesPageHTML(){
    var trips = state.travel.trips.slice().sort(function(a,b){ return (a.startDate||"9999")<(b.startDate||"9999") ? -1 : 1; });
    if(!trips.length) return '<div class="panel"><p class="empty">Add a trip first, then build its day-by-day itinerary from the trip page.</p></div>';
    return '<div class="panel"><div class="stack">'+trips.map(function(t){
      var count = state.travel.itinerary.filter(function(it){ return it.tripId===t.id; }).length;
      var status = tripStatus(t);
      var meta = [t.city, countryName(t.countryCode)].filter(Boolean).join(", ");
      return '<div class="row" data-trv-open-itinerary="'+t.id+'" style="cursor:pointer">'+
        '<span class="chal-type-icon" style="background:'+(t.color||"var(--teal)")+'">'+ROUTE_SVG+'</span>'+
        '<div class="main"><div class="title">'+esc(t.name||meta||"Untitled trip")+'</div><div class="meta">'+esc(meta||"No destination set")+' · '+count+' item'+(count===1?"":"s")+'</div></div>'+
        '<span class="chal-badge" style="color:'+travelStatusColor(status)+';border-color:'+travelStatusColor(status)+'">'+TRIP_STATUS_META[status].label+'</span>'+
      '</div>';
    }).join("")+'</div></div>';
  }

  /* ---- Stats ---- */
  function travelStatsPageHTML(){
    var trips = state.travel.trips.filter(function(t){ return !t.archived; });
    var places = state.travel.places;
    var visited = places.filter(function(p){ return p.status==="visited"; });
    var byCategory = {};
    visited.forEach(function(p){ byCategory[p.category] = (byCategory[p.category]||0)+1; });
    var catEntries = Object.keys(byCategory).map(function(k){ return { label:placeCategoryMeta(k).label, value:byCategory[k], color:placeCategoryMeta(k).color }; }).sort(function(a,b){ return b.value-a.value; });

    var byYear = {};
    trips.forEach(function(t){ if(t.startDate){ var y=t.startDate.slice(0,4); byYear[y]=(byYear[y]||0)+tripDayCount(t); } });
    var years = Object.keys(byYear).sort();
    var yearEntries = years.map(function(y){ return { label:y, value:byYear[y] }; });

    var totalDays = trips.reduce(function(s,t){ return s + (t.startDate&&t.endDate ? tripDayCount(t) : 0); },0);
    var ratedPlaces = places.filter(function(p){ return p.rating!=null; });
    var avgRating = ratedPlaces.length ? (ratedPlaces.reduce(function(s,p){ return s+p.rating; },0)/ratedPlaces.length) : null;

    var html = '<div class="hero-stat">'+
      '<div><div class="hero-label">Total days traveled</div><div class="hero-num">'+totalDays+'</div><div class="hero-sub">across '+trips.length+' trip'+(trips.length===1?"":"s")+'</div></div>'+
      (avgRating!=null ? '<div class="trv-mini-stats"><div class="trv-mini"><div class="trv-mini-num">'+avgRating.toFixed(1)+'</div><div class="trv-mini-label">Avg. place rating</div></div></div>' : "")+
    '</div>';

    html += '<div class="panel"><div class="panel-head"><h2>Places by category</h2></div>'+
      (catEntries.length ? barListHTML(catEntries, "var(--teal)", function(v){ return v+""; }) : '<p class="empty">Mark places as visited to see a breakdown here.</p>')+
    '</div>';

    if(yearEntries.length){
      html += '<div class="panel"><div class="panel-head"><h2>Days traveled by year</h2></div>'+
        barListHTML(yearEntries, "var(--home-blue)", function(v){ return v+"d"; })+
      '</div>';
    }
    return html;
  }

  /* ---- World map: a hand-authored, stylized inline SVG (equirectangular projection, simplified
     continent outlines) — not a tile/API-backed map. Markers are one dot per country (places are
     only ever plotted at the country's centroid — see COUNTRY_CENTROIDS), clustered by count
     since multiple places in the same country share one centroid. Clicking a dot opens a
     click-to-preview popover listing what's there. This is disclosed in the page caption.
     v23.1: reworked after feedback that the first pass (6 coarse hexagon-ish blobs) looked crude.
     Fix was two things together, not just one: (a) far more coastline points per landmass — the
     ugliness was mostly too few vertices, the same reason any low-poly map looks bad — plus small
     separate islands (UK/Ireland, Japan, Madagascar, Indonesia, NZ, Greenland) that make the
     silhouette actually readable at a glance; (b) a light Catmull-Rom smoothing pass over the
     projected points (trvSmoothPath) so corners round off into soft "journal map" blobs instead of
     hard polygon edges, matching the mockup's stylized look rather than a technical vector map. The
     coastlines below are still a hand-simplified approximation, not survey data — precision was
     never the goal, recognizability was. */
  var TRAVEL_MAP_W = 1000, TRAVEL_MAP_H = 460;
  var TRAVEL_LAT_TOP = 78, TRAVEL_LAT_BOTTOM = -58; // crops the mostly-empty polar bands so continents fill the frame
  function trvProject(lat, lng){
    return {
      x: (lng+180)/360*TRAVEL_MAP_W,
      y: (TRAVEL_LAT_TOP-lat)/(TRAVEL_LAT_TOP-TRAVEL_LAT_BOTTOM)*TRAVEL_MAP_H
    };
  }
  /* Closed-loop Catmull-Rom → cubic Bezier smoothing. A low tension divisor (10, vs. the usual 6)
     keeps the curve close to the original points — softened corners, not a distorted blob. */
  /* Catmull-Rom-to-Bezier smoothing with tangent clamping: a raw Catmull-Rom tangent can overshoot
     past a neighboring point when the coastline sequence turns sharply (a peninsula tip, a strait),
     which is what produced self-intersecting spikes/loops in the first pass. Clamping each tangent's
     length to a fraction of the shorter adjacent edge keeps sharp corners crisp instead of looping,
     while gentle stretches still round out smoothly. */
  function trvSmoothPath(pts){
    var n = pts.length;
    if(n<3) return "";
    function dist(a,b){ return Math.hypot(b.x-a.x, b.y-a.y); }
    function tangent(a,b,c){
      var v1x=b.x-a.x, v1y=b.y-a.y, v2x=c.x-b.x, v2y=c.y-b.y;
      var l1=Math.hypot(v1x,v1y), l2=Math.hypot(v2x,v2y);
      if(l1===0||l2===0) return {x:0,y:0};
      var cos = (v1x*v2x+v1y*v2y)/(l1*l2);
      // A near-180° reversal (a true cusp, e.g. a thin cape or a peninsula tip) can't be smoothed
      // without folding into a loop — treat it as a hard corner instead of extending a tangent.
      if(cos < -0.2) return {x:0,y:0};
      var tx=(c.x-a.x)/2, ty=(c.y-a.y)/2;
      var len = Math.hypot(tx,ty);
      var cap = Math.min(l1,l2) * 0.5;
      if(len>cap && len>0){ var s=cap/len; tx*=s; ty*=s; }
      return {x:tx,y:ty};
    }
    var d = "M"+pts[0].x.toFixed(1)+","+pts[0].y.toFixed(1)+" ";
    for(var i=0;i<n;i++){
      var p0=pts[(i-1+n)%n], p1=pts[i], p2=pts[(i+1)%n], p3=pts[(i+2)%n];
      var t1 = tangent(p0,p1,p2), t2 = tangent(p1,p2,p3);
      var c1x=p1.x+t1.x/3, c1y=p1.y+t1.y/3;
      var c2x=p2.x-t2.x/3, c2y=p2.y-t2.y/3;
      d += "C"+c1x.toFixed(1)+","+c1y.toFixed(1)+" "+c2x.toFixed(1)+","+c2y.toFixed(1)+" "+p2.x.toFixed(1)+","+p2.y.toFixed(1)+" ";
    }
    return d+"Z";
  }

  /* Faint graticule (every 30° longitude, 20° latitude) — a small cartographic touch that reads
     as "this is a map" at a glance, purely decorative, not used for anything functional. */
  function travelGraticuleSVG(){
    var lines = "";
    for(var lng=-180; lng<=180; lng+=30){
      var a = trvProject(TRAVEL_LAT_TOP, lng), b = trvProject(TRAVEL_LAT_BOTTOM, lng);
      lines += '<line x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+'" class="trv-map-grid"/>';
    }
    for(var lat=-40; lat<=60; lat+=20){
      var l = trvProject(lat,-180), r = trvProject(lat,180);
      lines += '<line x1="'+l.x.toFixed(1)+'" y1="'+l.y.toFixed(1)+'" x2="'+r.x.toFixed(1)+'" y2="'+r.y.toFixed(1)+'" class="trv-map-grid"/>';
    }
    return lines;
  }
  function travelCountryMarkers(){
    var byCountry = {};

      byCountry[p.countryCode] = byCountry[p.countryCode] || { countryCode:p.countryCode, count:0, bestStatus:"saved", placeIds:[] };
      byCountry[p.countryCode].count++;
      byCountry[p.countryCode].placeIds.push(p.id);
      var rank = { saved:0, planned:1, visited:2 };
      if(rank[p.status]>rank[byCountry[p.countryCode].bestStatus]) byCountry[p.countryCode].bestStatus = p.status;
    });
    return Object.keys(byCountry).map(function(cc){ return byCountry[cc]; });
  }

  /* ---- Trip route diagram: a schematic, non-geographic sequence of stops (ordered dots + lines),

  function tripRouteDiagramSVG(places){
    if(!places.length) return '<p class="empty">Add places to this trip to see them here.</p>';
    var w = 640, pad = 50, n = places.length;
    var step = n>1 ? (w-pad*2)/(n-1) : 0;
    var y = 60;
    var lines = places.map(function(p,i){
      if(i===0) return "";
      var x1 = pad+step*(i-1), x2 = pad+step*i;
      return '<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="var(--border)" stroke-width="2"/>';
    }).join("");
    var dots = places.map(function(p,i){
      var x = pad+step*i;
      var cat = placeCategoryMeta(p.category);
      return '<g data-trv-open-place="'+p.id+'" style="cursor:pointer">'+
        '<circle cx="'+x+'" cy="'+y+'" r="8" fill="'+cat.color+'" stroke="#fff" stroke-width="2"/>'+
        '<text x="'+x+'" y="'+(y+26)+'" text-anchor="middle" font-size="11" fill="var(--ink-soft)">'+esc((p.name||"").slice(0,14))+'</text>'+
      '</g>';
    }).join("");
    return '<svg viewBox="0 0 '+w+' 100" class="trv-route-svg">'+lines+dots+'</svg>';
  }

    }).join("")+'</div>';

        var editingPlace = travelEditingPlaceId ? placeById(travelEditingPlaceId) : null;
        var tagsRaw = txt("trv-place-tags");
        var payload = {
          name: name,
          category: catRow ? (catRow.getAttribute("data-selected")||"other") : "other",
          countryCode: txt("trv-place-country"),
          city: txt("trv-place-city"),
          address: txt("trv-place-address"),
          status: statusRow ? (statusRow.getAttribute("data-selected")||"saved") : "saved",
          favorite: document.getElementById("trv-place-favorite").checked,
          tags: tagsRaw ? tagsRaw.split(",").map(function(s){ return s.trim(); }).filter(Boolean) : [],
          note: txt("trv-place-note"),
          updatedAt: todayISO()
        };
        if(travelPendingPlaceCoverImage) payload.coverImage = travelPendingPlaceCoverImage;
        var savedPlace;
        if(editingPlace){
          Object.assign(editingPlace, payload);
          savedPlace = normalizePlace(editingPlace);
          Object.assign(editingPlace, savedPlace);
        } else {
          savedPlace = normalizePlace(Object.assign({ id:uid(), createdAt:todayISO() }, payload));
          state.travel.places.push(savedPlace);
          if(travelAddPlaceTripId && !tripPlaceFor(travelAddPlaceTripId, savedPlace.id)){
            state.travel.tripPlaces.push(normalizeTripPlace({ id:uid(), tripId:travelAddPlaceTripId, placeId:savedPlace.id, dayIndex:null, order:tripPlacesForTrip(travelAddPlaceTripId).length, createdAt:todayISO() }));
          }
        }
        travelCloseModals();
        save(); setTimeout(renderViews,0);
      });
      var trvDeletePlaceBtn = document.querySelector("[data-trv-delete-place]");
      if(trvDeletePlaceBtn) trvDeletePlaceBtn.addEventListener("click", function(){
        var id = trvDeletePlaceBtn.getAttribute("data-trv-delete-place");
        state.travel.places = state.travel.places.filter(function(p){ return p.id!==id; });
        state.travel.tripPlaces = state.travel.tripPlaces.filter(function(tp){ return tp.placeId!==id; });
        state.travel.itinerary.forEach(function(it){ if(it.placeId===id) it.placeId=null; });
        state.travel.photos = state.travel.photos.filter(function(ph){ return ph.placeId!==id; });
        travelCloseModals();
        if(travelPlaceId===id){ travelPage="places"; travelPlaceId=null; }
        save(); setTimeout(renderViews,0);
      });

      /* ---- Places filters ---- */
      var trvPlacesSearch = document.getElementById("trv-places-search");
      if(trvPlacesSearch) trvPlacesSearch.addEventListener("input", function(){ travelSearchQuery = trvPlacesSearch.value; setTimeout(renderViews,0); });
      var trvFilterCategory = document.getElementById("trv-filter-category");
      if(trvFilterCategory) trvFilterCategory.addEventListener("change", function(){ travelPlacesFilter.category = trvFilterCategory.value; renderViews(); });
      var trvFilterStatus = document.getElementById("trv-filter-status");
      if(trvFilterStatus) trvFilterStatus.addEventListener("change", function(){ travelPlacesFilter.status = trvFilterStatus.value; renderViews(); });
      var trvFilterCountry = document.getElementById("trv-filter-country");
      if(trvFilterCountry) trvFilterCountry.addEventListener("change", function(){ travelPlacesFilter.country = trvFilterCountry.value; renderViews(); });

      /* ---- Map ---- */
      Array.prototype.forEach.call(document.querySelectorAll("[data-trv-map-marker]"), function(el){
        el.addEventListener("click", function(){
          var cc = el.getAttribute("data-trv-map-marker");
          travelMapSelected = (travelMapSelected===cc) ? null : cc;
          renderViews();
        });
      });
      var trvMapClose = document.querySelector("[data-trv-map-close]");
      if(trvMapClose) trvMapClose.addEventListener("click", function(){ travelMapSelected=null; renderViews(); });

      /* ---- Trip > Places: link / unlink existing places ---- */
      Array.prototype.forEach.call(document.querySelectorAll("[data-trv-unlink-place]"), function(btn){
        btn.addEventListener("click", function(ev){
          ev.stopPropagation();
          var parts = btn.getAttribute("data-trv-unlink-place").split("|");
          state.travel.tripPlaces = state.travel.tripPlaces.filter(function(tp){ return !(tp.placeId===parts[0] && tp.tripId===parts[1]); });
          save(); renderViews();
        });
      });
      var trvLinkPlaceBtn = document.querySelector("[data-trv-link-place]");
      if(trvLinkPlaceBtn) trvLinkPlaceBtn.addEventListener("click", function(){
        var tripId = trvLinkPlaceBtn.getAttribute("data-trv-link-place");
        var sel = document.getElementById("trv-link-place-select");
        if(!sel || !sel.value) return;
        state.travel.tripPlaces.push(normalizeTripPlace({ id:uid(), tripId:tripId, placeId:sel.value, dayIndex:null, order:tripPlacesForTrip(tripId).length, createdAt:todayISO() }));
        save(); renderViews();
      });

      /* ---- Itinerary items ---- */
      var trvNewItineraryBtn = document.querySelector("[data-trv-new-itinerary]");
      if(trvNewItineraryBtn) trvNewItineraryBtn.addEventListener("click", function(){
        travelEditingItineraryId=null; travelShowAddItinerary=true; renderViews();
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-trv-edit-itinerary]"), function(el){
        el.addEventListener("click", function(){ travelEditingItineraryId = el.getAttribute("data-trv-edit-itinerary"); travelShowAddItinerary=true; renderViews(); });
      });
      var trvItineraryForm = document.getElementById("trv-itinerary-form");
      if(trvItineraryForm) trvItineraryForm.addEventListener("submit", function(ev){
        ev.preventDefault();
        var editingIt = travelEditingItineraryId ? state.travel.itinerary.filter(function(it){ return it.id===travelEditingItineraryId; })[0] : null;
        var payload = {
          type: txt("trv-it-type") || "other",
          title: txt("trv-it-title"),
          time: txt("trv-it-time"),
          endTime: txt("trv-it-endtime"),
          placeId: txt("trv-it-place") || null,
          cost: num("trv-it-cost"),
          notes: txt("trv-it-notes")
        };
        if(editingIt){
          Object.assign(editingIt, payload);
        } else {
          var created = normalizeItineraryItem(Object.assign({ id:uid(), tripId:travelTripId, dayIndex:travelTripDay, order:itineraryForTripDay(travelTripId, travelTripDay).length, createdAt:todayISO() }, payload));
          state.travel.itinerary.push(created);
        }
        travelCloseModals();
        save(); setTimeout(renderViews,0);
      });
      var trvDeleteItineraryBtn = document.querySelector("[data-trv-delete-itinerary]");
      if(trvDeleteItineraryBtn) trvDeleteItineraryBtn.addEventListener("click", function(){
        var id = trvDeleteItineraryBtn.getAttribute("data-trv-delete-itinerary");
        state.travel.itinerary = state.travel.itinerary.filter(function(it){ return it.id!==id; });
        travelCloseModals();
        save(); setTimeout(renderViews,0);
      });

      /* ---- Photos (trip or place context) ---- */
      var trvPhotoInput = document.getElementById("trv-photo-input");
      if(trvPhotoInput) trvPhotoInput.addEventListener("change", function(){
        var file = trvPhotoInput.files && trvPhotoInput.files[0];
        if(!file) return;
        var forTripId = trvPhotoInput.getAttribute("data-trv-photo-trip") || "";
        var forPlaceId = trvPhotoInput.getAttribute("data-trv-photo-place") || null;
        var reader = new FileReader();
        reader.onload = function(e){
          var img = new Image();
          img.onload = function(){
            var maxDim = 640, scale = Math.min(1, maxDim/Math.max(img.width,img.height));
            var w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
            var canvas = document.createElement("canvas"); canvas.width=w; canvas.height=h;
            canvas.getContext("2d").drawImage(img,0,0,w,h);
            var dataUrl = canvas.toDataURL("image/jpeg", 0.7);
            state.travel.photos.push(normalizeTravelPhoto({ id:uid(), tripId:forTripId, placeId:forPlaceId, dataUrl:dataUrl, date:todayISO(), createdAt:todayISO() }));
            save(); renderViews();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-trv-del-photo]"), function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-trv-del-photo");
          state.travel.photos = state.travel.photos.filter(function(ph){ return ph.id!==id; });
          save(); renderViews();
        });
      });

      /* ---- Trip notes + day journal (deferred re-render on blur, same "erasure bug" precaution
         used by every other free-typing field in this app) ---- */
      var trvTripNotes = document.getElementById("trv-trip-notes");
      if(trvTripNotes) trvTripNotes.addEventListener("blur", function(){
        var t = tripById(trvTripNotes.getAttribute("data-trv-notes-trip"));
        if(!t) return;
        t.notes = trvTripNotes.value; t.updatedAt = todayISO();
        save(); setTimeout(renderViews,0);
      });
      var trvDayJournal = document.getElementById("trv-day-journal");
      if(trvDayJournal) trvDayJournal.addEventListener("blur", function(){
        var date = trvDayJournal.getAttribute("data-trv-journal-date");
        if(!date) return;
        state.dayNotes[date] = trvDayJournal.value;
        save();
      });

      /* ---- Trip expenses ---- */
      var trvExpenseForm = document.getElementById("trv-expense-form");
      if(trvExpenseForm) trvExpenseForm.addEventListener("submit", function(ev){
        ev.preventDefault();
        var amount = num("trv-exp-amount");
        if(amount==null || isNaN(amount)) return;
        state.expenses.push({
          id: uid(),
          amount: amount,
          date: txt("trv-exp-date") || todayISO(),
          category: document.getElementById("trv-exp-category").value,
          note: txt("trv-exp-note"),
          tripId: trvExpenseForm.getAttribute("data-trv-trip-id")
        });
        save(); setTimeout(renderViews,0);
      });

      /* ---- Place review ---- */
      var trvReviewForm = document.getElementById("trv-review-form");
      if(trvReviewForm) trvReviewForm.addEventListener("submit", function(ev){
        ev.preventDefault();
        var p = placeById(trvReviewForm.getAttribute("data-trv-review-place"));
        if(!p) return;
        var rating = num("trv-review-rating");
        p.rating = (rating!=null && rating>=1 && rating<=5) ? rating : null;
        p.reviewText = txt("trv-review-text");
        p.reviewDate = txt("trv-review-date") || todayISO();
        p.updatedAt = todayISO();
        save(); setTimeout(renderViews,0);
      });

      /* ---- generic modal close ---- */
      Array.prototype.forEach.call(document.querySelectorAll("[data-trv-modal-cancel]"), function(btn){
        btn.addEventListener("click", function(){ travelCloseModals(); renderViews(); });
      });
      Array.prototype.forEach.call(document.querySelectorAll("[data-trv-modal-backdrop]"), function(backdrop){
        backdrop.addEventListener("click", function(ev){ if(ev.target===backdrop){ travelCloseModals(); renderViews(); } });
      });
    }

  }

  /* ============ init ============ */
  var menuBtn = document.getElementById("menu-btn");
  var navMenu = document.getElementById("nav-menu");
  menuBtn.addEventListener("click", function(ev){
    ev.stopPropagation();
    var willOpen = navMenu.hidden;
    navMenu.hidden = !willOpen;
    menuBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
  });
  document.addEventListener("click", function(ev){
    if(!navMenu.hidden && !navMenu.contains(ev.target) && ev.target!==menuBtn){
      navMenu.hidden = true;
      menuBtn.setAttribute("aria-expanded","false");
    }
    if(openHabitMenu && !ev.target.closest(".habit-menu-wrap")){
      openHabitMenu = null;
      if(activeTab==="habits") renderViews();
    }
    if(calShowQuickAdd && !ev.target.closest(".cal-quickadd-wrap")){
      calShowQuickAdd = false;
      if(activeTab==="calendar") renderViews();
    }
    if(todayShowQuickAdd && !ev.target.closest(".cal-quickadd-wrap")){
      todayShowQuickAdd = false;
      if(activeTab==="today") renderViews();
    }
    if(chalOpenCardMenuId && !ev.target.closest(".habit-menu-wrap")){
      chalOpenCardMenuId = null;
      if(activeTab==="challenges") renderViews();
    }
    if(bodyOpenMenuId && !ev.target.closest(".habit-menu-wrap")){
      bodyOpenMenuId = null;
      if(activeTab==="body") renderViews();
    }
    var accountMenuEl = document.getElementById("account-menu");
    if(accountMenuEl && !accountMenuEl.hidden && !ev.target.closest(".account-wrap")){
      accountMenuEl.hidden = true;
    }
    if(!ev.target.closest(".field-picker-wrap")) closeAnyFieldPicker();
  });
  document.getElementById("account-btn").addEventListener("click", function(ev){
    ev.stopPropagation();
    var menu = document.getElementById("account-menu");
    var willOpen = menu.hidden;
    if(willOpen && currentUser) menu.innerHTML = accountMenuHTML();
    menu.hidden = !willOpen;
  });
  document.addEventListener("click", function(ev){
    if(ev.target.closest("[data-account-export]")){
      exportDataAsJSON();
      document.getElementById("account-menu").hidden = true;
    } else if(ev.target.closest("[data-account-change-pw]")){
      document.getElementById("account-menu").hidden = true;
      showChangePasswordModal();
    } else if(ev.target.closest("[data-account-signout]")){
      document.getElementById("account-menu").hidden = true;
      authSignOut();
    }
  });
  document.addEventListener("keydown", function(ev){
    if(activeTab!=="calendar" || !calDayView || calDayViewTab!=="day") return;
    var tag = (ev.target && ev.target.tagName || "").toLowerCase();
    if(tag==="input" || tag==="textarea" || tag==="select") return;
    if(ev.key==="ArrowLeft"){ calDayView = addDays(calDayView,-1); renderViews(); }
    else if(ev.key==="ArrowRight"){ calDayView = addDays(calDayView,1); renderViews(); }
  });

  load();       // fast local paint prep — state is ready in memory the instant auth resolves
  initAuth();   // shows the sign-in screen, or (if a session already exists) calls onAuthReady(),
                // which itself calls renderTabs()/renderViews() once we know who's signed in

  /* Keep the Antwerp weather reading current in the background, not just when the Today tab
     happens to be wired — a no-op most of the time (fetchAntwerpWeather bails out early if the
     cached reading is still under WEATHER_REFRESH_MS old), so this is cheap even though it
     checks every 5 minutes; the actual network request only goes out roughly every 30. */
  fetchAntwerpWeather();
  setInterval(function(){ fetchAntwerpWeather(); }, 5*60*1000);
})();
</script>
</body>
</html>
