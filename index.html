  /* ---- Continue where you left off ---- */
  function studyContinueSectionHTML(){
    var items = [];
    activeSubjects().forEach(function(s){
      var mats = materialsOf(s.id).filter(function(m){ return materialProgress(m)<100; });
      if(!mats.length) return;
      mats.sort(function(a,b){
        var la = materialLastStudied(a) || a.updatedAt || a.createdAt;
        var lb = materialLastStudied(b) || b.updatedAt || b.createdAt;
        return la<lb ? 1 : la>lb ? -1 : 0;
      });
      var m = mats[0];
      var lastDate = materialLastStudied(m);
      var lastChapter = null;
      var withChapter = materialSessions(m.id).filter(function(ss){ return ss.chapterId; })[0];
      if(withChapter) lastChapter = state.study.chapters.filter(function(c){ return c.id===withChapter.chapterId; })[0];
      items.push({ subject:s, material:m, chapter:lastChapter, progress:materialProgress(m), last:lastDate });
    });
    if(!items.length) return "";
    items.sort(function(a,b){ return (b.last||"")<(a.last||"") ? -1 : (b.last||"")>(a.last||"") ? 1 : 0; });

    var rows = items.map(function(it){
      var c = subjectColorVar(it.subject);
      return '<div class="continue-row" data-continue-material="'+it.material.id+'" data-continue-subject="'+it.subject.id+'">'+
        '<div><span class="ch-label">Subject</span><span style="font-size:.86rem;font-weight:600;color:'+c+'">'+esc(it.subject.name)+'</span></div>'+
        '<div><span class="ch-label">Material</span><div style="font-size:.86rem;font-weight:600">'+esc(it.material.title)+'</div>'+(it.chapter?'<div style="font-size:.76rem;color:var(--ink-faint);margin-top:1px">'+esc(it.chapter.title)+'</div>':'')+'</div>'+
        '<div><span class="ch-label">Progress</span><div class="material-progress-row" style="margin-top:4px"><span class="material-progress-track"><span class="material-progress-fill" style="width:'+it.progress+'%;background:'+c+'"></span></span><span class="material-progress-pct">'+it.progress+'%</span></div></div>'+
        '<div><span class="ch-label">Last studied</span><div style="font-size:.82rem;color:var(--ink-soft)">'+(it.last?esc(daysAgoLabel(it.last)):"—")+'</div></div>'+
      '</div>';
    }).join("");

    return '<div class="panel" style="margin-top:20px">'+
      '<div class="panel-head"><h2>Continue where you left off</h2></div>'+
      '<div class="continue-table">'+
        '<div class="continue-row continue-head"><span>Subject</span><span>Material</span><span>Progress</span><span>Last studied</span></div>'+
        rows+
      '</div>'+
    '</div>';
  }

  /* ---- Overview page ---- */
  function studyOverviewHTML(){
    var today = todayISO();
    var subs = activeSubjects();
    var weekStart = startOfWeekISO(today);
    var lastWeekStart = addDays(weekStart,-7), lastWeekEnd = addDays(weekStart,-1);
    var allSessions = state.study.sessions;
    var weekSessions = allSessions.filter(function(ss){ return inSameWeek(ss.date, today); });
    var lastWeekSessions = allSessions.filter(function(ss){ return ss.date>=lastWeekStart && ss.date<=lastWeekEnd; });
    var weekTotal = weekSessions.reduce(function(s,ss){ return s+Number(ss.minutes||0); },0);
    var weekTrend = last7Days().map(function(iso){
      var mins = allSessions.filter(function(ss){ return ss.date===iso; }).reduce(function(s,ss){ return s+Number(ss.minutes||0); },0);
      return { label: dayLetter(iso), value: mins };
    });
    var sessDelta = weekSessions.length - lastWeekSessions.length;
    var sessDeltaLabel = sessDelta===0 ? "same as last week" : (sessDelta>0?"+":"")+sessDelta+" from last week";

    var ratedSessions = weekSessions.filter(function(ss){ return ss.focusRating; });
    var focusCard;
    if(ratedSessions.length>=3){
      var avgFocusPct = Math.round(ratedSessions.reduce(function(s,ss){ return s+ss.focusRating; },0)/ratedSessions.length/5*100);
      focusCard = '<div class="habit-sum-card" style="--accent:var(--home-purple)">'+
        '<div class="habit-sum-viz">'+ringSVG(avgFocusPct,"var(--home-purple)")+'</div>'+
        '<div class="habit-sum-text"><div class="habit-sum-label">Focus time</div><div class="habit-sum-value">'+avgFocusPct+'%</div><div class="habit-sum-sub">average focused time</div></div>'+
      '</div>';
    } else {
      var avgSessMin = weekSessions.length ? Math.round(weekTotal/weekSessions.length) : 0;
      focusCard = '<div class="habit-sum-card" style="--accent:var(--home-purple)">'+
        '<div class="habit-sum-viz" style="color:var(--home-purple)">'+STOPWATCH_SVG+'</div>'+
        '<div class="habit-sum-text"><div class="habit-sum-label">Average session</div><div class="habit-sum-value">'+(avgSessMin?fmtMinutes(avgSessMin):"—")+'</div><div class="habit-sum-sub">this week</div></div>'+
      '</div>';
    }

    var cardsHTML = '<div class="habit-sum-row">'+
      '<div class="habit-sum-card sum-spark" style="--accent:var(--rose)">'+
        '<div class="habit-sum-viz" style="width:60px">'+dayBarsHTML(weekTrend,"var(--rose)",fmtMinutes)+'</div>'+
        '<div class="habit-sum-text"><div class="habit-sum-label">This week</div><div class="habit-sum-value">'+fmtMinutes(weekTotal)+'</div><div class="habit-sum-sub">focused study</div></div>'+
      '</div>'+
      '<div class="habit-sum-card" style="--accent:var(--ember)">'+
        '<div class="habit-sum-viz" style="color:var(--ember)">'+STOPWATCH_SVG+'</div>'+
        '<div class="habit-sum-text"><div class="habit-sum-label">Sessions</div><div class="habit-sum-value">'+weekSessions.length+'</div><div class="habit-sum-sub">'+sessDeltaLabel+'</div></div>'+
      '</div>'+
      focusCard+
      '<div class="habit-sum-card" style="--accent:var(--steel)">'+
        '<div class="habit-sum-viz" style="color:var(--steel)">'+CAP_SVG+'</div>'+
        '<div class="habit-sum-text"><div class="habit-sum-label">Subjects</div><div class="habit-sum-value">'+subs.length+'</div><div class="habit-sum-sub">active</div></div>'+
      '</div>'+
    '</div>';

      else mins = subjectTotalMinutes(s.id);
      return { label:s.name, value:mins, color:subjectChartColor(s) };
    }).filter(function(e){ return e.value>0; });
    var distTotal = distEntries.reduce(function(s,e){ return s+e.value; },0);
    var scopeLabel = studyDistScope==="week"?"this week":studyDistScope==="month"?"this month":"all time";

        '</div>'+
      '</div>'+
      '<div class="donut-row">'+
        '<div style="flex:none">'+donutSVG(distEntries,150,fmtMinutes(distTotal),scopeLabel)+'</div>'+
        '<div class="summary-list" style="flex:1;min-width:0">'+distListHTML+'</div>'+
      '</div>'+
    '</div>';

    var continueHTML = studyContinueSectionHTML();

    var modals = "";
    if(studyShowNewSubject) modals += studySubjectModalHTML();
    if(studyShowNewSession) modals += studySessionModalHTML();
    if(studyShowAddPlanned) modals += studyPlannedModalHTML();
    if(studyShowAddFocus) modals += studyFocusModalHTML();

    var head = '<div class="habits-head">'+
        '<div><h2>Study</h2><p>Learn deeply. Remember longer.</p></div>'+
        '<button type="button" class="btn btn-primary" style="background:var(--rose)" data-study-new-session>+ New session</button>'+
      '</div>'+
      '<div class="cal-subtabs" style="margin-bottom:18px">'+
        '<button type="button" class="cal-subtab'+(studyMainTab==="overview"?" active":"")+'" data-study-main-tab="overview">Overview</button>'+
        '<button type="button" class="cal-subtab'+(studyMainTab==="plan"?" active":"")+'" data-study-main-tab="plan">Plan</button>'+
      '</div>';

    if(studyMainTab==="plan") return head + studyWeeklyPlanTabHTML() + modals;

    return head+
      '<div class="study-subject-scroll" style="margin-bottom:18px"><div class="subject-pills">'+pillsHTML+'</div></div>'+
      cardsHTML+
      '<div class="study-two-col">'+
        '<div class="panel"><div class="panel-head"><h2>Recent study sessions</h2>'+(allSessions.length>6?'<button type="button" class="cal-link-btn" style="padding:0" data-study-view-all-sessions>'+(studyOverviewShowAllSessions?"Show less":"View all sessions "+ARROW_SVG)+'</button>':'')+'</div>'+recentHTML+'</div>'+
        distHTML+
      '</div>'+
      continueHTML+
      modals;
  }

  function studySubjectStatsTabHTML(s){
    var today = todayISO();
    var sessions = subjectSessions(s.id);
    var totalMin = subjectTotalMinutes(s.id);
    var weekStart = startOfWeekISO(today);
    var weekMin = subjectMinutesInRange(s.id, weekStart, addDays(weekStart,6));
    var monthMin = sessions.filter(function(ss){ return inSameMonth(ss.date,today); }).reduce(function(sum,ss){return sum+Number(ss.minutes||0);},0);
    var avgMin = sessions.length ? Math.round(totalMin/sessions.length) : 0;
    var longest = sessions.reduce(function(mx,ss){ return Math.max(mx, Number(ss.minutes||0)); }, 0);
    var daysStudied = {}; sessions.forEach(function(ss){ daysStudied[ss.date]=true; });
    var daysCount = Object.keys(daysStudied).length;

    var matTotals = {};
    sessions.forEach(function(ss){ if(ss.materialId) matTotals[ss.materialId]=(matTotals[ss.materialId]||0)+Number(ss.minutes||0); });
    var topMatId = Object.keys(matTotals).sort(function(a,b){ return matTotals[b]-matTotals[a]; })[0];
    var topMat = topMatId ? state.study.materials.filter(function(m){ return m.id===topMatId; })[0] : null;

    var chapTotals = {};
    sessions.forEach(function(ss){ if(ss.chapterId) chapTotals[ss.chapterId]=(chapTotals[ss.chapterId]||0)+Number(ss.minutes||0); });
    var topChapId = Object.keys(chapTotals).sort(function(a,b){ return chapTotals[b]-chapTotals[a]; })[0];
    var topChap = topChapId ? state.study.chapters.filter(function(c){ return c.id===topChapId; })[0] : null;

    var methodCounts = {};
    sessions.forEach(function(ss){ (ss.methods||[]).forEach(function(mth){ methodCounts[mth]=(methodCounts[mth]||0)+1; }); });
    var methodsUsed = Object.keys(methodCounts).sort(function(a,b){ return methodCounts[b]-methodCounts[a]; });

    var accent = subjectColorVar(s);
    var streak = subjectStreak(s.id);
    var rows = [
      ["Total study time", fmtMinutes(totalMin)],
      ["Time this week", fmtMinutes(weekMin)],
      ["Time this month", fmtMinutes(monthMin)],
      ["Sessions", String(sessions.length)],
      ["Average session", avgMin?fmtMinutes(avgMin):"—"],
      ["Longest session", longest?fmtMinutes(longest):"—"],
      ["Most studied material", topMat?topMat.title:"—"],
      ["Most studied chapter", topChap?topChap.title:"—"],
      ["Study methods used", methodsUsed.length?methodsUsed.join(", "):"—"],
      ["Days studied", daysCount+" day"+(daysCount===1?"":"s")],
      ["Current streak", streak+" day"+(streak===1?"":"s")]
    ];
    return '<div class="panel"><div class="panel-head"><h2>Stats</h2></div><div class="summary-list">'+
      rows.map(function(r){ return summaryRowHTML(r[0], r[1], accent); }).join("")+
    '</div></div>';
  }

  /* ============ CHALLENGES: computed data ============ */
  function challengeById(id){ return state.challenges.list.filter(function(c){ return c.id===id; })[0] || null; }
  function challengesByStatus(status){
    return state.challenges.list.filter(function(c){ return c.status===status; }).sort(function(a,b){
      var da=a.eventDate||a.endDate||"9999-99-99", db=b.eventDate||b.endDate||"9999-99-99";
      return da<db?-1:da>db?1:0;
    });
  }
  function activeChallengesList(){ return challengesByStatus("active"); }
  function challengeActivitiesFor(id){
    return state.challenges.activities.filter(function(a){ return a.challengeId===id; }).slice().reverse().sort(byDateDesc);
  }
  function challengeCountdown(c){
    var today = todayISO();
    if(c.status==="completed") return { text:"Completed", sub: c.completedDate?fmtShort(c.completedDate):"", kind:"completed" };
    var target = c.eventDate || c.endDate;
    if(!target) return { text:"Ongoing", sub:"", kind:"ongoing" };
    var days = Math.ceil((parseISO(target)-parseISO(today))/86400000);
    if(days<0) return { text:"Past due", sub:fmtShort(target), kind:"overdue" };
    return { text:String(days), sub:"days left", kind:"countdown" };
  }
  function challengeGoalCurrent(c, g){
    if(g.progressType==="manual" || !g.key) return g.manualValue||0;
    var acts = state.challenges.activities.filter(function(a){ return a.challengeId===c.id && a.type===g.key; });
    if(g.period==="weekly") acts = acts.filter(function(a){ return inSameWeek(a.date, todayISO()); });
    else if(g.period==="monthly") acts = acts.filter(function(a){ return inSameMonth(a.date, todayISO()); });
    if(g.type==="distance") return acts.reduce(function(s,a){ return s+(a.distance||0); },0);
    if(g.type==="time") return acts.reduce(function(s,a){ return s+(a.durationMinutes||0); },0);
    if(g.type==="reps") return acts.reduce(function(s,a){ return s+(a.distance||0); },0);
    return acts.length; // sessions | days | pages | chapters | tasks | percentage | custom
  }
  function challengeGoalPct(current, target){
    if(!target) return 0;
    return Math.max(0, Math.min(100, Math.round(current/target*100)));
  }
  function fmtGoalValue(g, value){
    value = Math.round(value*10)/10;
    if(g.type==="time") return fmtMinutes(value);
    if(g.unit) return value+" "+g.unit;
    return String(value);
  }
  /* Day-based progress never assumes elapsed time = progress: it counts days that actually have
     a logged activity (or, when habits are linked, days every linked habit was completed). */
  function challengeDayProgress(c){
    if(c.linkedHabitIds && c.linkedHabitIds.length){
      var habits = c.linkedHabitIds.map(function(id){ return state.habits.filter(function(h){ return h.id===id; })[0]; }).filter(Boolean);
      if(habits.length){
        var count=0, d=c.startDate, today=todayISO(), stop=c.endDate||today;
        while(d<=today && d<=stop){ if(habits.every(function(h){ return h.logs[d]; })) count++; d=addDays(d,1); }
        return count;
      }
    }
    var dates = {};
    state.challenges.activities.forEach(function(a){ if(a.challengeId===c.id) dates[a.date]=true; });
    return Object.keys(dates).length;
  }
  function challengeOverallProgressPct(c){
    if(c.status==="completed") return 100;
    if(c.progressType==="manual") return Math.max(0,Math.min(100, c.manualProgress||0));
    if(c.progressType==="day") return c.dayTarget ? challengeGoalPct(challengeDayProgress(c), c.dayTarget) : 0;
    if(c.progressType==="session"){
      var count = state.challenges.activities.filter(function(a){ return a.challengeId===c.id; }).length;
      return c.sessionsTarget ? challengeGoalPct(count, c.sessionsTarget) : 0;
    }
    if(c.progressType==="milestone"){
      if(!c.milestones.length) return 0;
      return Math.round(c.milestones.filter(function(m){ return m.completed; }).length/c.milestones.length*100);
    }
    var overallGoals = challengeOverallGoals(c);
    if(overallGoals.length){
      var sum=0; overallGoals.forEach(function(g){ sum += challengeGoalPct(challengeGoalCurrent(c,g), g.target); });
      return Math.round(sum/overallGoals.length);
    }
    if(c.goalTarget){
      var acts = state.challenges.activities.filter(function(a){ return a.challengeId===c.id; });
      var isTime = /hour|hr|min/i.test(c.goalUnit||"");
      var current = isTime
        ? acts.reduce(function(s,a){ return s+(a.durationMinutes||0); },0) / (/hour|hr/i.test(c.goalUnit)?60:1)
        : acts.reduce(function(s,a){ return s+(a.distance||0); },0);
      return challengeGoalPct(current, c.goalTarget);
    }
    return 0;
  }
  function challengeStatusBadge(c){
    if(c.status==="completed") return { text:"COMPLETED", color:"var(--good)" };
    if(c.status==="archived") return { text:"ARCHIVED", color:"var(--ink-faint)" };
    var target = c.eventDate||c.endDate;
    if(!target) return { text:"ONGOING", color:"var(--steel)" };
    var today = todayISO();
    var totalSpan = Math.max(1, (parseISO(target)-parseISO(c.startDate))/86400000);
    var elapsed = Math.max(0, (parseISO(today)-parseISO(c.startDate))/86400000);
    var expectedPct = Math.min(100, Math.round(elapsed/totalSpan*100));
    var actualPct = challengeOverallProgressPct(c);
    if(actualPct>=expectedPct-8) return { text:"ON TRACK", color:"var(--good)" };
    if(actualPct>=expectedPct-25) return { text:"SLIGHT BEHIND", color:"var(--mustard)" };
    return { text:"BEHIND", color:"var(--bad)" };
  }
  function challengeWeeklyGoals(c){ return c.goals.filter(function(g){ return g.period==="weekly" && !g.longTerm; }).sort(function(a,b){ return a.order-b.order; }); }
  function challengeOverallGoals(c){ return c.goals.filter(function(g){ return g.period==="overall" && !g.longTerm; }).sort(function(a,b){ return a.order-b.order; }); }
  function challengeLongTermGoals(c){ return c.goals.filter(function(g){ return g.longTerm; }).sort(function(a,b){ return a.order-b.order; }); }
  function challengeWeeklyCompletionPct(c){
    var goals = challengeWeeklyGoals(c);
    if(!goals.length) return null;
    var sum=0; goals.forEach(function(g){ sum += challengeGoalPct(challengeGoalCurrent(c,g), g.target); });
    return Math.round(sum/goals.length);
  }
  function challengePlanRowTypes(c){
    var order=[], seen={};
    function add(key,label){ if(!key || seen[key]) return; seen[key]=true; order.push({key:key,label:label||activityTypeLabel(key)}); }
    challengeWeeklyGoals(c).forEach(function(g){ if(g.key) add(g.key, g.title||activityTypeLabel(g.key)); });
    challengeCategoryMeta(c.category).activityTypes.forEach(function(t){ add(t); });
    return order;
  }
  function challengeWeeklyOverviewRow(c){
    if(c.progressType==="day"){
      var todayD=todayISO(), weekStart=startOfWeekISO(todayD), days=[];
      for(var i=0;i<7;i++) days.push(addDays(weekStart,i));
      var doneDays = days.filter(function(iso){ return iso<=todayD && state.challenges.activities.some(function(a){ return a.challengeId===c.id && a.date===iso; }); }).length;
      var elapsedDays = days.filter(function(iso){ return iso<=todayD; }).length;
      return { goalLabel:"Daily tasks", progressLabel:doneDays+" / 7 days", pct: elapsedDays?Math.round(doneDays/elapsedDays*100):0 };
    }
    var goals = challengeWeeklyGoals(c);
    if(!goals.length) return { goalLabel:"—", progressLabel:"—", pct:null };
    if(goals.length===1){
      var g=goals[0], cur=challengeGoalCurrent(c,g);
      return { goalLabel: fmtGoalValue(g,g.target), progressLabel: fmtGoalValue(g,cur), pct: challengeGoalPct(cur,g.target) };
    }
    var pct = challengeWeeklyCompletionPct(c);
    return { goalLabel: goals.length+" weekly goals", progressLabel: pct+"% avg", pct: pct };
  }
  function challengesTotalTrainingStats(){
    var today = todayISO();
    var weekStart = startOfWeekISO(today), lastWeekStart = addDays(weekStart,-7);
    function sumBetween(start,end){
      return state.challenges.activities.filter(function(a){ return a.date>=start && a.date<=end; }).reduce(function(s,a){ return s+(a.durationMinutes||0); },0);
    }
    var t = parseISO(today);
    var thisMK = monthKey(t.getFullYear(), t.getMonth());
    var prev = prevMonthOf(t.getFullYear(), t.getMonth());
    var prevMK = monthKey(prev.y, prev.m);
    var days7 = last7Days().map(function(iso){
      return { label:dayLetter(iso), value: state.challenges.activities.filter(function(a){ return a.date===iso; }).reduce(function(s,a){ return s+(a.durationMinutes||0); },0) };
    });
    return {
      thisWeekMin: sumBetween(weekStart, addDays(weekStart,6)),
      lastWeekMin: sumBetween(lastWeekStart, addDays(lastWeekStart,6)),
      thisMonthMin: state.challenges.activities.filter(function(a){ return a.date.slice(0,7)===thisMK; }).reduce(function(s,a){ return s+(a.durationMinutes||0); },0),
      prevMonthMin: state.challenges.activities.filter(function(a){ return a.date.slice(0,7)===prevMK; }).reduce(function(s,a){ return s+(a.durationMinutes||0); },0),
      days7: days7
    };
  }
  function trainingDeltaLabel(cur, prev, period){
    var diff = cur-prev;
    if(diff===0) return "Same as "+period;
    return (diff>0?"+":"−")+fmtMinutes(Math.abs(diff))+" from "+period;
  }
  function challengeKeyStats(c){
    var acts = state.challenges.activities.filter(function(a){ return a.challengeId===c.id; });
    var totalMin = acts.reduce(function(s,a){ return s+(a.durationMinutes||0); },0);
    var stats = [ { label:"Total training time", value: fmtMinutes(totalMin) }, { label:"Total sessions", value:String(acts.length) } ];
    var longest = {};
    acts.forEach(function(a){ if(a.distance) longest[a.type] = Math.max(longest[a.type]||0, a.distance); });
    Object.keys(longest).forEach(function(t){ stats.push({ label:"Longest "+activityTypeLabel(t).toLowerCase(), value:(Math.round(longest[t]*10)/10)+" km" }); });
    return stats;
  }

  function challengePlanTabHTML(c){

    var gridRows = rows.map(function(r){

        return '<td class="chal-plan-cell">'+items.map(function(p){
          return '<div class="chal-plan-item'+(p.completed?" done":"")+'" data-chal-plan-open="'+p.id+'">'+(p.completed?'<span class="chal-plan-check">'+CHECK_SVG+'</span> ':'')+esc(p.title)+'</div>';
        }).join("")+'</td>';
      }).join("");
      return '<tr><th>'+esc(r.label)+'</th>'+cells+'</tr>';

          '<div class="material-progress-track"><span class="material-progress-fill" style="width:'+p+'%;background:'+color+'"></span></div></div>';

      (focusItems.length ? '<div class="stack" style="gap:8px">'+focusItems.map(function(f){

  function challengeStatsTabHTML(c){
    var color = challengeColorVar(c);
    var acts = state.challenges.activities.filter(function(a){ return a.challengeId===c.id; });
    var totalMin = acts.reduce(function(s,a){ return s+(a.durationMinutes||0); },0);
    var byType = {};
    acts.forEach(function(a){ byType[a.type]=byType[a.type]||{count:0,dist:0}; byType[a.type].count++; byType[a.type].dist+=(a.distance||0); });
    var distEntries = Object.keys(byType).filter(function(t){ return byType[t].dist>0; }).map(function(t){ return { label:activityTypeLabel(t), value:Math.round(byType[t].dist*10)/10, color:color }; });
    var trainingDays = {}; acts.forEach(function(a){ trainingDays[a.date]=true; });
    var trainingDayCount = Object.keys(trainingDays).length;
    var totalSpanDays = Math.max(1, Math.round((parseISO(todayISO())-parseISO(c.startDate))/86400000)+1);
    var restDays = Math.max(0, totalSpanDays-trainingDayCount);
    var avgWeeklyMin = Math.round(totalMin/Math.max(1, totalSpanDays/7));
    var longest = {}; acts.forEach(function(a){ if(a.distance) longest[a.type]=Math.max(longest[a.type]||0, a.distance); });
    var stats = [
      { label:"Total training time", value:fmtMinutes(totalMin) },
      { label:"Sessions", value:String(acts.length) },
      { label:"Average weekly volume", value:fmtMinutes(avgWeeklyMin) },
      { label:"Average session duration", value: acts.length?fmtMinutes(Math.round(totalMin/acts.length)):"—" },
      { label:"Training days", value:String(trainingDayCount) },
      { label:"Rest days", value:String(restDays) }
    ];
    Object.keys(longest).forEach(function(t){ stats.push({ label:"Longest "+activityTypeLabel(t).toLowerCase(), value:(Math.round(longest[t]*10)/10)+" km" }); });
    var wPct = challengeWeeklyCompletionPct(c);
    if(wPct!=null) stats.push({ label:"Weekly goal completion", value:wPct+"%" });
    var planned = state.challenges.planned.filter(function(p){ return p.challengeId===c.id; });
    var weekStart = startOfWeekISO(todayISO());
    var plannedThisWeek = planned.filter(function(p){ return p.date>=weekStart && p.date<=addDays(weekStart,6); });
    var completedThisWeek = plannedThisWeek.filter(function(p){ return p.completed || p.completedActivityId; });
    var planCompletion = plannedThisWeek.length ? Math.round(completedThisWeek.length/plannedThisWeek.length*100) : null;
    return '<div class="study-two-col">'+
      '<div class="panel"><div class="panel-head"><h2>Stats</h2></div><div class="summary-list">'+stats.map(function(s){ return summaryRowHTML(s.label,s.value,color); }).join("")+'</div></div>'+
      '<div class="panel"><div class="panel-head"><h2 style="font-size:.9rem">Distance by activity</h2></div>'+(distEntries.length?barListHTML(distEntries,color,function(v){ return v+" km"; }):'<p class="empty">No distance logged yet.</p>')+'</div>'+
    '</div>'+
    '<div class="panel"><div class="panel-head"><h2 style="font-size:.9rem">Plan vs. actual — this week</h2></div>'+
      (plannedThisWeek.length ? '<div class="summary-list">'+
        summaryRowHTML("Sessions planned", String(plannedThisWeek.length), color)+
        summaryRowHTML("Sessions completed", String(completedThisWeek.length), color)+
        summaryRowHTML("Plan completion", planCompletion+"%", color)+
      '</div>' : '<p class="empty">No sessions planned this week yet.</p>')+
    '</div>';
  }

  /* ============ CALENDAR view ============ */
  function activityForDate(iso){
    var habitsDone = state.habits.filter(function(h){ return h.logs[iso]; });
    var expenses = state.expenses.filter(function(e){ return e.date===iso; });
    var workouts = state.workouts.filter(function(w){ return w.date===iso; });
    // Library activity that day, across every category (not just Books) — a disclosed
    // simplification vs. giving each Library category its own Calendar dot color: the month
    // grid already caps at 4 dots + overflow, so every Library category shares one dot color
    // (the same home-blue that Reading used before Library replaced it) rather than fragmenting
    // an already-dense legend into 6+ more colors.
    var libraryUpdates = state.library.activity.filter(function(a){ return a.date===iso; }).map(function(a){
      var item = state.library.items.filter(function(it){ return it.id===a.itemId; })[0];
      return { activity:a, item:item };
    }).filter(function(x){ return x.item; });
    var studySessions = state.study.sessions.filter(function(ss){ return ss.date===iso; });
    var chalSessions = state.challenges.activities.filter(function(a){ return a.date===iso; });
    return { habitsDone:habitsDone, expenses:expenses, workouts:workouts, libraryUpdates:libraryUpdates, studySessions:studySessions, chalSessions:chalSessions };
  }
  /* Calendar category legend: olive=training/movement, mustard=habits, terracotta=expenses,
     blue=library, purple=studying/focus, teal=Ironman/endurance. */
  function activityDots(a){
    var dots = [];
    if(a.habitsDone.length) dots.push("var(--mustard)");
    if(a.workouts.length) dots.push("var(--good)");
    if(a.chalSessions.length) dots.push("var(--home-teal)");
    if(a.expenses.length) dots.push("var(--ember)");
    if(a.libraryUpdates.length) dots.push("var(--home-blue)");
    if(a.studySessions.length) dots.push("var(--home-purple)");
    return dots;
  }
  function activityTotal(a){
    return a.habitsDone.length + a.expenses.length + a.workouts.length + a.libraryUpdates.length + a.studySessions.length + a.chalSessions.length;
  }

  /* ---- time-block categories ---- */
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  var BRIEFCASE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M8 7.5V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v1.5"/><path d="M3 12.5h18"/></svg>';
  var FORK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2v8M9 2v6a2 2 0 0 1-4 0V2M7 10v12M17 2c-2 0-3 3-3 6s1 4 3 4v10"/></svg>';
  var PEOPLE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17.5" cy="9" r="2.3"/><path d="M15.7 14.2c2.2.4 4.3 2.3 4.3 5.8"/></svg>';

  var TIME_BLOCK_CATS = [
    { key:"personal",    label:"Personal",    color:"var(--steel)" },
    { key:"habit",       label:"Habit",       color:"var(--mustard)" },
    { key:"training",    label:"Training",    color:"var(--good)" },
    { key:"reading",     label:"Reading",     color:"var(--home-blue)" },
    { key:"study",       label:"Study",       color:"var(--home-purple)" },
    { key:"work",        label:"Work",        color:"var(--plum)" },
    { key:"meal",        label:"Meal",        color:"var(--rose)" },
    { key:"appointment", label:"Appointment", color:"var(--ember)" },
    { key:"other",       label:"Other",       color:"var(--ink-faint)" }
  ];
  function timeBlockCatMeta(key){
    return TIME_BLOCK_CATS.filter(function(c){ return c.key===key; })[0] || TIME_BLOCK_CATS[TIME_BLOCK_CATS.length-1];
  }

  var DAY_START_HOUR = 6, DAY_END_HOUR = 21, PX_PER_MIN = 56/60;
  function timeToMinutes(t){ if(!t) return null; var p=t.split(":").map(Number); return p[0]*60+(p[1]||0); }
  function blockDurationMin(b){
    var s = timeToMinutes(b.startTime), e = timeToMinutes(b.endTime);
    if(s==null) return b.duration||30;
    if(e==null) return b.duration||30;
    var d = e-s; if(d<=0) d += 1440;
    return d;
  }

  function dayPlanItems(iso){
    var active = activeHabits();
    var items = active.map(function(h){
      return { id:"habit:"+h.id, kind:"habit", title:h.name, completed: !!h.logs[iso], order:h.order };
    });
    var customs = state.dailyPlan.filter(function(p){ return p.date===iso; }).map(function(p){
      return { id:p.id, kind:"plan", title:p.title, completed:!!p.completed, order: (typeof p.order==="number") ? p.order : 999 };
    });
    var all = items.concat(customs);
    all.sort(function(a,b){ return (a.order||0)-(b.order||0); });
    var done = all.filter(function(i){ return i.completed; }).length;
    return { items:all, done:done, total:all.length };
  }

  function scheduleForDate(iso){
    return state.timeBlocks.filter(function(b){ return b.date===iso; }).sort(function(a,b){
      return timeToMinutes(a.startTime)-timeToMinutes(b.startTime);
    });
  }

  /* "Planned vs logged": a time block is shown as completed either because the user explicitly
     ticked it, or (best-effort, not a persisted link) because a matching real record exists for
     that date + category. This keeps calendar plans from silently corrupting real tracking stats —
     nothing here writes back into workouts/study/reading data. */
  function blockAutoCompleted(b){
    if(b.completed) return true;
    if(b.category==="training") return state.workouts.some(function(w){ return w.date===b.date; }) || state.challenges.activities.some(function(a){ return a.date===b.date; });
    if(b.category==="reading") return pagesReadOnDate(b.date)>0;
    if(b.category==="study") return state.study.sessions.some(function(ss){ return ss.date===b.date; });
    if(b.category==="habit") return state.habits.some(function(h){ return h.logs[b.date]; });
    return false;
  }
  function blockLoggedDetail(b){
    if(b.category==="training"){
      var km=0, min=0;
      state.challenges.activities.forEach(function(a){ if(a.date===b.date && (a.type==="run"||a.type==="run-long") && a.distance) km += Number(a.distance||0); });
      state.workouts.forEach(function(w){ if(w.date===b.date) min += Number(w.duration||0); });
      state.challenges.activities.forEach(function(a){ if(a.date===b.date) min += Number(a.durationMinutes||0); });
      var parts=[]; if(km>0) parts.push(km+"km"); if(min>0) parts.push(min+" min");
      return (parts.length? parts.join(" · ")+" " : "")+"completed";
    }
    if(b.category==="reading"){ var p=pagesReadOnDate(b.date); return (p>0? p+" pages ":"")+"completed"; }
    if(b.category==="study"){
      var m = state.study.sessions.filter(function(ss){ return ss.date===b.date; }).reduce(function(s,ss){ return s+Number(ss.minutes||0); },0);
      return (m>0? fmtMinutes(m)+" ":"")+"completed";
    }
    return "completed";
  }

  function daySummary(iso){
    if(iso>todayISO()) return { future:true };
    var active = activeHabits();
    var doneH = active.filter(function(h){ return h.logs[iso]; }).length;
    var km=0; state.challenges.activities.forEach(function(a){ if(a.date===iso && (a.type==="run"||a.type==="run-long") && a.distance) km += Number(a.distance||0); });
    var focusMin = state.study.sessions.filter(function(ss){ return ss.date===iso; }).reduce(function(s,ss){ return s+Number(ss.minutes||0); },0);
    var pages = pagesReadOnDate(iso);
    var spent = state.expenses.filter(function(e){ return e.date===iso; }).reduce(function(s,e){ return s+Number(e.amount||0); },0);
    return { future:false, habitsDone:doneH, habitsTotal:active.length, km:km, focusMin:focusMin, pages:pages, spent:spent };
  }

  function summaryRowHTML(label, value, color){
    return '<div class="summary-row"><span class="summary-dot" style="background:'+color+'"></span>'+
      '<span class="summary-label">'+esc(label)+'</span><span class="summary-val'+(value==="—"?" dim":"")+'">'+value+'</span></div>';
  }
  function summaryRowsHTML(iso){
    var sum = daySummary(iso);
    if(sum.future) return ["Habits","Training","Focus","Reading","Spending"].map(function(l){ return summaryRowHTML(l,"—","var(--border)"); }).join("");
    /* Today/past days show real numbers even when zero — a day that already happened with
       nothing logged is a fact ("0 km"), not an unknown ("—"). Only a day that hasn't
       happened yet uses the dash, handled by the `sum.future` branch above. */
    return summaryRowHTML("Habits", sum.habitsTotal? (sum.habitsDone+" / "+sum.habitsTotal) : "—", "var(--mustard)")+
      summaryRowHTML("Training", sum.km+" km", "var(--good)")+
      summaryRowHTML("Focus", fmtMinutes(sum.focusMin), "var(--home-purple)")+
      summaryRowHTML("Reading", sum.pages+" pages", "var(--home-blue)")+
      summaryRowHTML("Spending", money(sum.spent), "var(--ember)");
  }

  function planColumnHTML(iso){
    var plan = dayPlanItems(iso);
    var rows = !plan.items.length ? '<p class="plan-empty">Nothing planned for this day.</p>' :
      '<div class="plan-list">'+ plan.items.map(function(it){
        return '<div class="plan-row'+(it.completed?" done":"")+'">'+
          '<button type="button" class="plan-check" data-plan-toggle="'+it.id+'" data-plan-date="'+iso+'">'+CHECK_SVG+'</button>'+
          '<span class="plan-label" data-plan-toggle="'+it.id+'" data-plan-date="'+iso+'">'+esc(it.title)+'</span>'+
          (calShowPlanEdit && it.kind==="plan" ? '<button type="button" class="plan-del" data-plan-del="'+it.id+'" data-plan-date="'+iso+'" title="Remove">✕</button>' : '')+
        '</div>';
      }).join("") + '</div>';
    var addRow = calShowPlanEdit ? '<form class="plan-add-row" id="plan-add-form" data-plan-add-date="'+iso+'"><input type="text" id="plan-add-input" placeholder="Add a task…" maxlength="80"><button class="btn btn-primary" type="submit" style="padding:.4rem .7rem">+</button></form>' : '';
    return rows + '<div class="plan-progress">'+plan.done+' / '+plan.total+' done</div>' + addRow;
  }

  function schedRowHTML(b, opts){
    opts = opts || {};
    var meta = timeBlockCatMeta(b.category);
    var completed = blockAutoCompleted(b);
    var dur = blockDurationMin(b);
    var metaText = completed ? blockLoggedDetail(b) : (b.notes ? esc(b.notes) : (b.endTime ? dur+" min" : ""));
    var clickAttr = opts.clickOpensDay ? ' data-cal-open-day="'+b.date+'"' : ' data-block-edit="'+b.id+'"';
    return '<div class="sched-row"'+clickAttr+'>'+
      '<span class="sched-time">'+b.startTime+'</span>'+
      '<span class="sched-swatch" style="background:'+meta.color+'"></span>'+
      '<div class="sched-main"><div class="sched-title'+(completed?" done":"")+'">'+(completed?"✓ ":"")+esc(b.title)+'</div>'+
        (metaText ? '<div class="sched-meta">'+metaText+'</div>' : '')+
      '</div>'+
    '</div>';
  }

  function timelineEventHTML(b){
    var meta = timeBlockCatMeta(b.category);
    var totalHeight = (DAY_END_HOUR-DAY_START_HOUR+1)*56;
    var s = timeToMinutes(b.startTime);
    var dur = blockDurationMin(b);
    var top = Math.max(0, Math.min(totalHeight-24, (s-DAY_START_HOUR*60)*PX_PER_MIN));
    var height = Math.max(24, dur*PX_PER_MIN);
    if(top+height>totalHeight) height = Math.max(24, totalHeight-top);
    var completed = blockAutoCompleted(b);
    var metaLine = completed ? blockLoggedDetail(b) : (b.notes ? esc(b.notes) : (b.endTime? dur+" min" : ""));
    var showMeta = metaLine && height>=48;
    return '<div class="cal-event" style="top:'+top+'px;height:'+height+'px;--accent:'+meta.color+'" data-block-edit="'+b.id+'">'+
      '<div class="cal-event-time">'+b.startTime+(b.endTime?"–"+b.endTime:"")+'</div>'+
      '<div class="cal-event-title'+(completed?" completed":"")+'">'+(completed?"✓ ":"")+esc(b.title)+'</div>'+
      (showMeta ? '<div class="cal-event-meta">'+metaLine+'</div>' : '')+
      '<div class="cal-event-actions">'+
        '<button type="button" class="sched-check" data-block-toggle="'+b.id+'" title="Mark completed">'+CHECK_SVG+'</button>'+
        '<button type="button" data-block-del="'+b.id+'" title="Delete">✕</button>'+
      '</div>'+
    '</div>';
  }

  function timelineHTML(iso){
    var totalHeight = (DAY_END_HOUR-DAY_START_HOUR+1)*56;
    var rowsHTML = "";
    for(var h=DAY_START_HOUR; h<=DAY_END_HOUR; h++){
      rowsHTML += '<div class="cal-hour-row" data-hour-slot="'+pad(h)+':00"><span class="cal-hour-label">'+pad(h)+':00</span></div>';
    }
    var blocks = scheduleForDate(iso);
    var nowLine = "";
    if(iso===todayISO()){
      var now = new Date();
      var nowMin = now.getHours()*60+now.getMinutes();
      if(nowMin>=DAY_START_HOUR*60 && nowMin<=(DAY_END_HOUR+1)*60){
        var top = (nowMin-DAY_START_HOUR*60)*PX_PER_MIN;
        nowLine = '<div class="cal-now-line" style="top:'+top+'px"><span>'+pad(now.getHours())+":"+pad(now.getMinutes())+'</span></div>';

  /* ---------- Themed date/time field pickers ----------
     Swap in for a plain input[type=date]/input[type=time] (now stored as type=hidden in the field
     markup above, keeping the same id/.value contract every existing form-submit handler already
     reads) with a small in-theme popover, so the picker itself matches the app instead of falling
     back to the browser's own unstyleable native calendar/clock UI. Deliberately NOT wired through
     state/renderViews() — these attach directly into an already-open form, and a full re-render
     would wipe out anything else the user has typed elsewhere in that same form (the same reason
     cascading fields elsewhere in this app are patched directly rather than re-rendered). Each
     picker keeps its own tiny closure state and, on selection, sets the wrapped input's .value and
     dispatches a change event, so nothing downstream needs to change. Call attachFieldPickers()
     after any render that might have inserted a date/time field — renderViews() does this for
     every tab automatically. */
  function fmtDatePretty(iso){
    if(!iso) return "Select date";
    return parseISO(iso).toLocaleDateString(undefined,{ weekday:"short", month:"short", day:"numeric", year:"numeric" });
  }
  function fmtTimePretty(hhmm){
    if(!hhmm) return "Select time";
    var parts = hhmm.split(":"); var h = parseInt(parts[0],10), m = parts[1];
    var ampm = h>=12 ? "PM":"AM"; var h12 = h%12; if(h12===0) h12=12;
    return h12+":"+m+" "+ampm;
  }
  function closeAnyFieldPicker(){
    Array.prototype.forEach.call(document.querySelectorAll(".field-picker-pop"), function(p){ p.remove(); });
  }
  function fieldPickerWrap(inputEl){
    var wrap = document.createElement("div");
    wrap.className = "field-picker-wrap";
    inputEl.parentNode.insertBefore(wrap, inputEl);
    wrap.appendChild(inputEl);
    var trigger = document.createElement("button");
    trigger.type = "button";
    wrap.appendChild(trigger);
    return { wrap:wrap, trigger:trigger };
  }
  function attachDatePicker(inputEl){
    if(!inputEl || inputEl.dataset.fpAttached) return;
    inputEl.dataset.fpAttached = "1";
    var built = fieldPickerWrap(inputEl), wrap = built.wrap, trigger = built.trigger;
    function refreshTrigger(){
      trigger.className = "field-picker-trigger"+(inputEl.value?"":" empty");
      trigger.innerHTML = '<span class="fp-trigger-label">'+esc(fmtDatePretty(inputEl.value))+'</span><span class="fp-icon">'+CALENDAR_SVG+'</span>';
    }
    refreshTrigger();
    var cur = parseISO(inputEl.value || todayISO());
    var cursorY = cur.getFullYear(), cursorM = cur.getMonth();
    function renderPop(){
      closeAnyFieldPicker();
      var pop = document.createElement("div");
      pop.className = "field-picker-pop";
      var monthLabel = new Date(cursorY,cursorM,1).toLocaleDateString(undefined,{ month:"long", year:"numeric" });
      var totalDays = new Date(cursorY,cursorM+1,0).getDate();
      var leadBlanks = (new Date(cursorY,cursorM,1).getDay()+6)%7; // Monday-first, matches the main Calendar grid
      var prevMonthDays = new Date(cursorY,cursorM,0).getDate();
      var todayIso = todayISO();
      var wdLabels = ["M","T","W","T","F","S","S"];
      var cellsHtml = "";
      for(var i=0;i<leadBlanks;i++){
        cellsHtml += '<button type="button" class="fp-cal-day other-month" disabled>'+(prevMonthDays-leadBlanks+1+i)+'</button>';
      }
      for(var day=1; day<=totalDays; day++){
        var iso = cursorY+"-"+pad(cursorM+1)+"-"+pad(day);
        var cls = "fp-cal-day"+(iso===todayIso?" today":"")+(iso===inputEl.value?" selected":"");
        cellsHtml += '<button type="button" class="'+cls+'" data-fp-date="'+iso+'">'+day+'</button>';
      }
      pop.innerHTML = '<div class="fp-cal-head">'+
          '<button type="button" data-fp-nav="prev">‹</button>'+
          '<span class="fp-cal-label">'+esc(monthLabel)+'</span>'+
          '<button type="button" data-fp-nav="next">›</button>'+
        '</div>'+
        '<div class="fp-cal-grid">'+ wdLabels.map(function(w){ return '<div class="fp-cal-wd">'+w+'</div>'; }).join("") + cellsHtml + '</div>';
      wrap.appendChild(pop);
      pop.addEventListener("click", function(ev){ ev.stopPropagation(); });
      Array.prototype.forEach.call(pop.querySelectorAll("[data-fp-date]"), function(btn){
        btn.addEventListener("click", function(){
          inputEl.value = btn.getAttribute("data-fp-date");
          refreshTrigger();
          inputEl.dispatchEvent(new Event("change", { bubbles:true }));
          closeAnyFieldPicker();
        });
      });
      pop.querySelector('[data-fp-nav="prev"]').addEventListener("click", function(){ cursorM--; if(cursorM<0){ cursorM=11; cursorY--; } renderPop(); });
      pop.querySelector('[data-fp-nav="next"]').addEventListener("click", function(){ cursorM++; if(cursorM>11){ cursorM=0; cursorY++; } renderPop(); });
    }
    trigger.addEventListener("click", function(ev){
      ev.stopPropagation();
      var already = wrap.querySelector(".field-picker-pop");
      closeAnyFieldPicker();
      if(already) return;
      var d0 = parseISO(inputEl.value || todayISO()); cursorY = d0.getFullYear(); cursorM = d0.getMonth();
      renderPop();
    });
  }
  function attachTimePicker(inputEl){
    if(!inputEl || inputEl.dataset.fpAttached) return;
    inputEl.dataset.fpAttached = "1";
    var built = fieldPickerWrap(inputEl), wrap = built.wrap, trigger = built.trigger;
    function refreshTrigger(){
      trigger.className = "field-picker-trigger"+(inputEl.value?"":" empty");
      trigger.innerHTML = '<span class="fp-trigger-label">'+esc(fmtTimePretty(inputEl.value))+'</span><span class="fp-icon">'+CLOCK_SVG+'</span>';
    }
    refreshTrigger();
    function renderPop(){
      closeAnyFieldPicker();
      var pop = document.createElement("div");
      pop.className = "field-picker-pop";
      pop.addEventListener("click", function(ev){ ev.stopPropagation(); });
      var list = document.createElement("div");
      list.className = "fp-time-list";
      var rowsHtml = "";
      for(var mins=0; mins<24*60; mins+=15){
        var hhmm = pad(Math.floor(mins/60))+":"+pad(mins%60);
        rowsHtml += '<button type="button" class="fp-time-opt'+(hhmm===inputEl.value?" selected":"")+'" data-fp-time="'+hhmm+'">'+fmtTimePretty(hhmm)+'</button>';
      }
      list.innerHTML = rowsHtml;
      pop.appendChild(list);
      wrap.appendChild(pop);
      var sel = list.querySelector(".selected");
      if(sel) sel.scrollIntoView({ block:"center" });
      list.addEventListener("click", function(ev){
        var btn = ev.target.closest("[data-fp-time]");
        if(!btn) return;
        inputEl.value = btn.getAttribute("data-fp-time");
        refreshTrigger();
        inputEl.dispatchEvent(new Event("change", { bubbles:true }));
        closeAnyFieldPicker();
      });
    }
    trigger.addEventListener("click", function(ev){
      ev.stopPropagation();
      var already = wrap.querySelector(".field-picker-pop");
      closeAnyFieldPicker();
      if(already) return;
      renderPop();
    });
  }
  /* Themed replacement for a plain <select> — same rationale as the date/time pickers: a
     select's CLOSED state is stylable with plain CSS, but the OPEN native option list is browser
     chrome with no theme access. Reuses the exact same .field-picker-trigger/.field-picker-pop
     shell and the time-list's row styling (.fp-time-list/.fp-time-opt) rather than inventing new
     CSS, since a scrollable list of clickable rows is exactly what both need.

     The tricky part is every cascading select already in this app (Study's Subject→Material→
     Chapter, Challenges' sport-type→session-type) — existing code rebuilds a DEPENDENT select's
     innerHTML directly (see "session modal: dependent select cascades" in wireView) with no
     signal beyond that DOM mutation. Two things make this work without touching any of that
     existing cascade code: (1) the popover's option list is built fresh from the live <select>
     every time it's opened, never cached, so a rebuilt option list is picked up automatically;
     (2) a MutationObserver on each wrapped select's childList keeps the CLOSED trigger's label in
     sync too, so it updates even without being opened. Selecting an option sets the real
     select's .value and dispatches a real "change" event, so every existing addEventListener
     ("change", ...) cascade handler on that select fires exactly as if the user had used the
     native control — nothing downstream needed to change. */
  function attachSelectPicker(selectEl){
    if(!selectEl || selectEl.dataset.fpAttached) return;
    selectEl.dataset.fpAttached = "1";
    var extraClass = selectEl.className ? " "+selectEl.className : "";
    var extraStyle = selectEl.getAttribute("style") || "";
    var built = fieldPickerWrap(selectEl), wrap = built.wrap, trigger = built.trigger;
    selectEl.style.display = "none"; // unlike the hidden date/time inputs, a <select> renders by default
    function currentOption(){ return selectEl.options[selectEl.selectedIndex] || null; }
    function refreshTrigger(){
      var opt = currentOption();
      var label = opt ? opt.textContent : "";
      trigger.className = "field-picker-trigger select-trigger"+extraClass+(label?"":" empty");
      if(extraStyle) trigger.setAttribute("style", extraStyle);
      trigger.disabled = !!selectEl.disabled;
      trigger.innerHTML = '<span class="fp-trigger-label">'+esc(label)+'</span><span class="fp-icon">'+CHEVRON_DOWN_SVG+'</span>';
    }
    refreshTrigger();
    // Keeps the closed trigger's label correct even when some OTHER field's cascade handler
    // rewrites this select's options out from under it (no event fires for that — only a DOM
    // mutation), e.g. picking a Subject rebuilds the Material select's entire option list.
    new MutationObserver(refreshTrigger).observe(selectEl, { childList:true, subtree:true });
    function renderPop(){
      closeAnyFieldPicker();
      var pop = document.createElement("div");
      pop.className = "field-picker-pop";
      pop.addEventListener("click", function(ev){ ev.stopPropagation(); });
      var list = document.createElement("div");
      list.className = "fp-time-list";
      var rowsHtml = "";
      Array.prototype.forEach.call(selectEl.options, function(opt, i){
        rowsHtml += '<button type="button" class="fp-time-opt'+(i===selectEl.selectedIndex?" selected":"")+'" data-fp-idx="'+i+'" data-fp-value="'+esc(opt.value)+'">'+esc(opt.textContent)+'</button>';
      });
      list.innerHTML = rowsHtml;
      pop.appendChild(list);
      wrap.appendChild(pop);
      var sel = list.querySelector(".selected");
      if(sel) sel.scrollIntoView({ block:"center" });
      list.addEventListener("click", function(ev){
        var btn = ev.target.closest("[data-fp-idx]");
        if(!btn) return;
        selectEl.selectedIndex = Number(btn.getAttribute("data-fp-idx"));
        refreshTrigger();
        selectEl.dispatchEvent(new Event("change", { bubbles:true }));
        closeAnyFieldPicker();
      });
    }
    trigger.addEventListener("click", function(ev){
      ev.stopPropagation();
      if(selectEl.disabled) return;
      var already = wrap.querySelector(".field-picker-pop");
      closeAnyFieldPicker();
      if(already) return;
      renderPop();
    });
  }
  /* Scans the whole rendered view for any field opted into the themed picker (marked with
     data-picker="date"/"time"/"select" on the field markup, app-wide — Calendar/Today's
     time-block form, Expenses, Workouts, Library, every Study field, every Challenges field)
     rather than hardcoding each field's id, so a future date/time/select field just needs the
     attribute to pick up the same themed widget automatically. */
  function attachFieldPickers(){
    Array.prototype.forEach.call(document.querySelectorAll('input[data-picker="date"]'), attachDatePicker);
    Array.prototype.forEach.call(document.querySelectorAll('input[data-picker="time"]'), attachTimePicker);
    Array.prototype.forEach.call(document.querySelectorAll('select[data-picker="select"]'), attachSelectPicker);
  }

  /* editingId/prefill default to Calendar's own transient vars when omitted, so every existing
     Calendar call site is unchanged — Today (and any future caller) passes its own instead,
     since only one "add/edit time block" modal is ever open on screen at a time regardless of
     which tab opened it. */
  function blockFormValsFromState(dateIso, editingId, prefill){
    if(editingId===undefined) editingId = calEditingBlockId;
    if(prefill===undefined) prefill = calAddBlockPrefill;
    var editing = editingId ? state.timeBlocks.filter(function(b){ return b.id===editingId; })[0] : null;
    if(editing){
      return { editing:editing, date:editing.date, startTime:editing.startTime, endTime:editing.endTime||"", title:editing.title, notes:editing.notes||"", category:editing.category, repeatRule:editing.repeatRule||"none" };
    }
    return { editing:null, date:(prefill && prefill.date) || dateIso, startTime:(prefill && prefill.start) || "", endTime:"", title:"", notes:"", category:"personal", repeatRule:"none" };
  }

  function addBlockModalHTML(dateIso, editingId, prefill){
    var vals = blockFormValsFromState(dateIso, editingId, prefill);
    var editing = vals.editing;
    return '<div class="modal-backdrop" data-modal-backdrop>'+
      '<div class="modal-card">'+
        '<h2>'+(editing?"Edit time block":"Add time block")+'</h2>'+
        '<form class="stack" id="block-form">'+
          blockFormFieldsHTML(vals)+
          '<div class="modal-actions">'+
            (editing ? '<button type="button" class="btn-ghost" data-block-modal-del="'+editing.id+'" style="margin-right:auto;color:var(--bad)">Delete</button>' : '')+
            '<button type="button" class="btn-ghost" data-modal-cancel>Cancel</button>'+
            '<button type="submit" class="btn btn-primary">'+(editing?"Save":"Add to day")+'</button>'+
          '</div>'+
        '</form>'+
      '</div>'+
    '</div>';
  }

  function addEventInlineHTML(dateIso){

  /* ============ BODY: health & body-metric tracking ============
     Flexible metric/measurement model (not per-metric tables) so custom metrics work the same
     way built-ins do, and so future Garmin/WHOOP/Apple Health/Health Connect sync can write into
     the same `measurements` array via the `source`/`externalRecordId`/`externalSource`/`syncedAt`
     fields without a schema change. No integrations are wired up yet — the Connections list in the
     sidebar is intentionally inert ("Coming later"), never a fake connected state. */
  function bodyMetrics(){ return state.body.metrics.slice().sort(function(a,b){ return a.order-b.order; }); }
  function bodyActiveMetrics(){ return bodyMetrics().filter(function(m){ return !m.archived; }); }
  function bodyMetricById(id){ return state.body.metrics.filter(function(m){ return m.id===id; })[0] || null; }
  function bodyMeasurementsFor(metricId){
    return state.body.measurements.filter(function(x){ return x.metricId===metricId; })
      .sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  }
  function bodyLatestMeasurement(metricId){
    var list = bodyMeasurementsFor(metricId);
    return list.length ? list[list.length-1] : null;
  }
  function bodyDisplayUnit(metric){
    return (state.body.unitSystem==="imperial" && metric.unitImperial) ? metric.unitImperial : metric.unit;
  }
  function bodyDisplayValue(metric, value){
    var v = (state.body.unitSystem==="imperial" && metric.unitImperial) ? value*metric.imperialFactor : value;
    return Math.round(v*100)/100;
  }
  function bodyFormatValue(metric, value){
    var v = bodyDisplayValue(metric, value);
    var unit = bodyDisplayUnit(metric);
    return v.toLocaleString(undefined,{maximumFractionDigits:2}) + (unit ? " "+unit : "");
  }
  function bodyMetricColor(metric){
    var byCat = { "body-comp":"var(--home-purple)", vitals:"var(--ember)", sleep:"var(--home-blue)", performance:"var(--good)", custom:"var(--steel)" };
    return byCat[metric.category] || "var(--home-purple)";
  }
  function bodyDeltaClass(metric, from, to){
    if(from==null || to==null || from===to) return "flat";
    var up = to>from;
    if(metric.preferredDirection==="higher") return up?"up":"down";
    if(metric.preferredDirection==="lower") return up?"down":"up";
    if(metric.preferredDirection==="range"){
      var wasIn = (metric.rangeLow==null||from>=metric.rangeLow) && (metric.rangeHigh==null||from<=metric.rangeHigh);
      var isIn = (metric.rangeLow==null||to>=metric.rangeLow) && (metric.rangeHigh==null||to<=metric.rangeHigh);
      if(isIn && !wasIn) return "up";
      if(!isIn && wasIn) return "down";
      return "flat";
    }
    return "flat"; // neutral — a change in either direction isn't inherently "good"
  }
  function bodyDeltaArrow(cls){ return cls==="up" ? "▲" : cls==="down" ? "▼" : "–"; }
  function bodyMetricsWithData(){ return bodyActiveMetrics().filter(function(m){ return bodyMeasurementsFor(m.id).length>0; }); }
  function bodyPinnedMetrics(){
    var pinned = bodyActiveMetrics().filter(function(m){ return m.pinned; });
    if(!pinned.length) pinned = bodyMetricsWithData().slice(0,2);
    return pinned.slice(0,3);
  }
  function bodyPointsFor(metricId, days){
    var cutoff = days ? addDays(todayISO(), -days) : null;
    return bodyMeasurementsFor(metricId).filter(function(x){ return !cutoff || x.date>=cutoff; }).map(function(x){ return { date:x.date, value:x.value }; });
  }
  function bodyDirectionLabel(m){
    if(m.preferredDirection==="higher") return "Higher is better";
    if(m.preferredDirection==="lower") return "Lower is better";
    if(m.preferredDirection==="range") return "Target "+(m.rangeLow!=null?m.rangeLow:"?")+"–"+(m.rangeHigh!=null?m.rangeHigh:"?")+" "+m.unit;
    return "No target direction";
  }

  var bodySidebarItems = [
    { id:"overview", label:"Overview" },
    { id:"all", label:"All metrics" },
    { id:"trends", label:"Trends" },
    { id:"compare", label:"Compare" },
    { id:"records", label:"Records" }
  ];
  /* Generic on purpose: any other "deep" section could call this same helper with its own
     item list later, reusing the .section-shell/.section-sidebar CSS as-is. */
  function sectionSidebarHTML(items, activeId, navAttr){
    return '<nav class="section-sidebar">'+
      items.map(function(it){
        return '<button type="button" class="ss-link'+(it.id===activeId?" active":"")+'" data-'+navAttr+'="'+it.id+'">'+esc(it.label)+'</button>';
      }).join("")+
      '<div class="ss-group-label">Connections</div>'+
      ["Garmin","WHOOP","Apple Health","Health Connect"].map(function(name){
        return '<div class="ss-conn"><span>'+LINK_SVG+esc(name)+'</span><span class="pill-soon">Coming later</span></div>';
      }).join("")+
    '</nav>';
  }

  function renderBody(){
    var head = '<div class="habits-head">'+
        '<div><h2>Body</h2><p>Health &amp; body metrics — logged by hand today, ready for Garmin, WHOOP, Apple Health, and Health Connect later.</p></div>'+
        '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+
          '<div class="range-toggle">'+
            '<button type="button" class="'+(state.body.unitSystem==="metric"?"on":"")+'" data-body-units="metric">Metric</button>'+
            '<button type="button" class="'+(state.body.unitSystem==="imperial"?"on":"")+'" data-body-units="imperial">Imperial</button>'+
          '</div>'+
          '<button type="button" class="btn btn-primary" style="background:var(--home-purple)" data-body-new-data>+ Add data</button>'+
        '</div>'+
      '</div>';
    var sidebar = sectionSidebarHTML(bodySidebarItems, bodyPage, "body-nav");
    var main = bodyPage==="all" ? renderBodyAllMetrics()
      : bodyPage==="trends" ? renderBodyTrends()
      : bodyPage==="compare" ? renderBodyCompare()
      : bodyPage==="records" ? renderBodyRecords()
      : renderBodyOverview();
    var modals = (bodyShowAddMetric ? bodyMetricModalHTML() : "") + (bodyShowAddData ? bodyAddDataModalHTML() : "");
    return head + '<div class="section-shell">'+sidebar+'<div class="section-main">'+main+'</div></div>' + modals;
  }

  function renderBodyOverview(){
    var metrics = bodyActiveMetrics();
    var withData = bodyMetricsWithData();
    var cardsHTML = withData.length ? withData.map(function(m){
      var pts = bodyPointsFor(m.id, 90);
      var vals = pts.map(function(p){ return bodyDisplayValue(m,p.value); });
      var latest = pts[pts.length-1];
      var prev = pts.length>1 ? pts[pts.length-2] : null;
      var cls = prev ? bodyDeltaClass(m, prev.value, latest.value) : "flat";
      var deltaTxt = prev ? (bodyDeltaArrow(cls)+" "+bodyFormatValue(m, Math.abs(latest.value-prev.value))) : "First reading";
      return '<button type="button" class="metric-card" data-body-card="'+m.id+'">'+
        '<div class="metric-card-name">'+esc(m.name)+'</div>'+
        '<div class="metric-card-value">'+bodyDisplayValue(m,latest.value)+'<span class="unit">'+esc(bodyDisplayUnit(m))+'</span></div>'+
        sparklineSVG(vals, bodyMetricColor(m))+
        '<div class="metric-card-delta '+cls+'">'+deltaTxt+'</div>'+
      '</button>';
    }).join("") : '<div class="body-empty-cards">No readings logged yet. Use <b>+ Add data</b> above to log your first metric.</div>';

    var main = '<div class="panel"><div class="panel-head"><h2>Key metrics</h2><span class="hint">Last 90 days</span></div>'+
      '<div class="body-metric-cards">'+cardsHTML+'</div></div>';

    var pinned = bodyPinnedMetrics();
    var focusHTML = pinned.length ? pinned.map(function(m){
      var latest = bodyLatestMeasurement(m.id);
      if(!latest) return '<div class="body-focus-item"><div class="bf-name">'+esc(m.name)+'</div><div class="bf-note">No readings yet.</div></div>';
      return '<div class="body-focus-item"><div class="bf-name">'+esc(m.name)+'</div>'+
        '<div class="bf-val">'+bodyDisplayValue(m,latest.value)+'<span class="unit">'+esc(bodyDisplayUnit(m))+'</span></div>'+
        '<div class="bf-note">'+daysAgoLabel(latest.date)+'</div></div>';
    }).join("") : '<p class="empty">Pin a metric from All metrics to feature it here.</p>';

    var bySource = {};
    state.body.measurements.forEach(function(x){ bySource[x.source] = (bySource[x.source]||0)+1; });
    var sourcesHTML = BODY_SOURCES.map(function(s){
      var count = bySource[s]||0;
      var dim = (s!=="manual" && count===0) ? " dim" : "";
      return '<div class="body-source-row'+dim+'"><span>'+esc(BODY_SOURCE_LABELS[s])+(s!=="manual"?' <span class="pill-soon">Coming later</span>':'')+'</span><span class="bs-count">'+count+'</span></div>';
    }).join("");

    var noData = metrics.filter(function(m){ return bodyMeasurementsFor(m.id).length===0 && !bodyInspireDismissed[m.id]; }).slice(0,3);
    var inspireHTML = noData.length ? noData.map(function(m){
      return '<div class="body-inspire-item"><span class="bi-name">'+esc(m.name)+'</span><button type="button" class="btn-ghost" data-body-inspire-track="'+m.id+'" style="color:var(--ember)">Track this</button></div>';
    }).join("") : '<p class="empty">You\'re tracking everything in the starter catalog — add a custom metric for anything else.</p>';

    var weekEntries = state.body.measurements.filter(function(x){ return inSameWeek(x.date, todayISO()); });
    var weekMetricNames = [];
    weekEntries.forEach(function(x){ var m=bodyMetricById(x.metricId); if(m && weekMetricNames.indexOf(m.name)===-1) weekMetricNames.push(m.name); });
    var summaryTxt = weekEntries.length ?
      ('You logged <b>'+weekEntries.length+' reading'+(weekEntries.length===1?"":"s")+'</b> this week across <b>'+weekMetricNames.length+' metric'+(weekMetricNames.length===1?"":"s")+'</b>'+(weekMetricNames.length?": "+esc(weekMetricNames.join(", ")):"")+'.') :
      'Nothing logged this week yet.';

    var rail = '<div class="stack-col">'+
      '<div class="panel"><div class="panel-head"><h2>In focus</h2></div>'+focusHTML+'</div>'+
      '<div class="panel"><div class="panel-head"><h2>Data sources</h2></div>'+sourcesHTML+'</div>'+
      '<div class="panel"><div class="panel-head"><h2>Add metric</h2></div><p class="body-summary-line">Track something not in the starter catalog — mood score, VO2 max, anything with a number.</p>'+
        '<button type="button" class="btn btn-primary" data-body-new-metric style="margin-top:10px">+ New custom metric</button></div>'+
      '<div class="panel"><div class="panel-head"><h2>Need inspiration?</h2></div>'+inspireHTML+'</div>'+
      '<div class="panel"><div class="panel-head"><h2>Weekly summary</h2></div><p class="body-summary-line">'+summaryTxt+'</p></div>'+
    '</div>';

    return '<div class="body-overview-grid">'+main+rail+'</div>';
  }

  function renderBodyAllMetrics(){
    var groups = {};
    bodyMetrics().forEach(function(m){ (groups[m.category]=groups[m.category]||[]).push(m); });
    var order = ["body-comp","vitals","sleep","performance","custom"];
    var listHTML = order.filter(function(c){ return groups[c] && groups[c].length; }).map(function(cat){
      return '<div class="body-cat-label">'+esc(BODY_CATEGORY_LABELS[cat])+'</div>'+
        groups[cat].map(function(m){
          var latest = bodyLatestMeasurement(m.id);
          var menuOpen = bodyOpenMenuId===m.id;
          return '<div class="body-metric-row" data-body-metric-open="'+m.id+'">'+
            '<div class="bm-main"><div class="bm-name">'+(m.pinned?PIN_SVG:"")+esc(m.name)+(m.archived?' <span class="pill-soon">Archived</span>':'')+'</div>'+
            '<div class="bm-meta">'+esc(BODY_CATEGORY_LABELS[m.category])+' · '+bodyDirectionLabel(m)+'</div></div>'+
            '<div class="bm-latest">'+(latest?bodyFormatValue(m,latest.value)+' · '+daysAgoLabel(latest.date):'<span class="empty">No data</span>')+'</div>'+
            '<div class="habit-menu-wrap">'+
              '<button type="button" class="row-menu-btn" data-menu-toggle="'+m.id+'" title="More">&#8942;</button>'+
              '<div class="row-menu"'+(menuOpen?"":" hidden")+'>'+
                '<button type="button" data-body-log="'+m.id+'">Log a reading</button>'+
                '<button type="button" data-body-pin="'+m.id+'">'+(m.pinned?"Unpin":"Pin to In focus")+'</button>'+
                (m.isCustom?'<button type="button" data-body-edit-metric="'+m.id+'">Edit</button>':'')+
                '<button type="button" data-body-archive-metric="'+m.id+'">'+(m.archived?"Unarchive":"Archive")+'</button>'+
                (m.isCustom && !bodyMeasurementsFor(m.id).length?'<button type="button" class="danger" data-body-delete-metric="'+m.id+'">Delete</button>':'')+
              '</div>'+
            '</div>'+
          '</div>';
        }).join("");
    }).join("");

    var detail = bodyActiveMetricId ? bodyMetricDetailHTML(bodyActiveMetricId) : "";

    return '<div class="panel"><div class="panel-head"><h2>All metrics</h2><button type="button" class="btn-ghost" data-body-new-metric style="color:var(--ember)">+ New custom metric</button></div>'+
      detail + listHTML + '</div>';
  }

  function bodyMetricDetailHTML(metricId){
    var m = bodyMetricById(metricId);
    if(!m) return "";
    var pts = bodyPointsFor(m.id, 90).map(function(p){ return { date:p.date, value:bodyDisplayValue(m,p.value) }; });
    var recent = bodyMeasurementsFor(m.id).slice(-8).reverse();
    var recentHTML = recent.length ? recent.map(function(x){
      return '<div class="row"><span class="swatch" style="background:'+bodyMetricColor(m)+'"></span>'+
        '<div class="main"><div class="title">'+bodyFormatValue(m,x.value)+'</div><div class="meta">'+daysAgoLabel(x.date)+' · '+esc(BODY_SOURCE_LABELS[x.source])+(x.note?' — '+esc(x.note):'')+'</div></div>'+
        '<button class="btn-ghost" type="button" data-body-edit-entry="'+x.id+'" title="Edit">Edit</button>'+
        '<button class="btn-ghost" type="button" data-body-del-entry="'+x.id+'" title="Delete">✕</button>'+
      '</div>';
    }).join("") : '<p class="empty">No readings yet.</p>';
    return '<div class="body-metric-detail">'+
      '<div class="bmd-head"><h3 style="margin:0;font-family:\'Fraunces\',serif;font-weight:600">'+esc(m.name)+'</h3>'+
        '<button type="button" class="btn btn-primary" data-body-log="'+m.id+'" style="padding:.32rem .7rem;font-size:.8rem">+ Log a reading</button></div>'+
      trendChartSVG(pts, bodyMetricColor(m), (m.rangeLow!=null?bodyDisplayValue(m,m.rangeLow):null), (m.rangeHigh!=null?bodyDisplayValue(m,m.rangeHigh):null))+
      '<div style="margin-top:14px">'+recentHTML+'</div>'+
    '</div>';
  }

  function renderBodyTrends(){
    var all = bodyActiveMetrics();
    if(!bodyTrendsMetricIds){
      bodyTrendsMetricIds = bodyPinnedMetrics().map(function(m){ return m.id; });
      if(!bodyTrendsMetricIds.length && all.length) bodyTrendsMetricIds = [all[0].id];
    }
    var chips = all.map(function(m){
      var on = bodyTrendsMetricIds.indexOf(m.id)>-1;
      return '<button type="button" class="body-metric-chip'+(on?" on":"")+'" data-body-trend-toggle="'+m.id+'">'+esc(m.name)+'</button>';
    }).join("");
    var ranges = [[30,"30d"],[90,"90d"],[365,"1y"],[0,"All"]];
    var rangeHTML = '<div class="range-toggle">'+ranges.map(function(r){
      return '<button type="button" class="'+(bodyTrendsRange===r[0]?"on":"")+'" data-body-trend-range="'+r[0]+'">'+r[1]+'</button>';
    }).join("")+'</div>';

    var charts = bodyTrendsMetricIds.map(function(id){
      var m = bodyMetricById(id);
      if(!m) return "";
      var pts = bodyPointsFor(m.id, bodyTrendsRange||null).map(function(p){ return { date:p.date, value:bodyDisplayValue(m,p.value) }; });
      var latestRaw = bodyLatestMeasurement(m.id);
      return '<div class="panel body-trend-panel"><div class="panel-head"><h2>'+esc(m.name)+'</h2><span class="hint">'+(latestRaw?bodyFormatValue(m,latestRaw.value):"No data")+'</span></div>'+
        trendChartSVG(pts, bodyMetricColor(m), (m.rangeLow!=null?bodyDisplayValue(m,m.rangeLow):null), (m.rangeHigh!=null?bodyDisplayValue(m,m.rangeHigh):null))+
      '</div>';
    }).join("");

    return '<div class="body-trend-toolbar"><div class="body-metric-chips">'+chips+'</div>'+rangeHTML+'</div>'+
      (bodyTrendsMetricIds.length ? charts : '<div class="panel"><p class="empty">Pick one or more metrics above to see their trend.</p></div>');
  }

  function renderBodyCompare(){
    var all = bodyActiveMetrics();
    if(!bodyCompareMetricIds){
      var pinnedIds = bodyPinnedMetrics().map(function(m){ return m.id; });
      bodyCompareMetricIds = [pinnedIds[0]||(all[0]&&all[0].id), pinnedIds[1]||(all[1]&&all[1].id)].filter(Boolean);
    }
    var pickers = [0,1].map(function(slot){
      var current = bodyCompareMetricIds[slot];
      return '<div class="f">Metric '+(slot+1)+'<select data-body-compare-pick="'+slot+'" data-picker="select">'+
        all.map(function(m){ return '<option value="'+m.id+'"'+(m.id===current?" selected":"")+'>'+esc(m.name)+'</option>'; }).join("")+
      '</select></div>';
    }).join("");
    var ranges = [[30,"30d"],[90,"90d"],[365,"1y"],[0,"All"]];
    var rangeHTML = '<div class="range-toggle">'+ranges.map(function(r){
      return '<button type="button" class="'+(bodyCompareRange===r[0]?"on":"")+'" data-body-compare-range="'+r[0]+'">'+r[1]+'</button>';
    }).join("")+'</div>';

    var cols = bodyCompareMetricIds.map(function(id){
      var m = bodyMetricById(id);
      if(!m) return '<div class="panel"><p class="empty">Pick a metric.</p></div>';
      var pts = bodyPointsFor(m.id, bodyCompareRange||null).map(function(p){ return { date:p.date, value:bodyDisplayValue(m,p.value) }; });
      var vals = pts.map(function(p){ return p.value; });
      var stats;
      if(vals.length){
        var avg = vals.reduce(function(a,b){ return a+b; },0)/vals.length;
        var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
        stats = '<div class="compare-stat-row"><span>Latest</span><span>'+vals[vals.length-1]+' '+esc(bodyDisplayUnit(m))+'</span></div>'+
          '<div class="compare-stat-row"><span>Average</span><span>'+(Math.round(avg*100)/100)+' '+esc(bodyDisplayUnit(m))+'</span></div>'+
          '<div class="compare-stat-row"><span>Range</span><span>'+min+' – '+max+' '+esc(bodyDisplayUnit(m))+'</span></div>'+
          '<div class="compare-stat-row"><span>Readings</span><span>'+vals.length+'</span></div>';
      } else stats = '<p class="empty">No readings in this range.</p>';
      return '<div class="panel"><div class="panel-head"><h2>'+esc(m.name)+'</h2></div>'+
        trendChartSVG(pts, bodyMetricColor(m), null, null)+
        '<div style="margin-top:10px">'+stats+'</div></div>';
    }).join("");

    return '<div class="panel"><div class="panel-head"><h2>Compare</h2></div><div class="grid-2">'+pickers+'</div>'+rangeHTML+'</div>'+
      '<div class="body-compare-grid" style="margin-top:16px">'+cols+'</div>';
  }

  function renderBodyRecords(){
    var metrics = bodyMetrics();
    var list = state.body.measurements.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
    if(bodyRecordsMetricFilter!=="all") list = list.filter(function(x){ return x.metricId===bodyRecordsMetricFilter; });
    if(bodyRecordsSourceFilter!=="all") list = list.filter(function(x){ return x.source===bodyRecordsSourceFilter; });

    var filterBar = '<div class="body-filter-bar">'+
      '<div class="f">Metric<select id="body-rec-metric-filter" data-picker="select">'+
        '<option value="all">All metrics</option>'+
        metrics.map(function(m){ return '<option value="'+m.id+'"'+(bodyRecordsMetricFilter===m.id?" selected":"")+'>'+esc(m.name)+'</option>'; }).join("")+
      '</select></div>'+
      '<div class="f">Source<select id="body-rec-source-filter" data-picker="select">'+
        '<option value="all">All sources</option>'+
        BODY_SOURCES.map(function(s){ return '<option value="'+s+'"'+(bodyRecordsSourceFilter===s?" selected":"")+'>'+esc(BODY_SOURCE_LABELS[s])+'</option>'; }).join("")+
      '</select></div>'+
    '</div>';

    var rows = list.length ? list.map(function(x){
      var m = bodyMetricById(x.metricId);
      if(!m) return "";
      return '<div class="row body-record-row"><span class="swatch" style="background:'+bodyMetricColor(m)+'"></span>'+
        '<div class="main"><div class="title">'+esc(m.name)+' — '+bodyFormatValue(m,x.value)+'</div>'+
        '<div class="meta">'+daysAgoLabel(x.date)+' · <span class="body-source-badge">'+esc(BODY_SOURCE_LABELS[x.source])+'</span>'+(x.note?' — '+esc(x.note):'')+'</div></div>'+
        '<button class="btn-ghost" type="button" data-body-edit-entry="'+x.id+'" title="Edit">Edit</button>'+
        '<button class="btn-ghost" type="button" data-body-del-entry="'+x.id+'" title="Delete">✕</button>'+
      '</div>';
    }).join("") : '<p class="empty">No entries match these filters.</p>';

    return '<div class="panel"><div class="panel-head"><h2>Records</h2><span class="hint">'+list.length+' entr'+(list.length===1?"y":"ies")+'</span></div>'+filterBar+rows+'</div>';
  }

          '<div class="f">Preferred direction<select id="bm-direction" data-picker="select">'+
            [["higher","Higher is better"],["lower","Lower is better"],["range","Target range"],["neutral","No target direction"]].map(function(d){

            '<label class="f">Range high<input type="number" step="any" id="bm-range-high" value="'+(v.rangeHigh!=null?v.rangeHigh:"")+'"></label>'+

    '</div>';
  }
