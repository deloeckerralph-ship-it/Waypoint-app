  var NUMBER_WORDS = ["No","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten"];
  function numberWord(n){ return (n>=0 && n<=10) ? NUMBER_WORDS[n] : String(n); }

  function fmtMinutes(min){
    min = Math.round(min);
    if(min>=60){ var h=Math.floor(min/60), m=min%60; return h+"h"+(m?" "+m+"m":""); }
    return min+" min";
  }

  function weekRangeLabel(startISO){
    var start = parseISO(startISO), end = parseISO(addDays(startISO,6));
    var endMonth = end.toLocaleDateString(undefined,{ month:"long" });
    if(start.getMonth()===end.getMonth()) return start.getDate()+" – "+end.getDate()+" "+endMonth;
    var startMonth = start.toLocaleDateString(undefined,{ month:"short" });
    return start.getDate()+" "+startMonth+" – "+end.getDate()+" "+endMonth;
  }

  function homeHasAnyData(){
    return state.habits.length || state.expenses.length || state.workouts.length ||
      state.library.items.length || state.study.sessions.length || state.challenges.list.length;
  }

  /* Shared time-of-day bucketing, used by both the hero greeting and the rotating closing quote
     (v16) — one clock read, one set of boundaries, so "morning" means the same thing in both
     places rather than two independently-tuned notions of what time of day it is. */
  function homeTimeBucket(hour){
    if(hour>=5 && hour<12) return "morning";
    if(hour>=12 && hour<18) return "afternoon";
    if(hour>=18 && hour<22) return "evening";
    return "night";
  }
  var HOME_TIME_GREETINGS = { morning:"Good morning.", afternoon:"Good afternoon.", evening:"Good evening.", night:"Good night." };

  function homeGreeting(){
    var today = todayISO();
    var todayCount = activityTotal(activityForDate(today));
    var headline = HOME_TIME_GREETINGS[homeTimeBucket(new Date().getHours())];
    var sub = todayCount>0 ? ("You've logged "+todayCount+" thing"+(todayCount===1?"":"s")+" today.") : "Nothing logged yet today.";

    var d = parseISO(today);
    var dateLabel = d.toLocaleDateString(undefined,{ weekday:"long" }).toUpperCase()+" · "+
      d.toLocaleDateString(undefined,{ day:"numeric", month:"long" }).toUpperCase();
    return { dateLabel:dateLabel, headline:headline, sub:sub };
  }

  /* Closing quote, rotated by time-of-day bucket (so it reads differently opened in the morning
     vs. the evening) and by day-within-bucket (so it doesn't say the exact same thing every
     single day at the same hour) — deterministic from the clock alone, no stored state, so it's
     stable across re-renders within the same minute rather than flickering on every keystroke. */
  var HOME_QUOTES = {
    morning: [
      { h:"A good place to start.", s:"The day is still wide open." },
      { h:"One thing at a time.", s:"Small steps count more than big plans." },
      { h:"A quiet start.", s:"Not everything needs to happen before breakfast." }
    ],
    afternoon: [
      { h:"Keep the rhythm going.", s:"Consistency is built in the middle of the day, not the start." },
      { h:"Still plenty of day left.", s:"Small, steady effort adds up more than it feels like." },
      { h:"Halfway through.", s:"A good afternoon carries the morning's momentum forward." }
    ],
    evening: [
      { h:"Keep showing up.", s:"Consistency is the foundation for everything you're building." },
      { h:"Winding down.", s:"Look back before you look ahead — today mattered too." },
      { h:"Almost there.", s:"A good evening finishes what a good morning started." }
    ],
    night: [
      { h:"Rest is part of it.", s:"Tomorrow starts better when tonight ends well." },
      { h:"Quiet hours.", s:"Not logging anything right now is fine too." },
      { h:"Let today be enough.", s:"You showed up in the ways that mattered." }
    ]
  };
  function homeDailyQuote(){
    var now = new Date();
    var list = HOME_QUOTES[homeTimeBucket(now.getHours())];
    var dayIndex = Math.floor(now.getTime()/86400000);
    return list[((dayIndex % list.length) + list.length) % list.length];
  }

  function getTodayMetrics(){
    var today = todayISO();
    var runKm = 0;
    state.challenges.activities.forEach(function(a){ if(a.date===today && (a.type==="run"||a.type==="run-long") && a.distance) runKm += Number(a.distance||0); });
    var trainMin = 0;
    state.workouts.forEach(function(w){ if(w.date===today) trainMin += Number(w.duration||0); });
    state.challenges.activities.forEach(function(a){ if(a.date===today) trainMin += Number(a.durationMinutes||0); });
    var pages = pagesReadOnDate(today);
    var spent = state.expenses.filter(function(e){ return e.date===today; }).reduce(function(sum,e){ return sum+Number(e.amount||0); },0);
    var studyMin = 0;
    state.study.sessions.forEach(function(ss){ if(ss.date===today) studyMin += Number(ss.minutes||0); });
    var activeHb = activeHabits();
    var habitsDone = activeHb.filter(function(h){ return h.logs[today]; }).length;
    return { runKm:runKm, trainMin:trainMin, pages:pages, spent:spent, studyMin:studyMin, habitsDone:habitsDone, habitsActive:activeHb.length };
  }

  /* ============ Home "Today" stats: customizable metric picker (v21) ============
     A fixed set of registry entries (key/label/how to read a value out of getTodayMetrics()'s
     result). state.homeMetricPrefs is just an ordered array of keys — what's selected and in what
     order. Anything not in that array is simply available to add back via the customize modal. */
  var HOME_METRIC_DEFAULT_KEYS = ["running","training","reading","spending"];
  function homeMetricRegistry(){
    return [
      { key:"running",  label:"Running",  format:function(tm){ return tm.runKm>0 ? (Math.round(tm.runKm*10)/10)+" km" : "—"; } },
      { key:"training", label:"Training", format:function(tm){ return tm.trainMin>0 ? fmtMinutes(tm.trainMin) : "—"; } },
      { key:"reading",  label:"Read",     format:function(tm){ return tm.pages>0 ? tm.pages+" p" : "—"; } },
      { key:"study",    label:"Study",    format:function(tm){ return tm.studyMin>0 ? fmtMinutes(tm.studyMin) : "—"; } },
      { key:"spending", label:"Spent",    format:function(tm){ return tm.spent>0 ? money(tm.spent) : "—"; } },
      { key:"habits",   label:"Habits",   format:function(tm){ return tm.habitsActive>0 ? (tm.habitsDone+" / "+tm.habitsActive) : "—"; } }
    ];
  }
  function homeMetricByKey(key){
    var hit = homeMetricRegistry().filter(function(m){ return m.key===key; });
    return hit[0] || null;
  }
  function normalizeHomeMetricPrefs(arr){
    var validKeys = homeMetricRegistry().map(function(m){ return m.key; });
    var out = (Array.isArray(arr) ? arr : []).filter(function(k){ return validKeys.indexOf(k)>-1; });
    out = out.filter(function(k, i){ return out.indexOf(k)===i; }); // dedupe, keep first occurrence
    if(!out.length) out = HOME_METRIC_DEFAULT_KEYS.slice();
    return out;
  }
  function moveHomeMetric(key, dir){
    var arr = state.homeMetricPrefs;
    var i = arr.indexOf(key);
    if(i<0) return;
    var j = dir==="up" ? i-1 : i+1;
    if(j<0 || j>=arr.length) return;
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }

  function homeMetricsModalHTML(){
    var registry = homeMetricRegistry();
    var selected = state.homeMetricPrefs;
    var selectedSet = {};
    selected.forEach(function(k){ selectedSet[k] = true; });
    var available = registry.filter(function(m){ return !selectedSet[m.key]; });

    var rows = selected.map(function(key, idx){
      var m = homeMetricByKey(key);
      if(!m) return "";
      return '<div class="chp-row" style="justify-content:space-between" data-hm-key="'+key+'">'+
        '<span>'+esc(m.label)+'</span>'+
        '<span style="display:flex;gap:2px;align-items:center">'+
          (idx>0 ? '<button type="button" class="chp-icon-btn" data-hm-move="'+key+':up" title="Move up">↑</button>' : '')+
          (idx<selected.length-1 ? '<button type="button" class="chp-icon-btn" data-hm-move="'+key+':down" title="Move down">↓</button>' : '')+
          '<button type="button" class="chp-icon-btn" data-hm-remove="'+key+'" title="Remove" style="color:var(--bad)">✕</button>'+
        '</span>'+
      '</div>';
    }).join("");

    return '<div class="modal-backdrop" data-modal-backdrop>'+
      '<div class="modal-card">'+
        '<h2>Customize Today</h2>'+
        '<p class="hint" style="margin:-6px 0 14px">Pick what shows in your Today stats, and use the arrows to set the order.</p>'+
        '<div class="hm-selected-list">'+ (rows || '<p class="plan-empty">Nothing selected — add something below.</p>') +'</div>'+
        (available.length ? '<div style="margin-top:16px"><div class="hint" style="margin-bottom:8px">Add more</div><div class="chip-row">'+
          available.map(function(m){ return '<button type="button" class="chip" data-hm-add="'+m.key+'">+ '+esc(m.label)+'</button>'; }).join("")+
        '</div></div>' : '')+
        '<div class="modal-actions">'+
          '<button type="button" class="btn btn-primary" data-modal-cancel>Done</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function homeWeeklyMetrics(){
    var today = todayISO();
    var weekStart = startOfWeekISO(today);
    var daysSoFar = weekDatesFrom(weekStart).filter(function(iso){ return iso<=today; });
    var elapsed = daysSoFar.length;
    var active = activeHabits();

    var habitsCompleted = 0;
    daysSoFar.forEach(function(iso){ active.forEach(function(h){ if(h.logs[iso]) habitsCompleted++; }); });
    var habitsPossible = active.length*elapsed;

    var movementDays = daysSoFar.filter(function(iso){
      return state.workouts.some(function(w){ return w.date===iso; }) || state.challenges.activities.some(function(a){ return a.date===iso; });
    }).length;
    var movementSessions = daysSoFar.reduce(function(sum,iso){
      return sum + state.workouts.filter(function(w){ return w.date===iso; }).length + state.challenges.activities.filter(function(a){ return a.date===iso; }).length;
    },0);

    var readingDays = daysSoFar.filter(function(iso){ return pagesReadOnDate(iso)>0; }).length;
    var pagesThisWeek = daysSoFar.reduce(function(sum,iso){ return sum+pagesReadOnDate(iso); },0);

    var studyDays = daysSoFar.filter(function(iso){ return state.study.sessions.some(function(ss){ return ss.date===iso; }); }).length;
    var studyMin = daysSoFar.reduce(function(sum,iso){
      return sum + state.study.sessions.filter(function(ss){ return ss.date===iso; }).reduce(function(s,ss){ return s+Number(ss.minutes||0); },0);
    },0);

    var spendDays = daysSoFar.filter(function(iso){ return state.expenses.some(function(e){ return e.date===iso; }); }).length;
    var spendTotal = daysSoFar.reduce(function(sum,iso){
      return sum + state.expenses.filter(function(e){ return e.date===iso; }).reduce(function(s,e){ return s+Number(e.amount||0); },0);
    },0);

    return [
      { key:"movement", name:"Movement", accent:"var(--good)", value:movementSessions+" session"+(movementSessions===1?"":"s"), pct: elapsed?Math.round(movementDays/elapsed*100):0 },
      { key:"habits", name:"Habits", accent:"var(--mustard)", value:habitsCompleted+" / "+habitsPossible, pct: habitsPossible?Math.round(habitsCompleted/habitsPossible*100):0 },
      { key:"library", name:"Reading", accent:"var(--home-blue)", value:pagesThisWeek+" page"+(pagesThisWeek===1?"":"s"), pct: elapsed?Math.round(readingDays/elapsed*100):0 },
      { key:"study", name:"Study", accent:"var(--home-purple)", value:fmtMinutes(studyMin), pct: elapsed?Math.round(studyDays/elapsed*100):0 },
      { key:"spending", name:"Spending", accent:"var(--ember)", value:money(spendTotal), pct: elapsed?Math.round(spendDays/elapsed*100):0 }
    ];
  }

  function getRecentActivityFeed(limit){
    var items = [];
    activeHabits().forEach(function(h){
      Object.keys(h.logs).forEach(function(iso){
        if(h.logs[iso]) items.push({ date:iso, title:esc(h.name), meta:"Habit", value:"", accent:"var(--mustard)", nav:"habits" });
      });
    });
    state.expenses.forEach(function(e){

    return items.slice(0, limit||6);

  function getLookingAhead(){
    var items = [];
    var today = todayISO();

    upcomingTrips(4).forEach(function(t){
      var days = Math.ceil((parseISO(t.startDate)-parseISO(today))/86400000);
      var meta = [t.city, countryName(t.countryCode)].filter(Boolean).join(", ")+" · "+days+" day"+(days===1?"":"s")+" to go";
      items.push({ date:t.startDate, title:"Trip: "+esc(t.name||"Untitled trip"), meta:meta, nav:"travel", tripId:t.id });
    });

    activeChallengesList().forEach(function(c){
      var target = c.eventDate || c.endDate;
      if(!target || target<today) return;
      var days = Math.ceil((parseISO(target)-parseISO(today))/86400000);
      var row = challengeWeeklyOverviewRow(c);
      var meta = esc(c.name)+" · "+days+" day"+(days===1?"":"s")+" to go";
      if(row.pct!=null) meta += " · "+row.goalLabel+" "+row.progressLabel;
      items.push({ date:target, title: c.eventDate===target ? "Race day" : "Challenge ends", meta:meta, nav:"challenges" });
    });

    state.library.items.filter(function(it){ return it.categoryId==="books" && it.status==="active"; }).forEach(function(b){
      var hist = libraryItemProgressEntries(b.id);
      if(hist.length<2) return;
      var first = hist[0], last = hist[hist.length-1];
      var daySpan = Math.max(1, Math.round((parseISO(last.date)-parseISO(first.date))/86400000));
      var pagesRead = last.progressAfter-first.progressAfter;
      if(pagesRead<=0) return;
      var pace = pagesRead/daySpan;
      var remaining = (b.progressTotal||0)-(b.progressCurrent||0);
      if(remaining<=0 || pace<=0) return;
      var daysLeft = Math.ceil(remaining/pace);
      items.push({ date:addDays(today, daysLeft), title:"Finish "+esc(b.title), meta:remaining+" pages remaining, at your pace", nav:"library" });
    });

    items.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
    return items.slice(0,5);
  }

  function getMonthlyLoggedDays(y,m){
    var daysInMonth = new Date(y,m+1,0).getDate();
    var out = [], count = 0;
    for(var d=1; d<=daysInMonth; d++){
      var iso = y+"-"+pad(m+1)+"-"+pad(d);
      var a = activityForDate(iso);
      var total = activityTotal(a);
      var cats = activityDots(a).length;
      if(total>0) count++;
      out.push({ iso:iso, state: total===0 ? "none" : (cats>=3 ? "big" : "logged") });
    }
    return { days:out, count:count };
  }

  function getWeekConsistencyInsight(){
    var today = todayISO();
    var weekStart = startOfWeekISO(today);
    var daysSoFar = weekDatesFrom(weekStart).filter(function(iso){ return iso<=today; });
    if(daysSoFar.length<2) return null;
    var active = activeHabits();
    var candidates = [
      { label:"Habits", nav:"habits", days: daysSoFar.filter(function(iso){ return active.some(function(h){ return h.logs[iso]; }); }).length },
      { label:"Reading", nav:"library", days: daysSoFar.filter(function(iso){ return pagesReadOnDate(iso)>0; }).length },
      { label:"Studying", nav:"studying", days: daysSoFar.filter(function(iso){ return state.study.sessions.some(function(ss){ return ss.date===iso; }); }).length },
      { label:"Movement", nav:"workouts", days: daysSoFar.filter(function(iso){ return state.workouts.some(function(w){ return w.date===iso; }) || state.challenges.activities.some(function(a){ return a.date===iso; }); }).length }
    ];
    candidates.sort(function(a,b){ return b.days-a.days; });
    var top = candidates[0];
    if(!top.days) return null;
    if(candidates.filter(function(c){ return c.days===top.days; }).length>1) return null;
    return top;
  }

  /* ---- Antwerp weather panel (Today page) ----
     Live weather via Open-Meteo (open-meteo.com): free, no API key/account, CORS-enabled for
     direct browser fetch — the only realistic option for a single static HTML file with no
     backend to hold a secret in. (A Google Weather API key was considered, but it requires a
     Google Cloud project + billing account, and the key would sit in plain view in this file's
     source with no server to keep it behind — not something to ask of the user for a personal
     tracking app.) The last successful reading is cached in its own localStorage key (separate
     from waypoint:v1 — this is fetched data, not something the user entered, so it doesn't
     belong in the app's own state/undo model) and reused across reloads; a fresh fetch only
     goes out if the cached reading is more than WEATHER_REFRESH_MS old, and a background
     interval (see the init block at the end of the file) re-checks on the same cadence while
     the app stays open, so the panel drifts back into date on its own rather than needing a
     manual refresh — "keep it up to date" without hammering the API. */
  var ANTWERP_LAT = 51.2194, ANTWERP_LON = 4.4025;
  var WEATHER_CACHE_KEY = "waypoint:weather:v1";
  var WEATHER_REFRESH_MS = 30*60*1000; // 30 minutes
  var todayWeather = null, todayWeatherLoading = false, todayWeatherError = null, todayWeatherLastAttempt = 0;
  (function(){
    try{
      var raw = localStorage.getItem(WEATHER_CACHE_KEY);
      if(raw) todayWeather = JSON.parse(raw);
    }catch(e){ todayWeather = null; }
  })();

  /* WMO weather codes (the standard Open-Meteo reports current/daily conditions in) collapsed
     into the handful of families this panel actually distinguishes visually. */
  function weatherCodeInfo(code){
    var MAP = {
      0:["Clear sky", SUN_SVG], 1:["Mainly clear", SUN_SVG], 2:["Partly cloudy", CLOUD_SUN_SVG], 3:["Overcast", CLOUD_SVG],
      45:["Foggy", FOG_SVG], 48:["Foggy", FOG_SVG],
      51:["Light drizzle", RAIN_SVG], 53:["Drizzle", RAIN_SVG], 55:["Dense drizzle", RAIN_SVG],
      56:["Freezing drizzle", RAIN_SVG], 57:["Freezing drizzle", RAIN_SVG],
      61:["Light rain", RAIN_SVG], 63:["Rain", RAIN_SVG], 65:["Heavy rain", RAIN_SVG],

  function fetchAntwerpWeather(force){
    if(todayWeatherLoading) return;
    if(!force){
      // A fresh-enough successful reading: nothing to do.
      if(todayWeather && (Date.now()-todayWeather.fetchedAt) < WEATHER_REFRESH_MS) return;
      // A recent failed attempt with no successful reading yet: back off on the same cadence
      // rather than re-fetching on every render — without this, a failed fetch (no network,
      // API down) would retry itself in a tight loop, since there'd be no cached reading to
      // satisfy the check above and nothing else throttling it.
      if(todayWeatherLastAttempt && (Date.now()-todayWeatherLastAttempt) < WEATHER_REFRESH_MS) return;
    }
    todayWeatherLastAttempt = Date.now();
    todayWeatherLoading = true;
    todayWeatherError = null;
    if(activeTab==="today") renderViews();
    var url = "https://api.open-meteo.com/v1/forecast?latitude="+ANTWERP_LAT+"&longitude="+ANTWERP_LON+
      "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m"+
      "&daily=temperature_2m_max,temperature_2m_min&timezone=Europe%2FBrussels";
    fetch(url).then(function(res){
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    }).then(function(data){
      todayWeather = {
        tempC: Math.round(data.current.temperature_2m),
        feelsC: Math.round(data.current.apparent_temperature),
        code: data.current.weather_code,
        windKph: Math.round(data.current.wind_speed_10m),
        humidity: Math.round(data.current.relative_humidity_2m),
        high: Math.round(data.daily.temperature_2m_max[0]),
        low: Math.round(data.daily.temperature_2m_min[0]),
        fetchedAt: Date.now()
      };
      try{ localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(todayWeather)); }catch(e){}
      todayWeatherLoading = false;
      if(activeTab==="today") renderViews();
    }).catch(function(){
      todayWeatherLoading = false;
      todayWeatherError = "Couldn't reach the weather service.";
      if(activeTab==="today") renderViews();
    });
  }

  function habitsInsights(){
    var active = activeHabits();
    if(!active.length) return [];
    var lines = [];

    var weekdayTotals = [0,0,0,0,0,0,0];
    var allDates = {};
    active.forEach(function(h){
      Object.keys(h.logs).forEach(function(iso){ if(h.logs[iso]) allDates[iso] = true; });
    });
    Object.keys(allDates).forEach(function(iso){ weekdayTotals[(parseISO(iso).getDay()+6)%7]++; });
    var bestWd = 0;
    for(var i=1;i<7;i++) if(weekdayTotals[i]>weekdayTotals[bestWd]) bestWd = i;
    var wdNames = ["Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays","Sundays"];
    if(weekdayTotals[bestWd]>0){
      lines.push({ color:"var(--mustard)", text:"You complete the most habits on <b>"+wdNames[bestWd]+"</b>." });
    }

    var best = null, bestRate = -1;
    active.forEach(function(h){
      var span = Math.max(1, Math.round((parseISO(todayISO())-parseISO(h.createdAt||todayISO()))/86400000)+1);
      var doneCount = Object.keys(h.logs).filter(function(k){ return h.logs[k]; }).length;
      var rate = doneCount/span;
      if(rate>bestRate){ bestRate=rate; best=h; }
    });
    if(best && bestRate>0){
      lines.push({ color:"var(--good)", text:"<b>"+esc(best.name)+"</b> is your most consistent habit, done "+Math.round(bestRate*100)+"% of days since you added it." });
    }

    function weekPctFor(start){
      var dates = weekDatesFrom(start).filter(function(iso){ return iso<=todayISO(); });
      if(!dates.length) return null;
      var total=0, done=0;
      dates.forEach(function(iso){ active.forEach(function(h){ total++; if(h.logs[iso]) done++; }); });
      return total ? Math.round(done/total*100) : 0;
    }
    var thisWeekStart = startOfWeekISO(todayISO());
    var thisPct = weekPctFor(thisWeekStart);
    var lastPct = weekPctFor(addDays(thisWeekStart,-7));
    if(thisPct!==null && lastPct!==null){
      var diff = thisPct-lastPct;
      var trend = diff>0 ? "up "+diff+" point"+(diff===1?"":"s")+" from last week." : diff<0 ? "down "+Math.abs(diff)+" point"+(Math.abs(diff)===1?"":"s")+" from last week." : "steady with last week.";
      lines.push({ color:"var(--steel)", text:"This week's completion is <b>"+thisPct+"%</b>, "+trend });
    }
    return lines;
  }

        '<div><h2>Habits</h2><p>Small actions. Big results over time.</p></div>'+

      html += '<div class="panel add-block" style="--accent:var(--mustard)" id="habit-form-panel">'+
        '<div class="panel-head"><h2>'+(editing?"Edit habit":"New habit")+'</h2><span class="hint">e.g. "Stretch 10 min", "No sugar", "Journal"</span></div>'+

            '</div>'+
          '</div>'+
          '<input type="hidden" id="habit-editing-id" value="'+(editing?editing.id:"")+'">'+
        '</form>'+
      '</div>';
    }

    var doneToday = active.filter(function(h){ return h.logs[today]; }).length;
    var todayPct = active.length ? Math.round(doneToday/active.length*100) : 0;
    var bestCur = 0;
    active.forEach(function(h){ bestCur = Math.max(bestCur, currentStreak(h)); });
    var weekSeries = habitCompletionSeries();
    var weekPct = weekSeries.length ? Math.round(weekSeries.reduce(function(s,e){ return s+e.value; },0)/weekSeries.length) : 0;

    html += '<div class="habit-sum-row">'+
      '<div class="habit-sum-card" style="--accent:var(--mustard)">'+
        '<div class="habit-sum-viz">'+ ringSVG(todayPct, "var(--mustard)") +'</div>'+
        '<div class="habit-sum-text"><div class="habit-sum-label">Today</div><div class="habit-sum-value">'+doneToday+' / '+active.length+'</div><div class="habit-sum-sub">'+todayPct+'% complete</div></div>'+
      '</div>'+
      '<div class="habit-sum-card" style="--accent:var(--ember)">'+
        '<div class="habit-sum-viz" style="color:var(--ember)">'+FLAME_SVG+'</div>'+
        '<div class="habit-sum-text"><div class="habit-sum-label">Current Streak</div><div class="habit-sum-value">'+bestCur+' day'+(bestCur===1?"":"s")+'</div><div class="habit-sum-sub">best across all habits</div></div>'+
      '</div>'+
      '<div class="habit-sum-card sum-spark" style="--accent:var(--good)">'+
        '<div class="habit-sum-viz" style="width:60px">'+ dayBarsHTML(weekSeries, "var(--good)", function(v){ return v+"%"; }) +'</div>'+
        '<div class="habit-sum-text"><div class="habit-sum-label">This Week</div><div class="habit-sum-value">'+weekPct+'%</div><div class="habit-sum-sub">avg. completion</div></div>'+
      '</div>'+
      '<div class="habit-sum-card" style="--accent:var(--steel)">'+
        '<div class="habit-sum-viz" style="color:var(--steel)">'+CHECKLIST_SVG+'</div>'+
        '<div class="habit-sum-text"><div class="habit-sum-label">Total Habits</div><div class="habit-sum-value">'+active.length+'</div><div class="habit-sum-sub">'+archived.length+' archived</div></div>'+
      '</div>'+
    '</div>';

    var weekDates = weekDatesFrom(habitsWeekStart);
    var dayLetters = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
    html += '<div class="panel" style="margin-top:20px">'+
      '<div class="panel-head"><h2>Weekly tracker</h2>'+
        '<div class="week-nav">'+
          '<button type="button" class="btn-ghost" data-week-nav="prev" title="Previous week">&larr;</button>'+
          '<span class="range">'+fmtShort(habitsWeekStart)+' – '+fmtShort(weekDates[6])+'</span>'+
          '<button type="button" class="btn-ghost" data-week-nav="next" title="Next week">&rarr;</button>'+
        '</div>'+
      '</div>';
    if(!active.length){
      html += '<p class="empty">No habits yet — add your first one above.</p>';
    } else {
      html += '<div class="week-table-wrap"><table class="week-table"><thead><tr><th></th>'+
        weekDates.map(function(iso,i){
          var isToday = iso===today;
          return '<th class="'+(isToday?"is-today":"")+'">'+dayLetters[i]+'<span class="dnum">'+parseISO(iso).getDate()+'</span></th>';
        }).join("") +
      '</tr></thead><tbody>'+
        active.map(function(h){
          var cells = weekDates.map(function(iso){
            var done = !!h.logs[iso];
            var future = iso>today;
            return '<td><button type="button" class="day-box'+(done?" done":"")+(future?" future":"")+'" data-habit="'+h.id+'" data-date="'+iso+'"'+(future?" disabled":"")+' title="'+fmtShort(iso)+'">'+CHECK_SVG+'</button></td>';
          }).join("");
          return '<tr><td class="wt-name">'+esc(h.name)+(h.subtitle?'<span class="wt-sub">'+esc(h.subtitle)+'</span>':'')+'</td>'+cells+'</tr>';
        }).join("") +
      '</tbody></table></div>';
    }
    html += '</div>';

    html += dayScoreCardHTML(weekDates, dayLetters, active, today);

    html += '<div class="grid-2" style="margin-top:20px">';
    html += '<div class="panel"><div class="habits-list-head"><h2 style="font-size:1.05rem">All habits</h2></div>';
    if(!active.length && !archived.length){
      html += '<p class="empty">No habits yet.</p>';
    } else {
      html += active.map(function(h){
        var cur = currentStreak(h), best = bestStreakFor(h);
        var hot = cur>=3;
        return '<div class="habit-row" draggable="true" data-habit-row="'+h.id+'">'+
          '<span class="drag-handle" title="Drag to reorder">'+DRAG_SVG+'</span>'+
          '<div class="habit-row-main">'+
            '<div class="habit-row-name">'+esc(h.name)+'</div>'+
            '<div class="habit-row-meta">'+
              '<span>'+frequencyLabel(h.frequency)+'</span>'+
              '<span class="streak-badge'+(hot?" hot":"")+'">'+(hot?FLAME_SVG:"")+cur+' day'+(cur===1?"":"s")+'</span>'+
              '<span>best '+best+'</span>'+
            '</div>'+
          '</div>'+
          '<div class="habit-menu-wrap">'+
            '<button type="button" class="row-menu-btn" data-menu-toggle="'+h.id+'" title="More">&#8942;</button>'+
            '<div class="row-menu"'+(openHabitMenu===h.id?"":" hidden")+'>'+
              '<button type="button" data-menu-edit="'+h.id+'">Edit</button>'+
              '<button type="button" data-menu-archive="'+h.id+'">Archive</button>'+
              '<button type="button" class="danger" data-menu-delete="'+h.id+'">Delete</button>'+
            '</div>'+
          '</div>'+
        '</div>';
      }).join("");

      if(archived.length){
        html += '<button type="button" class="show-archived-toggle" id="toggle-archived">'+(showArchivedHabits?"Hide":"Show")+' completed habits ('+archived.length+')</button>';
        if(showArchivedHabits){
          html += archived.map(function(h){
            return '<div class="habit-row archived" data-habit-row="'+h.id+'">'+
              '<span class="drag-handle" style="visibility:hidden">'+DRAG_SVG+'</span>'+
              '<div class="habit-row-main"><div class="habit-row-name">'+esc(h.name)+'</div>'+
                '<div class="habit-row-meta"><span>'+frequencyLabel(h.frequency)+'</span></div></div>'+
              '<div class="habit-menu-wrap">'+
                '<button type="button" class="row-menu-btn" data-menu-toggle="'+h.id+'" title="More">&#8942;</button>'+
                '<div class="row-menu"'+(openHabitMenu===h.id?"":" hidden")+'>'+
                  '<button type="button" data-menu-unarchive="'+h.id+'">Unarchive</button>'+
                  '<button type="button" class="danger" data-menu-delete="'+h.id+'">Delete</button>'+
                '</div>'+
              '</div>'+
            '</div>';
          }).join("");
        }
      }
    }
    html += '</div>';

    html += '<div class="stack-col">'+ heatmapCardHTML() + insightsCardHTML() +
      '<div class="panel"><div class="panel-head"><h2>Notes</h2></div>'+
        '<textarea id="habits-notes" placeholder="Anything about your habits worth remembering...">'+esc(state.habitsNote)+'</textarea>'+
        '<div class="notes-save-row"><button type="button" class="btn" id="habits-notes-save">Save</button></div>'+
      '</div>'+
    '</div>';
    html += '</div>';

    return html;
  }

  /* ============ EXPENSES view ============ */
  var PRESET_CATS = ["Food","Housing","Transport","Health","Fun","Gear","Other"];
  function categoryIconInner(name){
    var key = String(name||"").trim().toLowerCase();
    var paths = {
      food: '<path d="M6 3v7a2 2 0 0 0 4 0V3M8 3v18M16 3c-1.5 0-2 2-2 4s.5 4 2 4 2-2 2-4-.5-4-2-4Zm0 8v10"/>',
      housing: '<path d="M4 11 12 4l8 7"/><path d="M6 10v10h5v-6h2v6h5V10"/>',
      transport: '<path d="M4 16V9a2 2 0 0 1 2-2h2l2-3h4l2 3h2a2 2 0 0 1 2 2v7"/><circle cx="7.5" cy="16.5" r="1.6"/><circle cx="16.5" cy="16.5" r="1.6"/><path d="M4 16h1.9M18.1 16H20"/>',
      health: '<path d="M12 20s-7-4.4-9.3-8.8C1.2 8 3 5 6.2 5c2 0 3.3 1.2 3.8 2 .5-.8 1.8-2 3.8-2 3.2 0 5 3 3.5 6.2C19.7 14.6 12 20 12 20Z"/>',
      fun: '<path d="m12 3 2.6 5.9 6.4.6-4.8 4.3 1.4 6.2L12 16.9 6.4 20l1.4-6.2L3 9.5l6.4-.6Z"/>',
      gear: '<path d="M4 6h2l1.2 10.2A2 2 0 0 0 9.2 18h7.6a2 2 0 0 0 2-1.7L20 8H6.4"/><circle cx="10" cy="21" r="1.3"/><circle cx="17" cy="21" r="1.3"/>',
      other: '<circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>',
      strength: '<path d="M4 12h2m12 0h2M7 12h10M6 8v8M18 8v8"/>',
      cardio: '<path d="M3 12h4l2-7 4 14 2-7h6"/>',
      yoga: '<circle cx="12" cy="5" r="2"/><path d="M12 7v6l-5 6M12 13l5 6M7 12h10"/>',
      mobility: '<path d="M12 4v4M12 20v-4M4 12h4M16 12h4M6.3 6.3l2.8 2.8M14.9 14.9l2.8 2.8M6.3 17.7l2.8-2.8M14.9 9.1l2.8-2.8"/>',
      sport: '<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a12 12 0 0 1 0 16 12 12 0 0 1 0-16Z"/>'
    };
    return paths[key] || null;
  }
  function catIconHTML(name, color){
    var inner = categoryIconInner(name);
    if(inner){
      return '<span class="cat-icon" style="background:'+color+'"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg></span>';
    }
    var letter = String(name||"?").trim().charAt(0).toUpperCase() || "?";
    return '<span class="cat-icon" style="background:'+color+'">'+esc(letter)+'</span>';
  }

  /* ---- month-aware category totals + pie chart + budgets ---- */
  var expensesMonth = null; // {y,m}, lazily set to current month
  function ensureExpensesMonth(){
    if(!expensesMonth){
      var t = parseISO(todayISO());
      expensesMonth = { y:t.getFullYear(), m:t.getMonth() };
    }
  }
  function monthKey(y,m){ return y+"-"+pad(m+1); }
  function expensesMonthLabel(y,m){ return new Date(y,m,1).toLocaleDateString(undefined,{ month:"long", year:"numeric" }); }
  function prevMonthOf(y,m){ return m===0 ? { y:y-1, m:11 } : { y:y, m:m-1 }; }
  function expensesForMonth(y,m){
    var key = monthKey(y,m);
    return state.expenses.filter(function(e){ return (e.date||"").slice(0,7)===key; });
  }
  function categoryTotalsForMonth(y,m){
    var list = expensesForMonth(y,m);
    var total = list.reduce(function(s,e){ return s+Number(e.amount||0); },0);
    var byCat = {};
    PRESET_CATS.forEach(function(c){ byCat[c] = 0; });
    list.forEach(function(e){
      var c = e.category || "Other";
      byCat[c] = (byCat[c]||0) + Number(e.amount||0);
    });
    var entries = Object.keys(byCat).map(function(c){ return { label:c, value:byCat[c], color:colorForCategory(c) }; })
      .sort(function(a,b){ return b.value-a.value; });
    return { list:list, total:total, entries:entries };
  }
  function getBudgetsForMonth(y,m){ return state.budgets[monthKey(y,m)] || {}; }

  function pieChartSVG(entries, size, centerLabel, centerSub){
    var total = entries.reduce(function(s,e){ return s+e.value; },0);
    var cx = size/2, cy = size/2, r = size/2 - size*0.09;
    var strokeW = size*0.26;
    var c = 2*Math.PI*r;
    var segs = "";
    if(total<=0){
      segs = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="'+strokeW+'"/>';
    } else {
      var offset = 0;
      entries.filter(function(e){ return e.value>0; }).forEach(function(e){
        var dash = e.value/total*c;
        segs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+e.color+'" stroke-width="'+strokeW+'" '+
          'stroke-dasharray="'+dash.toFixed(1)+' '+(c-dash).toFixed(1)+'" stroke-dashoffset="'+(-offset).toFixed(1)+'" '+
          'transform="rotate(-90 '+cx+' '+cy+')"><title>'+esc(e.label)+': '+money(e.value)+'</title></circle>';
        offset += dash;
      });
    }
    var labelHTML = centerLabel ?
      '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="'+Math.round(size*0.105)+'" font-weight="700" fill="var(--ink)">'+esc(centerLabel)+'</text>'+
      (centerSub ? '<text x="'+cx+'" y="'+(cy+size*0.11)+'" text-anchor="middle" font-family="Libre Franklin, sans-serif" font-size="'+Math.round(size*0.058)+'" fill="var(--ink-faint)">'+esc(centerSub)+'</text>' : '')
      : '';
    return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+segs+labelHTML+'</svg>';
  }

  function renderExpenses(){
    var today = todayISO();
    ensureExpensesMonth();
    var monthList = state.expenses.filter(function(e){ return inSameMonth(e.date, today); });
    var monthTotal = monthList.reduce(function(s,e){ return s+Number(e.amount||0); },0);

    var spendSeries = last7Days().map(function(iso){
      var sum = state.expenses.filter(function(e){ return e.date===iso; }).reduce(function(s,e){ return s+Number(e.amount||0); },0);
      return { label: dayLetter(iso), value: sum };
    });

    var list = state.expenses.slice().reverse().sort(byDateDesc); // reverse first so same-day ties show newest-added on top

    var html = '<div class="hero-stat">'+
      '<div><div class="hero-label">This Month</div><div class="hero-num">'+money(monthTotal)+'</div><div class="hero-sub">'+monthList.length+' entr'+(monthList.length===1?"y":"ies")+'</div></div>'+
      '<div class="hero-spark">'+dayBarsHTML(spendSeries,"var(--ember)",money)+'</div>'+
    '</div>'+
    '<div class="panel add-block" style="--accent:var(--ember)">'+
      '<div class="panel-head"><h2>Add Expense</h2></div>'+
      '<form class="stack" id="expense-form">'+
        '<div class="field-row">'+
          '<label class="f">Amount<input type="number" step="0.01" min="0" id="exp-amount" placeholder="0.00" required></label>'+
          '<div class="f">Date<input type="hidden" id="exp-date" value="'+today+'" data-picker="date"></div>'+
        '</div>'+
        '<div class="f">Category<select id="exp-category" data-picker="select">'+ PRESET_CATS.map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join("") +'</select></div>'+
        '<label class="f">Note (optional)<input type="text" id="exp-note" placeholder="Add a note..."></label>'+
        '<button class="btn btn-primary" type="submit">Add Expense</button>'+
      '</form>'+
    '</div>';

    var mt = categoryTotalsForMonth(expensesMonth.y, expensesMonth.m);
    var pieEntries = mt.entries.filter(function(e){ return e.value>0; });
    html += '<div class="panel">'+
      '<div class="panel-head"><h2>By Category</h2>'+
        '<div class="month-nav">'+
          '<button type="button" class="btn-ghost" data-exp-month-nav="prev" title="Previous month">&larr;</button>'+
          '<span class="range">'+expensesMonthLabel(expensesMonth.y, expensesMonth.m)+'</span>'+
          '<button type="button" class="btn-ghost" data-exp-month-nav="next" title="Next month">&rarr;</button>'+
        '</div>'+
      '</div>'+
      (mt.total ?
        ('<div class="cat-pie-row">'+
          '<div class="cat-pie-wrap">'+ pieChartSVG(pieEntries, 148, money(mt.total), mt.list.length+' entr'+(mt.list.length===1?"y":"ies")) +'</div>'+
          '<div class="cat-pie-list">'+ mt.entries.map(function(c){
            var pct = mt.total ? Math.round(c.value/mt.total*100) : 0;
            return '<div class="cat-row">'+ catIconHTML(c.label,c.color) +
              '<span class="cat-label">'+esc(c.label)+'</span>'+
              '<span class="cat-track"><span class="cat-fill" style="width:'+pct+'%;background:'+c.color+'"></span></span>'+
              '<span class="cat-amt">'+money(c.value)+'</span>'+
              '<span class="cat-pct">'+pct+'%</span>'+
            '</div>';
          }).join("") + '</div>'+
        '</div>')
        : '<p class="cat-pie-empty">No expenses logged in '+expensesMonthLabel(expensesMonth.y, expensesMonth.m)+'.</p>'
      )+
    '</div>';

    var budgets = getBudgetsForMonth(expensesMonth.y, expensesMonth.m);
    var budgetCats = {};
    PRESET_CATS.forEach(function(c){ budgetCats[c]=true; });
    Object.keys(budgets).forEach(function(c){ budgetCats[c]=true; });
    mt.entries.forEach(function(c){ if(c.value>0) budgetCats[c.label]=true; });
    var budgetRows = Object.keys(budgetCats).sort().map(function(c){
      var spentEntry = mt.entries.find(function(e){ return e.label===c; });
      return { label:c, color:colorForCategory(c), spent: spentEntry?spentEntry.value:0, budget: Number(budgets[c]||0) };
    });
    var totalBudget = budgetRows.reduce(function(s,r){ return s+r.budget; },0);
    var totalSpentBudgeted = budgetRows.reduce(function(s,r){ return s+r.spent; },0);
    var totalRemaining = totalBudget - totalSpentBudgeted;

    var prevM = prevMonthOf(expensesMonth.y, expensesMonth.m);
    var prevBudgets = state.budgets[monthKey(prevM.y, prevM.m)];
    var showCopy = Object.keys(budgets).length===0 && prevBudgets && Object.keys(prevBudgets).length>0;

    html += '<div class="panel">'+
      '<div class="panel-head"><h2>Budget Planner</h2><span class="hint">'+expensesMonthLabel(expensesMonth.y, expensesMonth.m)+'</span></div>'+
      (totalBudget>0 ? (
        '<div class="budget-summary">'+
          '<div class="stat-tile" style="--accent:var(--ember)"><div class="label">Budgeted</div><div class="value">'+money(totalBudget)+'</div></div>'+
          '<div class="stat-tile" style="--accent:var(--steel)"><div class="label">Spent</div><div class="value">'+money(totalSpentBudgeted)+'</div></div>'+
          '<div class="stat-tile" style="--accent:'+(totalRemaining<0?"var(--bad)":"var(--good)")+'"><div class="label">'+(totalRemaining<0?"Over by":"Left")+'</div><div class="value">'+money(Math.abs(totalRemaining))+'</div></div>'+
        '</div>'
      ) : '')+
      (showCopy ? '<div class="budget-copy-row"><button type="button" class="btn" id="budget-copy-prev">Copy '+expensesMonthLabel(prevM.y,prevM.m)+"'s budgets</button></div>" : '')+
      budgetRows.map(function(r){
        var hasBudget = r.budget>0;
        var pct = hasBudget ? Math.min(100, Math.round(r.spent/r.budget*100)) : 0;
        var over = hasBudget && r.spent>r.budget;
        var barColor = over ? "var(--bad)" : r.color;
        var sub = hasBudget
          ? (money(r.spent)+' of '+money(r.budget)+' spent · '+(over ? 'over by '+money(r.spent-r.budget) : money(r.budget-r.spent)+' left'))
          : (money(r.spent)+' spent · no budget set');
        return '<div class="budget-row">'+
          '<div class="budget-row-top">'+ catIconHTML(r.label, r.color) +
            '<span class="budget-cat-label">'+esc(r.label)+'</span>'+
            '<span class="budget-input-wrap">€<input type="number" min="0" step="1" class="budget-input" data-budget-cat="'+esc(r.label)+'" value="'+(r.budget? r.budget : "")+'" placeholder="0"></span>'+
          '</div>'+
          '<div class="budget-bar-track"><span class="budget-bar-fill" style="width:'+(hasBudget?pct:0)+'%;background:'+barColor+'"></span></div>'+
          '<div class="budget-row-sub'+(over?" over":"")+'">'+sub+'</div>'+
        '</div>';
      }).join("") +
    '</div>';

    html += '<div class="panel"><div class="panel-head"><h2>Recent Expenses</h2><span class="hint">'+list.length+' total</span></div>'+ recentRowsHTML(list,"expense") +'</div>';
    return html;
  }

  /* ============ WORKOUTS view ============ */
  function renderWorkouts(){
    var today = todayISO();
    var weekList = state.workouts.filter(function(w){ return inSameWeek(w.date, today); });
    var byType = {};
    weekList.forEach(function(w){ byType[w.type] = (byType[w.type]||0) + Number(w.duration||0); });
    var typeEntries = Object.keys(byType).map(function(t){ return { label:capitalize(t), value:byType[t], color:colorForCategory(t) }; }).sort(function(a,b){ return b.value-a.value; });

    var list = state.workouts.slice().reverse().sort(byDateDesc); // reverse first so same-day ties show newest-added on top

  /* ============ READING view (books) ============ */
  function hashHue(str){
    var h=0; for(var i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
    return h % 360;
  }
  function wrapTitle(title, maxChars, maxLines){
    var words = String(title||"").trim().split(/\s+/).filter(Boolean);
    var lines = [], cur = "";
    words.forEach(function(w){
      var test = cur ? cur+" "+w : w;
      if(test.length > maxChars && cur){ lines.push(cur); cur = w; }
      else cur = test;
    });
    if(cur) lines.push(cur);
    if(!lines.length) lines = [""];
    if(lines.length > maxLines){
      lines = lines.slice(0, maxLines);
      var last = lines[maxLines-1];
      lines[maxLines-1] = last.length > maxChars-1 ? last.slice(0, maxChars-1)+"…" : last+"…";
    }
    return lines;
  }
  function coverSVG(book){
    var hue = hashHue(book.title||"book");
    var lines = wrapTitle(book.title, 13, 4);
    var startY = 96 - (lines.length-1)*8;
    var gid = "cv"+book.id;
    var text = lines.map(function(line,i){
      return '<text x="60" y="'+(startY+i*17)+'" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#F6F2E7">'+esc(line)+'</text>';
    }).join("");
    var authorY = startY + lines.length*17 + 14;
    var authorText = book.author ? '<text x="60" y="'+authorY+'" text-anchor="middle" font-family="Libre Franklin, sans-serif" font-size="8.5" fill="rgba(255,255,255,.72)">'+esc(book.author)+'</text>' : "";
    return '<svg viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cover placeholder">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0" stop-color="hsl('+hue+' 44% 30%)"/>'+
        '<stop offset="1" stop-color="hsl('+((hue+26)%360)+' 55% 15%)"/>'+
      '</linearGradient></defs>'+
      '<rect width="120" height="180" fill="url(#'+gid+')"/>'+
      '<rect x="9" y="9" width="102" height="162" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1"/>'+
      '<line x1="9" y1="150" x2="111" y2="150" stroke="rgba(255,255,255,.28)" stroke-width="1"/>'+
      text + authorText +
    '</svg>';
  }
  function ringSVG(pct, colorVar){
    var r=16, c=2*Math.PI*r;
    var dash = Math.max(0, Math.min(100,pct))/100*c;
    return '<svg viewBox="0 0 40 40">'+
      '<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="4"/>'+
      '<circle cx="20" cy="20" r="'+r+'" fill="none" stroke="'+colorVar+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+dash.toFixed(1)+' '+c.toFixed(1)+'"/>'+
    '</svg>';
  }
  function bookHistorySorted(b){
    return (b.history||[]).slice().sort(function(a,c){ return a.date<c.date?-1:a.date>c.date?1:0; });
  }
  /* Pages read on a given date, sourced from the Library's unified activity log (any item in
     the Books category with a progress-style entry that day). Kept as its own function with
     this exact name/signature since Home/Today/Calendar all call it directly — updating it here
     is the only change those callers needed when Reading was replaced by Library. */
  function pagesReadOnDate(iso){
    var total = 0;
    state.library.activity.forEach(function(a){
      if(a.date!==iso) return;
      if(a.progressBefore==null || a.progressAfter==null) return;
      var item = state.library.items.filter(function(it){ return it.id===a.itemId; })[0];
      if(!item || item.categoryId!=="books") return;
      var delta = a.progressAfter - a.progressBefore;
      if(delta>0) total += delta;
    });
    return total;
  }

  /* ============ LIBRARY view ============ */
  function libraryItemById(id){ return state.library.items.filter(function(it){ return it.id===id; })[0] || null; }
  function libraryCategoryItems(catId){ return state.library.items.filter(function(it){ return it.categoryId===catId; }); }
  function libraryCategoryItemCount(catId){ return libraryCategoryItems(catId).length; }
  /* Generic placeholder cover, same visual language as the old book covers, generalized to
     item.title/item.creator instead of book.title/book.author so every category gets one. */
  function libraryCoverSVG(item){
    var hue = hashHue(item.title||item.categoryId||"item");
    var lines = wrapTitle(item.title, 13, 4);
    var startY = 96 - (lines.length-1)*8;
    var gid = "lc"+item.id;
    var text = lines.map(function(line,i){
      return '<text x="60" y="'+(startY+i*17)+'" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#F6F2E7">'+esc(line)+'</text>';
    }).join("");
    var authorY = startY + lines.length*17 + 14;
    var authorText = item.creator ? '<text x="60" y="'+authorY+'" text-anchor="middle" font-family="Libre Franklin, sans-serif" font-size="8.5" fill="rgba(255,255,255,.72)">'+esc(item.creator)+'</text>' : "";
    return '<svg viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cover placeholder">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0" stop-color="hsl('+hue+' 44% 30%)"/>'+
        '<stop offset="1" stop-color="hsl('+((hue+26)%360)+' 55% 15%)"/>'+
      '</linearGradient></defs>'+
      '<rect width="120" height="180" fill="url(#'+gid+')"/>'+
      '<rect x="9" y="9" width="102" height="162" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1"/>'+
      '<line x1="9" y1="150" x2="111" y2="150" stroke="rgba(255,255,255,.28)" stroke-width="1"/>'+
      text + authorText +
    '</svg>';
  }
  function libraryCoverHTML(item){
    var inner = item.coverImage ? '<img src="'+item.coverImage+'" alt="">' : libraryCoverSVG(item);
    return '<div class="lib-cover">'+inner+(item.favorite?'<span class="lib-fav-badge">'+HEART_SVG+'</span>':'')+'</div>';
  }
  function libraryItemProgressPct(item){
    var meta = categoryMeta(item.categoryId);
    if(meta.progressType==="percentage") return item.progressCurrent!=null ? Math.max(0,Math.min(100,item.progressCurrent)) : 0;
    if(meta.progressType==="pages" || meta.progressType==="tracks"){
      if(!item.progressTotal) return 0;
      return Math.max(0, Math.min(100, Math.round((item.progressCurrent||0)/item.progressTotal*100)));
    }
    if(meta.progressType==="episodes"){
      if(!item.progressTotal) return 0;
      return Math.max(0, Math.min(100, Math.round((item.progressCurrent||0)/item.progressTotal*100)));
    }
    return null;
  }
  function libraryItemProgressLabel(item){
    var meta = categoryMeta(item.categoryId);
    if(meta.progressType==="pages") return (item.progressCurrent||0)+" / "+(item.progressTotal||"?")+" pages";
    if(meta.progressType==="percentage") return (item.progressCurrent||0)+"%";
    if(meta.progressType==="episodes") return "Ep "+(item.progressCurrent||0)+(item.progressTotal?" / "+item.progressTotal:"")+(item.progressSeason?" · S"+item.progressSeason:"");
    if(meta.progressType==="tracks") return (item.progressCurrent||0)+" / "+(item.progressTotal||"?")+" tracks";
    return item.progressLabel || "";
  }
  /* 10-point rating: interactive star row when itemId is given (click sets & logs a "rated"
     activity), a compact static badge otherwise (used on cards/lists). */
  function ratingStarsHTML(value, itemId){
    var stars = "";
    for(var i=1;i<=10;i++){
      stars += '<button type="button" class="rating-star'+(value>=i?" filled":"")+'" data-lib-rate-star="'+i+'" title="'+i+'/10">'+STAR_SVG+'</button>';
    }
    return '<div class="rating-stars" data-lib-rating-row="'+esc(itemId||"")+'">'+stars+'</div>';
  }
  function miniRatingHTML(item){
    if(item.rating==null) return "";
    return '<span class="lib-rating-mini">'+STAR_SVG+item.rating+'/10</span>';
  }
  function libraryItemCardHTML(item){
    var cat = libraryCategoryById(item.categoryId);
    var pct = libraryItemProgressPct(item);
    return '<div class="lib-card" data-lib-open-item="'+item.id+'">'+
      libraryCoverHTML(item)+
      '<div class="lib-card-title">'+esc(item.title)+'</div>'+
      (item.creator?'<div class="lib-card-creator">'+esc(item.creator)+'</div>':'')+
      (pct!=null && item.status==="active" ? '<div class="material-progress-row" style="margin-top:0"><span class="material-progress-track"><span class="material-progress-fill" style="width:'+pct+'%;background:'+libraryCategoryColorVar(item.categoryId)+'"></span></span></div>' : '')+
      '<div class="lib-card-meta-row">'+
        '<span class="status-pill" style="background:color-mix(in srgb, '+libraryCategoryColorVar(item.categoryId)+' 18%, transparent); color:'+libraryCategoryColorVar(item.categoryId)+'">'+esc(libraryStatusLabel(item.categoryId, item.status))+'</span>'+
        miniRatingHTML(item)+
      '</div>'+
    '</div>';
  }
  function libraryFilteredItems(opts){
    opts = opts || {};
    var items = state.library.items.slice();
    if(opts.categoryId) items = items.filter(function(it){ return it.categoryId===opts.categoryId; });
    if(opts.favoritesOnly) items = items.filter(function(it){ return it.favorite; });
    if(opts.owned) items = items.filter(function(it){ return it.owned; });
    if(opts.status && opts.status!=="all") items = items.filter(function(it){ return it.status===opts.status; });
    if(opts.query){
      var q = opts.query.toLowerCase();
      items = items.filter(function(it){ return (it.title||"").toLowerCase().indexOf(q)>-1 || (it.creator||"").toLowerCase().indexOf(q)>-1 || (it.tags||[]).some(function(t){ return t.toLowerCase().indexOf(q)>-1; }); });
    }
    items.reverse().sort(function(a,b){ // reverse first so same-date ties show newest-added on top
      var la = a.lastInteractionDate||a.updatedAt||a.dateAdded, lb = b.lastInteractionDate||b.updatedAt||b.dateAdded;
      return la<lb ? 1 : la>lb ? -1 : 0;
    });
    return items;
  }
  function libraryContinueSectionHTML(){
    var items = state.library.items.filter(function(it){ return it.status==="active" && categoryMeta(it.categoryId).progressType!=="none"; });
    items.sort(function(a,b){ var la=a.lastInteractionDate||a.dateAdded, lb=b.lastInteractionDate||b.dateAdded; return la<lb?1:la>lb?-1:0; });
    items = items.slice(0,8);
    if(!items.length) return "";
    return '<div class="panel" style="margin-top:20px">'+
      '<div class="panel-head"><h2>Continue where you left off</h2></div>'+
      '<div class="lib-hscroll">'+items.map(function(it){
        var pct = libraryItemProgressPct(it);
        return '<div class="lib-hcard" data-lib-open-item="'+it.id+'">'+
          libraryCoverHTML(it)+
          '<div class="lib-hcard-title">'+esc(it.title)+'</div>'+
          '<div class="lib-hcard-sub">'+esc(libraryItemProgressLabel(it))+'</div>'+
          (pct!=null?'<div class="material-progress-row" style="margin-top:0"><span class="material-progress-track"><span class="material-progress-fill" style="width:'+pct+'%;background:'+libraryCategoryColorVar(it.categoryId)+'"></span></span></div>':'')+
        '</div>';
      }).join("")+'</div>'+
    '</div>';
  }
  function libraryRecentSectionHTML(){
    var seen = {}, out = [];
    state.library.activity.slice().reverse().sort(byDateDesc).forEach(function(a){ // reverse first so same-day ties show newest-added on top
      if(seen[a.itemId]) return;
      var item = libraryItemById(a.itemId);
      if(!item) return;
      seen[a.itemId] = true;
      out.push(item);
    });
    out = out.slice(0,8);
    if(!out.length) return "";
    return '<div class="panel" style="margin-top:20px">'+
      '<div class="panel-head"><h2>Recently experienced</h2></div>'+
      '<div class="lib-hscroll">'+out.map(function(it){
        var cat = libraryCategoryById(it.categoryId);
        return '<div class="lib-hcard" data-lib-open-item="'+it.id+'">'+
          libraryCoverHTML(it)+
          '<div class="lib-hcard-title">'+esc(it.title)+'</div>'+
          '<div class="lib-hcard-sub">'+(cat?esc(cat.name):"")+'</div>'+
        '</div>';
      }).join("")+'</div>'+
    '</div>';
  }
  function libraryFavoritesSectionHTML(){
    var items = state.library.items.filter(function(it){ return it.favorite; });
    if(!items.length) return "";
    return '<div class="panel" style="margin-top:20px">'+
      '<div class="panel-head"><h2>Favorites</h2></div>'+

        '</div>';
      }).join("")+'</div>'+

  }
  /* Monthly culture/discovery dot-grid: one square per day of the current month, lit up when
     any Library activity happened that day — a lightweight, optional visualization, not a full
     calendar (Calendar tab already covers that in depth). */
  function libraryMonthDotGridHTML(){
    var today = todayISO();
    var y = Number(today.slice(0,4)), m = Number(today.slice(5,7))-1;
    var daysInMonth = new Date(y,m+1,0).getDate();
    var activeDays = {};
    state.library.activity.forEach(function(a){ if(a.date && a.date.slice(0,7)===today.slice(0,7)) activeDays[a.date]=true; });
    var cells = "";
    for(var d=1; d<=daysInMonth; d++){
      var iso = today.slice(0,8)+pad(d);
      var cls = iso>today ? "future" : (activeDays[iso] ? "on" : "");
      cells += '<div class="lib-dot '+cls+'" title="'+iso+'"></div>';
    }
    var monthLabel = parseISO(today).toLocaleDateString(undefined,{ month:"long" });
    return '<div class="panel" style="margin-top:20px">'+
      '<div class="panel-head"><h2 style="font-size:.9rem">This month in culture — '+esc(monthLabel)+'</h2></div>'+
      '<div class="lib-dotgrid">'+cells+'</div>'+
    '</div>';
  }

  /* ---- Item detail page ---- */
  function libraryItemPageHTML(itemId){
    var item = libraryItemById(itemId);

    var cat = libraryCategoryById(item.categoryId);
    var color = libraryCategoryColorVar(item.categoryId);
    var meta = categoryMeta(item.categoryId);
    var pct = libraryItemProgressPct(item);

    var statusOpts = ["wishlist","saved","active","completed","paused","dropped"].map(function(s){
      return '<option value="'+s+'"'+(item.status===s?" selected":"")+'>'+esc(libraryStatusLabel(item.categoryId,s))+'</option>';
    }).join("");

    var detailFields = "";
    if(item.categoryId==="books"){
      detailFields = [["Edition",item.edition],["Publisher",item.publisher],["ISBN",item.isbn]];
    } else if(item.categoryId==="movies"){
      detailFields = [["Genre",item.genre],["Runtime",item.runtime?item.runtime+" min":""],["Rewatch",item.rewatch?"Yes":""]];
    } else if(item.categoryId==="tv"){
      detailFields = [["Genre",item.genre],["Total seasons",item.totalSeasons]];
    } else if(item.categoryId==="music"){
      detailFields = [["Tracks",item.tracks],["Format",item.physicalFormat],["Favorite tracks",item.favoriteTracks]];
    } else if(item.categoryId==="podcasts"){
      detailFields = [["Genre",item.genre]];
    } else if(item.categoryId==="wine"){

    } else {
      detailFields = [];

    }

    var tabsHTML = '<div class="cal-subtabs" style="margin-top:16px">'+
      '<button type="button" class="cal-subtab'+(libraryItemTab==="overview"?" active":"")+'" data-lib-item-tab="overview">Overview</button>'+
      '<button type="button" class="cal-subtab'+(libraryItemTab==="history"?" active":"")+'" data-lib-item-tab="history">History</button>'+
    '</div>';

    var bodyHTML;

        return '<div class="lib-history-row"><span class="lib-history-dot" style="background:'+color+'"></span>'+

        '</div>';
      }).join("")+'</div>' : '<p class="empty">No activity logged yet.</p>';
    } else {
      bodyHTML = progressBlock+
        (detailRows ? '<div class="panel" style="margin-top:16px"><div class="panel-head"><h2 style="font-size:.9rem">Details</h2></div><div class="continue-table">'+detailRows+'</div></div>' : "")+
        '<div class="panel" style="margin-top:16px"><div class="panel-head"><h2 style="font-size:.9rem">Notes</h2>'+
          (libraryShowNoteEdit?"":'<button type="button" class="btn" data-lib-edit-notes>Edit</button>')+

            '<div class="modal-actions"><button type="button" class="btn-ghost" data-lib-cancel-notes>Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form>' :

    var html = '<div class="habits-head"><button type="button" class="back-btn" data-lib-back-overview>← Library</button></div>'+

          '<div class="lib-detail-meta-row">'+
            '<span class="status-pill" style="background:color-mix(in srgb, '+color+' 18%, transparent); color:'+color+'">'+esc(cat?cat.name:"")+'</span>'+

          '</div>'+
          ratingStarsHTML(item.rating||0, item.id)+
          (item.description?'<p class="hint" style="margin-top:4px">'+esc(item.description)+'</p>':'')+

        '</div>'+

    if(libraryShowAddItem) html += libraryAddItemModalHTML();

    return '<div class="modal-backdrop" data-lib-modal-backdrop>'+

  /* ============ STUDY view (subjects → materials → chapters → sessions) ============ */

  var STUDY_METHODS = ["Reading","Deep work","Review","Practice questions","Flashcards","Active recall","Spaced repetition","Writing notes","Summarising","Watching lecture","Listening","Language practice","Exam practice","Other"];

  var STUDY_COLOR_PALETTE = [
    {key:"home-blue",   var:"var(--home-blue)"},
    {key:"ember",       var:"var(--ember)"},
    {key:"mustard",     var:"var(--mustard)"},
    {key:"gold",        var:"var(--gold)"},
    {key:"plum",        var:"var(--plum)"},
    {key:"steel",       var:"var(--steel)"},
    {key:"home-purple", var:"var(--home-purple)"},
    {key:"home-teal",   var:"var(--home-teal)"},
    {key:"rose",        var:"var(--rose)"}
  ];
  function subjectColorVar(subj){
    var found = STUDY_COLOR_PALETTE.filter(function(c){ return c.key===subj.color; })[0];
    if(found) return found.var;
    var h=0, name=subj.name||"subject";
    for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
    return STUDY_COLOR_PALETTE[h % STUDY_COLOR_PALETTE.length].var;
  }
  /* Vivid chart-only variants of the same palette (same key order as STUDY_COLOR_PALETTE),
     used just for the Study time by subject donut + its legend so the chart reads with more
     punch than the muted subject-pill colors elsewhere in the app. */
  var STUDY_CHART_PALETTE = [
    {key:"home-blue",   var:"var(--chart-blue)"},
    {key:"ember",       var:"var(--chart-ember)"},
    {key:"mustard",     var:"var(--chart-mustard)"},
    {key:"gold",        var:"var(--chart-gold)"},
    {key:"plum",        var:"var(--chart-plum)"},
    {key:"steel",       var:"var(--chart-steel)"},
    {key:"home-purple", var:"var(--chart-purple)"},
    {key:"home-teal",   var:"var(--chart-teal)"},
    {key:"rose",        var:"var(--chart-rose)"}
  ];
  function subjectChartColor(subj){
    var found = STUDY_CHART_PALETTE.filter(function(c){ return c.key===subj.color; })[0];
    if(found) return found.var;
    var h=0, name=subj.name||"subject";
    for(var i=0;i<name.length;i++) h=(h*31+name.charCodeAt(i))>>>0;
    return STUDY_CHART_PALETTE[h % STUDY_CHART_PALETTE.length].var;
  }
  var STUDY_ICON_KEYS = ["cap","book","briefcase","people","leaf","sparkle"];
  function subjectIconSvg(key){
    if(key==="book") return BOOK_SVG;
    if(key==="briefcase") return BRIEFCASE_SVG;
    if(key==="people") return PEOPLE_SVG;
    if(key==="leaf") return LEAF_SVG;
    if(key==="sparkle") return SPARKLE_SVG;
    return CAP_SVG;
  }

  var MATERIAL_TYPES = [
    {key:"book", label:"Book"}, {key:"course", label:"Course"}, {key:"notes", label:"Notes"},
    {key:"pdf", label:"PDF"}, {key:"question-bank", label:"Question bank"},
    {key:"website", label:"Website"}, {key:"other", label:"Other"}
  ];
  function materialTypeLabel(key){
    var f = MATERIAL_TYPES.filter(function(t){ return t.key===key; })[0];
    return f ? f.label : "Material";
  }

  /* ---- chapter tree helpers (2 levels: chapters + subchapters) ---- */
  function chaptersOf(materialId){
    return state.study.chapters.filter(function(c){ return c.materialId===materialId; });
  }
  function childChapters(materialId, parentId){
    return chaptersOf(materialId).filter(function(c){ return (c.parentChapterId||null)===(parentId||null); })
      .sort(function(a,b){ return a.order-b.order; });
  }
  function chapterEffectiveProgress(c){
    var kids = childChapters(c.materialId, c.id);
    if(!kids.length) return Math.max(0, Math.min(100, Number(c.progress||0)));
    var sum = kids.reduce(function(s,k){ return s+chapterEffectiveProgress(k); },0);
    return Math.round(sum/kids.length);
  }
  function chapterDisplayNumber(c){
    var siblings = childChapters(c.materialId, c.parentChapterId);
    var idx = -1;
    siblings.forEach(function(s,i){ if(s.id===c.id) idx=i; });
    idx += 1;
    if(!c.parentChapterId) return String(idx);
    var parent = state.study.chapters.filter(function(p){ return p.id===c.parentChapterId; })[0];
    return (parent ? chapterDisplayNumber(parent) : "?") + "." + idx;
  }
  function moveChapter(id, dir){
    var c = state.study.chapters.filter(function(x){ return x.id===id; })[0];
    if(!c) return;
    var sibs = childChapters(c.materialId, c.parentChapterId);
    var idx=-1; sibs.forEach(function(s,i){ if(s.id===id) idx=i; });
    var swapIdx = dir==="up" ? idx-1 : idx+1;
    if(idx<0 || swapIdx<0 || swapIdx>=sibs.length) return;
    var other = sibs[swapIdx];
    var tmp = c.order; c.order = other.order; other.order = tmp;
    save();
  }
  function toggleExpandAllChapters(materialId){
    var top = childChapters(materialId, null).filter(function(c){ return childChapters(materialId,c.id).length; });
    var anyExpanded = top.some(function(c){ return !studyCollapsedChapters[c.id]; });
    top.forEach(function(c){ studyCollapsedChapters[c.id] = anyExpanded; });
  }

  /* ---- material helpers ---- */
  function materialsOf(subjectId){
    return state.study.materials.filter(function(m){ return m.subjectId===subjectId; });
  }
  function materialProgress(m){
    if(typeof m.progressOverride==="number") return m.progressOverride;
    var top = childChapters(m.id, null);
    if(!top.length) return 0;
    var sum = top.reduce(function(s,c){ return s+chapterEffectiveProgress(c); },0);
    return Math.round(sum/top.length);
  }
  function materialChapterCounts(m){
    var all = chaptersOf(m.id);
    var completed = all.filter(function(c){ return chapterEffectiveProgress(c)>=100; }).length;
    return { completed:completed, total:all.length };
  }
  function materialSessions(materialId){
    // reverse first so same-day ties show newest-added on top
    return state.study.sessions.filter(function(ss){ return ss.materialId===materialId; }).slice().reverse().sort(byDateDesc);
  }
  function materialLastStudied(m){ var s=materialSessions(m.id); return s.length ? s[0].date : null; }
  function materialFirstStudied(m){
    var s = materialSessions(m.id);
    if(!s.length) return null;
    return s.reduce(function(min,ss){ return (!min||ss.date<min) ? ss.date : min; }, null);
  }
  function materialTotalMinutes(m){ return materialSessions(m.id).reduce(function(s,ss){ return s+Number(ss.minutes||0); },0); }

  /* ---- subject helpers ---- */
  function activeSubjects(){ return state.study.subjects.filter(function(s){ return !s.archived; }).sort(function(a,b){ return a.order-b.order; }); }
  function subjectSessions(subjectId){
    // reverse first so same-day ties show newest-added on top
    return state.study.sessions.filter(function(ss){ return ss.subjectId===subjectId; }).slice().reverse().sort(byDateDesc);
  }
  function subjectTotalMinutes(subjectId){ return subjectSessions(subjectId).reduce(function(s,ss){ return s+Number(ss.minutes||0); },0); }
  function subjectMinutesInRange(subjectId, fromISO, toISO){
    return subjectSessions(subjectId).filter(function(ss){ return ss.date>=fromISO && ss.date<=toISO; })
      .reduce(function(s,ss){ return s+Number(ss.minutes||0); },0);
  }
  function subjectLastStudied(subjectId){ var s=subjectSessions(subjectId); return s.length ? s[0].date : null; }
  function subjectStreak(subjectId){
    var days={}; subjectSessions(subjectId).forEach(function(ss){ days[ss.date]=true; });
    var streak=0, cur=todayISO();
    while(days[cur]){ streak++; cur=addDays(cur,-1); }
    return streak;
  }

  function materialCoverSVG(m){
    var hue = hashHue(m.title||"material");
    var lines = wrapTitle(m.title, 13, 4);
    var startY = 96 - (lines.length-1)*8;
    var gid = "mc"+m.id;
    var text = lines.map(function(line,i){
      return '<text x="60" y="'+(startY+i*17)+'" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="12.5" font-weight="600" fill="#F6F2E7">'+esc(line)+'</text>';
    }).join("");
    var authorY = startY + lines.length*17 + 14;
    var authorText = m.author ? '<text x="60" y="'+authorY+'" text-anchor="middle" font-family="Libre Franklin, sans-serif" font-size="8.5" fill="rgba(255,255,255,.72)">'+esc(m.author)+'</text>' : "";
    return '<svg viewBox="0 0 120 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cover placeholder">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1">'+
        '<stop offset="0" stop-color="hsl('+hue+' 44% 30%)"/>'+
        '<stop offset="1" stop-color="hsl('+((hue+26)%360)+' 55% 15%)"/>'+
      '</linearGradient></defs>'+
      '<rect width="120" height="180" fill="url(#'+gid+')"/>'+
      '<rect x="9" y="9" width="102" height="162" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1"/>'+
      '<line x1="9" y1="150" x2="111" y2="150" stroke="rgba(255,255,255,.28)" stroke-width="1"/>'+
      text + authorText +
    '</svg>';
  }

  function donutSVG(entries, size, centerLabel, centerSub){
    var total = entries.reduce(function(s,e){ return s+e.value; },0);
    var strokeW=size*0.22, cx=size/2, cy=size/2, r=size/2-strokeW/2-size*0.02, c=2*Math.PI*r;
    var segs="";
    if(total<=0){
      segs = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="'+strokeW+'"/>';
    } else {
      var offset=0;
      entries.filter(function(e){ return e.value>0; }).forEach(function(e){
        var dash = e.value/total*c;
        segs += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+e.color+'" stroke-width="'+strokeW+'" '+
          'stroke-dasharray="'+dash.toFixed(1)+' '+(c-dash).toFixed(1)+'" stroke-dashoffset="'+(-offset).toFixed(1)+'" '+
          'transform="rotate(-90 '+cx+' '+cy+')"><title>'+esc(e.label)+': '+fmtMinutes(e.value)+'</title></circle>';
        offset += dash;
      });
    }
    var labelHTML = centerLabel ?
      '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="'+Math.round(size*0.105)+'" font-weight="700" fill="var(--ink)">'+esc(centerLabel)+'</text>'+
      (centerSub ? '<text x="'+cx+'" y="'+(cy+size*0.11)+'" text-anchor="middle" font-family="Libre Franklin, sans-serif" font-size="'+Math.round(size*0.058)+'" fill="var(--ink-faint)">'+esc(centerSub)+'</text>' : '')
      : '';
    return '<svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'">'+segs+labelHTML+'</svg>';
  }

  function ensureStudyDefaults(){
    if(studySubjectId && !state.study.subjects.some(function(s){ return s.id===studySubjectId; })){
      studySubjectId = null; if(studyPage!=="overview") studyPage = "overview";
    }
    if(studyMaterialId && !state.study.materials.some(function(m){ return m.id===studyMaterialId; })){
      studyMaterialId = null; if(studyPage==="material") studyPage = studySubjectId ? "subject" : "overview";
    }
  }

  /* ---- session row (used on Overview, Subject, and Material pages) ---- */
  function studySessionRowHTML(ss, opts){
    opts = opts || {};
    var subj = state.study.subjects.filter(function(s){ return s.id===ss.subjectId; })[0];
    var mat = ss.materialId ? state.study.materials.filter(function(m){ return m.id===ss.materialId; })[0] : null;
    var chap = ss.chapterId ? state.study.chapters.filter(function(c){ return c.id===ss.chapterId; })[0] : null;
    var color = subj ? subjectColorVar(subj) : "var(--rose)";
    var titleParts = [];
    if(!opts.hideSubject && subj) titleParts.push(esc(subj.name));
    if(chap) titleParts.push(esc(chap.title));
    else if(mat) titleParts.push(esc(mat.title));
    else if(ss.topic) titleParts.push(esc(ss.topic));
    var title = titleParts.length ? titleParts.join(": ") : (subj?esc(subj.name)+" session":"Study session");
    var metaParts = [fmtMinutes(ss.minutes)];
    if(ss.methods && ss.methods.length) metaParts.push(ss.methods.join(", "));
    var dayLabel = daysAgoLabel(ss.date);
    var timeLabel = dayLabel.charAt(0).toUpperCase()+dayLabel.slice(1) + (ss.startTime?" · "+ss.startTime:"");
    return '<div class="study-sess-row" data-study-session-row="'+ss.id+'">'+

      '<div class="study-sess-main">'+
        '<div class="study-sess-time">'+esc(timeLabel)+'</div>'+
        '<div class="study-sess-title">'+title+'</div>'+
        '<div class="study-sess-meta">'+esc(metaParts.join(" · "))+(ss.notes?" — "+esc(ss.notes):"")+'</div>'+

  function studyWeeklyPlanTabHTML(){
    var weekStart = studyPlanWeekStart || startOfWeekISO(todayISO());
    var subs = activeSubjects();
    var days = []; for(var i=0;i<7;i++) days.push(addDays(weekStart,i));
    var dayLabels = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
    var planned = state.study.planned.filter(function(p){ return p.date>=weekStart && p.date<=addDays(weekStart,6); });
    var gridRows = subs.map(function(s){
      var c = subjectColorVar(s);
      var cells = days.map(function(d){
        var items = planned.filter(function(p){ return p.subjectId===s.id && p.date===d; });
        if(!items.length) return '<td class="chal-plan-cell" data-study-plan-add-date="'+d+'" data-study-plan-add-subject="'+s.id+'"><span class="chal-plan-add">+</span></td>';
        return '<td class="chal-plan-cell">'+items.map(function(p){
          return '<div class="chal-plan-item'+(p.completed?" done":"")+'" data-study-plan-open="'+p.id+'">'+(p.completed?'<span class="chal-plan-check">'+CHECK_SVG+'</span> ':'')+esc(p.title)+'</div>';
        }).join("")+'</td>';
      }).join("");
      return '<tr><th style="color:'+c+'">'+esc(s.name)+'</th>'+cells+'</tr>';
    }).join("");
    var grid = '<div class="table-wrap" style="overflow-x:auto"><table class="chal-plan-grid"><thead><tr><th></th>'+
      days.map(function(d,i){ return '<th>'+dayLabels[i]+'<div class="hint">'+parseISO(d).getDate()+'</div></th>'; }).join("")+
      '</tr></thead><tbody>'+(subs.length?gridRows:'<tr><td colspan="8" class="empty">Add a subject to start planning your week.</td></tr>')+'</tbody></table></div>';
    var head = '<p class="hint" style="margin:-8px 0 16px">Plan study sessions across all your subjects for the week ahead.</p>'+
      '<div class="month-nav" style="margin:0 0 16px">'+
        '<button type="button" class="btn-ghost" data-study-plan-today>Today</button>'+
        '<button type="button" class="btn-ghost" data-study-plan-nav="-1">‹</button>'+
        '<span class="hint" style="font-weight:600">'+weekRangeLabel(weekStart)+'</span>'+
        '<button type="button" class="btn-ghost" data-study-plan-nav="1">›</button>'+
      '</div>';
    var goalSubs = subs.filter(function(s){ return s.weeklyGoalMinutes>0; });
    var weeklyGoalsHTML = '<div class="panel"><div class="panel-head"><h2>Weekly goals</h2></div>'+
      (goalSubs.length ? goalSubs.map(function(s){
        var c = subjectColorVar(s);
        var cur = subjectMinutesInRange(s.id, weekStart, addDays(weekStart,6));
        var pct = Math.min(100, Math.round(cur/s.weeklyGoalMinutes*100));
        return '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:.85rem"><span>'+esc(s.name)+'</span><span class="hint">'+fmtMinutes(cur)+' / '+fmtMinutes(s.weeklyGoalMinutes)+' · '+pct+'%</span></div>'+
          '<div class="material-progress-track"><span class="material-progress-fill" style="width:'+pct+'%;background:'+c+'"></span></div></div>';
      }).join("") : '<p class="empty">No weekly goals set. Set one from a subject’s Settings tab.</p>')+
    '</div>';
    var focusItems = state.study.focus.filter(function(f){ return f.weekStart===weekStart; }).sort(function(a,b){ return a.order-b.order; });
    var focusHTML = '<div class="panel"><div class="panel-head"><h2>This week’s focus</h2><button type="button" class="cal-link-btn" data-study-add-focus>+ Add</button></div>'+
      (focusItems.length ? '<div class="stack" style="gap:8px">'+focusItems.map(function(f){
        return '<div class="chal-focus-row"><button type="button" class="chal-focus-check'+(f.completed?" done":"")+'" data-study-focus-toggle="'+f.id+'">'+(f.completed?CHECK_SVG:'')+'</button><span'+(f.completed?' style="text-decoration:line-through;opacity:.6"':'')+'>'+esc(f.title)+'</span><button type="button" class="btn-ghost" data-study-del-focus="'+f.id+'" title="Remove">✕</button></div>';
      }).join("")+'</div>' : '<p class="empty">Add 3–5 priorities for the week.</p>')+
    '</div>';
    return head + grid + '<div class="study-two-col" style="margin-top:16px">'+weeklyGoalsHTML+focusHTML+'</div>';
  }
