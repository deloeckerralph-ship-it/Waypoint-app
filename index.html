  .body-metric-row{ display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border-soft); cursor:pointer; }
  .body-metric-row:last-child{ border-bottom:none; }
  .body-metric-row:hover{ background:var(--surface-2); border-radius:9px; }
  .body-metric-row .bm-main{ flex:1; min-width:0; }
  .body-metric-row .bm-name{ font-size:.9rem; }
  .body-metric-row .bm-name svg{ width:12px; height:12px; margin-right:3px; vertical-align:-1px; flex:none; }
  .body-metric-row .bm-meta{ font-size:.76rem; color:var(--ink-faint); margin-top:2px; }
  .body-metric-row .bm-latest{ font-size:.86rem; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
  .body-cat-label{ font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); padding:16px 4px 6px; }
  .body-cat-label:first-child{ padding-top:2px; }
  .body-metric-detail{ background:var(--surface-2); border-radius:var(--radius); padding:16px 18px; margin:6px 0 16px; }
  .body-metric-detail .bmd-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .trend-chart{ width:100%; height:110px; display:block; }
  .trend-chart .tc-line{ fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .trend-chart .tc-range{ fill:var(--ink); opacity:.06; }
  .trend-chart-caption{ display:flex; justify-content:space-between; font-size:.72rem; color:var(--ink-faint); margin-top:4px; }

  /* ---- Body: Trends ---- */
  .body-trend-toolbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
  .body-metric-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .body-metric-chip{ font-size:.78rem; padding:.32rem .7rem; border-radius:20px; border:1px solid var(--border); background:var(--surface); color:var(--ink-faint); cursor:pointer; font-family:inherit; }
  .body-metric-chip.on{ background:var(--surface-2); color:var(--ink); border-color:var(--ink-faint); font-weight:600; }
  .range-toggle{ display:flex; gap:4px; margin-left:auto; }
  .range-toggle button{ font-size:.76rem; padding:.28rem .62rem; border-radius:7px; border:1px solid var(--border); background:var(--surface); color:var(--ink-faint); font-family:inherit; cursor:pointer; }
  .range-toggle button.on{ background:var(--surface-2); color:var(--ink); font-weight:700; }
  .body-trend-panel{ margin-bottom:14px; }
  .body-trend-panel .panel-head h2{ font-size:.98rem; }

  /* ---- Body: Compare ---- */
  .body-compare-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:700px){ .body-compare-grid{ grid-template-columns:1fr; } }
  .compare-stat-row{ display:flex; justify-content:space-between; font-size:.8rem; padding:4px 0; border-bottom:1px solid var(--border-soft); }
  .compare-stat-row:last-child{ border-bottom:none; }
  .compare-stat-row span:first-child{ color:var(--ink-faint); }

  /* ---- Body: Records ---- */
  .body-filter-bar{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .body-filter-bar .f{ min-width:150px; }
  .body-record-row .swatch{ width:9px; height:9px; border-radius:50%; flex:none; }
  .body-source-badge{ font-size:.68rem; padding:2px 7px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-faint); white-space:nowrap; }

  .direction-badge{ font-size:.68rem; color:var(--ink-faint); }

  /* ============ Auth screen, account menu, sync badge, migration offer (multi-user) ============ */
  .auth-screen{ position:fixed; inset:0; background:var(--bg); z-index:500; display:flex; align-items:center; justify-content:center; padding:24px; overflow-y:auto; }
  .auth-screen[hidden]{ display:none; }
  .auth-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:32px 30px; max-width:380px; width:100%; }
  .auth-brand{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .auth-brand .brand-mark{ width:34px; height:34px; border-radius:9px; background:var(--good); color:#FBF7EE; display:flex; align-items:center; justify-content:center; flex:none; }
  .auth-brand .brand-mark svg{ width:18px; height:18px; }
  .auth-brand h1{ font-family:'Fraunces',serif; font-size:1.3rem; margin:0; }
  .auth-card h2{ font-family:'Fraunces',serif; font-size:1.15rem; margin:0 0 6px; font-weight:600; }
  .auth-card > p.empty{ margin-bottom:16px; }
  .auth-error{ color:var(--bad); font-size:.82rem; margin:2px 0 0; }
  .auth-switch{ font-size:.84rem; color:var(--ink-faint); margin-top:20px; text-align:center; }
  .auth-link{ background:none; border:none; color:var(--ember); font-family:inherit; font-size:inherit; cursor:pointer; padding:0; text-decoration:underline; }
  .auth-icon svg{ width:30px; height:30px; color:var(--good); margin-bottom:10px; }
  .auth-forgot-row{ text-align:right; margin-top:-6px; }

  .account-wrap{ position:relative; flex:none; }
  .account-btn{ width:36px; height:36px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); color:var(--ink); font-family:'Fraunces',serif; font-weight:600; font-size:.9rem; cursor:pointer; }
  .account-menu{ position:absolute; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--border); border-radius:12px; box-shadow:0 8px 24px rgba(36,37,31,.14); padding:8px; min-width:230px; z-index:60; }
  .account-menu[hidden]{ display:none; }
  .account-menu .am-email{ font-size:.78rem; color:var(--ink-faint); padding:6px 10px 10px; border-bottom:1px solid var(--border-soft); margin-bottom:6px; word-break:break-all; }
  .account-menu .am-sync{ padding:0 10px 8px; }
  .account-menu button{ display:block; width:100%; text-align:left; background:none; border:none; padding:8px 10px; border-radius:8px; font-family:inherit; font-size:.85rem; cursor:pointer; color:var(--ink); }
  .account-menu button:hover{ background:var(--surface-2); }
  .account-menu button.danger{ color:var(--bad); }

  .sync-badge{ display:inline-flex; align-items:center; gap:6px; font-size:.72rem; color:var(--ink-faint); }
  .sync-badge[hidden]{ display:none; }
  .sync-badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex:none; }
  .sync-badge.synced .dot{ background:var(--good); }
  .sync-badge.syncing .dot{ animation:pulse-dot 1s infinite; }
  .sync-badge.error .dot, .sync-badge.offline .dot{ background:var(--bad); }
  @keyframes pulse-dot{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

  .migration-offer{ position:fixed; inset:0; background:rgba(36,37,31,.45); z-index:400; display:flex; align-items:center; justify-content:center; padding:24px; }
  .migration-offer[hidden]{ display:none; }
  .migration-offer .modal-card{ max-width:420px; }

  /* ============ TRAVEL (v23) ============ */
  .hint{ font-size:.78rem; color:var(--ink-faint); }
  .trv-mini-stats{ display:flex; gap:22px; flex-wrap:wrap; }
  .trv-mini-num{ font-family:'IBM Plex Mono',monospace; font-size:1.3rem; font-weight:600; color:var(--ink); line-height:1; }
  .trv-mini-label{ font-size:.72rem; color:var(--ink-faint); margin-top:4px; }

  .trv-map-wrap{ background:color-mix(in srgb, var(--ink) 7%, var(--surface-2)); border-radius:14px; padding:16px; overflow:hidden; }
  .trv-map-svg{ width:100%; height:auto; display:block; }
  .trv-map-grid{ stroke:var(--ink); stroke-width:.6; opacity:.06; }
  .trv-map-land{ fill:color-mix(in srgb, var(--teal) 32%, var(--surface)); stroke:color-mix(in srgb, var(--teal) 60%, var(--surface)); stroke-width:1.1; stroke-linejoin:round; }
  .trv-map-marker{ cursor:pointer; }
  .trv-map-marker circle{ transition:r .15s ease; filter:drop-shadow(0 1px 2px rgba(20,18,10,.35)); }
  .trv-map-marker:hover circle{ r:9; }
  .trv-map-legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; }
  .trv-legend-item{ display:inline-flex; align-items:center; gap:6px; font-size:.76rem; color:var(--ink-soft); }
  .trv-legend-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .trv-route-svg{ width:100%; height:auto; display:block; }

  .trv-photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(0,120px)); gap:10px; }
  .trv-photo-cell{ position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:var(--surface-2); }
  .trv-photo-cell img{ width:100%; height:100%; object-fit:cover; display:block; }
  .trv-photo-del{ position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%; border:none; background:rgba(10,9,6,.6); color:#fff; font-size:.9rem; line-height:1; cursor:pointer; }

  .note-textarea{ width:100%; font-family:inherit; font-size:.88rem; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface); color:var(--ink); resize:vertical; }
</style>
</head>
<body>

<div id="auth-screen" class="auth-screen" hidden></div>
<div id="migration-offer" class="migration-offer" hidden></div>
<div id="account-modal" class="migration-offer" hidden></div>

<div class="app" id="app-root" hidden>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5c2-1 5-1 8 1 3-2 6-2 8-1v13c-2-1-5-1-8 1-3-2-6-2-8-1Z"/><path d="M12 6.5v13"/></svg></div>
        <div class="brand-text">
          <h1>Waypoint</h1>
          <p class="tagline">A running record of habits, money, training, reading, and study.</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="sync-badge" id="sync-badge" hidden><span class="dot"></span><span id="sync-badge-text"></span></span>
        <div class="account-wrap" id="account-wrap" hidden>
          <button type="button" class="account-btn" id="account-btn" title="Account"><span id="account-btn-initial">?</span></button>
          <div class="account-menu" id="account-menu" hidden></div>
        </div>
        <div class="menu-wrap">
          <button type="button" class="menu-btn" id="menu-btn" aria-haspopup="true" aria-expanded="false" title="All pages">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="nav-menu" id="nav-menu" hidden></div>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </header>

  <main id="views"></main>

  <footer class="note">Everything you enter stays saved in this browser, on this device.</footer>
</div>

<button type="button" class="fab" id="fab" hidden title="Add">+</button>

<script>
(function(){
  "use strict";

  /* ============ storage ============ */
  var STORE_KEY = "waypoint:v1";

  function blankState(){
    return {
      habits: [],
      habitsNote: "",
      expenses: [],
      budgets: {},
      timeBlocks: [],
      dailyPlan: [],
      dayNotes: {},
      workouts: [],
      books: [],
      library: {
        categories: [
          { id:"books",    name:"Books",    color:"home-blue",   icon:"book",  isDefault:true, progressType:"pages",    order:0 },
          { id:"movies",   name:"Movies",   color:"ember",       icon:"film",  isDefault:true, progressType:"none",     order:1 },
          { id:"tv",       name:"TV Shows", color:"plum",        icon:"tv",    isDefault:true, progressType:"episodes", order:2 },
          { id:"music",    name:"Music",    color:"home-purple", icon:"disc",  isDefault:true, progressType:"tracks",   order:3 },
          { id:"podcasts", name:"Podcasts", color:"mustard",     icon:"mic",   isDefault:true, progressType:"episodes", order:4 },
          { id:"wine",     name:"Wine",     color:"rose",        icon:"wine",  isDefault:true, progressType:"none",     order:5 }
        ],
        items: [],
        activity: [],
        migratedBooksV1: false
      },
      study: {
        subjects: [
          { id: uid(), name: "Ophthalmology", color: "home-blue" },
          { id: uid(), name: "German", color: "mustard" },
          { id: uid(), name: "Finance", color: "ember" }
        ],
        materials: [],
        chapters: [],
        sessions: [],
        planned: [],
        focus: []
      },
      ironman: { raceName: "Ironman", raceDate: "", sessions: [] },
      challenges: {
        list: [],
        activities: [],
        planned: [],
        migratedIronmanV1: false,
        seededExamplesV1: false
      },
      body: {
        metrics: bodyBuiltinMetrics(),
        measurements: [],
        unitSystem: "metric"
      },
      homeMetricPrefs: ["running","training","reading","spending"],
      travel: { trips: [], places: [], tripPlaces: [], itinerary: [], photos: [] }
    };
  }

  /* ============ BODY: built-in metric catalog ============ */
  var BODY_SOURCES = ["manual","garmin","whoop","apple_health","health_connect","smart_scale","import","other"];
  var BODY_SOURCE_LABELS = { manual:"Manual", garmin:"Garmin", whoop:"WHOOP", apple_health:"Apple Health", health_connect:"Health Connect", smart_scale:"Smart scale", import:"Import", other:"Other" };
  var BODY_CATEGORY_LABELS = { "body-comp":"Body composition", vitals:"Vitals", sleep:"Sleep", performance:"Performance", custom:"Custom" };
  function bodyBuiltinMetrics(){
    return [
      { id:"weight", key:"weight", name:"Weight", unit:"kg", unitImperial:"lb", imperialFactor:2.20462, category:"body-comp", preferredDirection:"neutral", rangeLow:null, rangeHigh:null, isCustom:false, archived:false, pinned:true, order:0 },
      { id:"body-fat", key:"body-fat", name:"Body Fat %", unit:"%", unitImperial:null, imperialFactor:1, category:"body-comp", preferredDirection:"neutral", rangeLow:null, rangeHigh:null, isCustom:false, archived:false, pinned:false, order:1 },
      { id:"waist", key:"waist", name:"Waist Circumference", unit:"cm", unitImperial:"in", imperialFactor:0.393701, category:"body-comp", preferredDirection:"neutral", rangeLow:null, rangeHigh:null, isCustom:false, archived:false, pinned:false, order:2 },
      { id:"resting-hr", key:"resting-hr", name:"Resting Heart Rate", unit:"bpm", unitImperial:null, imperialFactor:1, category:"vitals", preferredDirection:"lower", rangeLow:null, rangeHigh:null, isCustom:false, archived:false, pinned:true, order:3 },
      { id:"hrv", key:"hrv", name:"HRV", unit:"ms", unitImperial:null, imperialFactor:1, category:"vitals", preferredDirection:"higher", rangeLow:null, rangeHigh:null, isCustom:false, archived:false, pinned:false, order:4 },
      { id:"bp-systolic", key:"bp-systolic", name:"Blood Pressure (Systolic)", unit:"mmHg", unitImperial:null, imperialFactor:1, category:"vitals", preferredDirection:"range", rangeLow:90, rangeHigh:120, isCustom:false, archived:false, pinned:false, order:5 },
      { id:"bp-diastolic", key:"bp-diastolic", name:"Blood Pressure (Diastolic)", unit:"mmHg", unitImperial:null, imperialFactor:1, category:"vitals", preferredDirection:"range", rangeLow:60, rangeHigh:80, isCustom:false, archived:false, pinned:false, order:6 },
      { id:"sleep-duration", key:"sleep-duration", name:"Sleep Duration", unit:"h", unitImperial:null, imperialFactor:1, category:"sleep", preferredDirection:"range", rangeLow:7, rangeHigh:9, isCustom:false, archived:false, pinned:false, order:7 },
      { id:"sleep-score", key:"sleep-score", name:"Sleep Score", unit:"score", unitImperial:null, imperialFactor:1, category:"sleep", preferredDirection:"higher", rangeLow:null, rangeHigh:null, isCustom:false, archived:false, pinned:false, order:8 },
      { id:"vo2max", key:"vo2max", name:"VO2 Max", unit:"ml/kg/min", unitImperial:null, imperialFactor:1, category:"performance", preferredDirection:"higher", rangeLow:null, rangeHigh:null, isCustom:false, archived:false, pinned:false, order:9 },
      { id:"steps", key:"steps", name:"Steps", unit:"steps", unitImperial:null, imperialFactor:1, category:"performance", preferredDirection:"higher", rangeLow:null, rangeHigh:null, isCustom:false, archived:false, pinned:false, order:10 }
    ];
  }
  function normalizeBodyMetric(m, idx){
    return {
      id: m.id || uid(),
      key: m.key || m.id || uid(),
      name: m.name || "Metric",
      unit: m.unit || "",
      unitImperial: m.unitImperial || null,
      imperialFactor: (typeof m.imperialFactor==="number" && m.imperialFactor>0) ? m.imperialFactor : 1,
      category: BODY_CATEGORY_LABELS[m.category] ? m.category : "custom",
      preferredDirection: ["higher","lower","range","neutral"].indexOf(m.preferredDirection)>-1 ? m.preferredDirection : "neutral",
      rangeLow: (typeof m.rangeLow==="number") ? m.rangeLow : null,
      rangeHigh: (typeof m.rangeHigh==="number") ? m.rangeHigh : null,
      isCustom: !!m.isCustom,
      archived: !!m.archived,
      pinned: !!m.pinned,
      order: (typeof m.order==="number") ? m.order : idx
    };
  }
  function normalizeBodyMeasurement(x){
    return {
      id: x.id || uid(),
      metricId: x.metricId || "",
      date: x.date || todayISO(),
      value: (typeof x.value==="number") ? x.value : (Number(x.value)||0),
      note: x.note || "",
      source: BODY_SOURCES.indexOf(x.source)>-1 ? x.source : "manual",
      externalRecordId: x.externalRecordId || null,
      externalSource: x.externalSource || null,
      syncedAt: x.syncedAt || null,
      createdAt: x.createdAt || todayISO()
    };
  }

  /* ============ TRAVEL: reference tables + data model (v23) ============
     Deliberately flattened, same principle as Library v11 (see docs): Trip/Place/TripPlace/
     ItineraryItem/TravelPhoto instead of the spec's fuller relational model. A Place is one
     record referenced everywhere (a trip's Places tab, the World Map, the Places list, Reviews,
     Photos, Recent activity) via the TripPlace join table — never duplicated. Reviews live
     directly on the Place record rather than a separate PlaceReview table (one review per place,
     edited in place). Daily travel-journal text reuses the existing state.dayNotes (already
     shared with Calendar) rather than a new per-trip notes table — only a trip-level free-text
     "notes" field is new. Trip status is computed from dates, not stored (see tripStatus()),
     so it can't drift out of sync with them; "archived" is the one manual override. */

  /* Place categories use the same colored-initial badge as Expenses' catIconHTML() rather than a
     bespoke pictogram per category — keeps this in the app's plain/editorial visual language
     instead of adding a pile of new icons (the spec explicitly rules out anything gamified or
     iconography-heavy). */
  var PLACE_CATEGORIES = [
    { id:"restaurant",   label:"Restaurant",   color:"var(--ember)" },
    { id:"hotel",        label:"Hotel",        color:"var(--steel)" },
    { id:"museum",       label:"Museum",       color:"var(--home-purple)" },
    { id:"monument",     label:"Monument",     color:"var(--gold)" },
    { id:"beach",        label:"Beach",        color:"var(--teal)" },
    { id:"hike",         label:"Hike",         color:"var(--good)" },
    { id:"cafe",         label:"Café",         color:"var(--mustard)" },
    { id:"bar",          label:"Bar",          color:"var(--plum)" },
    { id:"shop",         label:"Shop",         color:"var(--rose)" },
    { id:"neighborhood", label:"Neighborhood", color:"var(--home-blue)" },
    { id:"park",         label:"Park",         color:"var(--good)" },
    { id:"viewpoint",    label:"Viewpoint",    color:"var(--teal)" },
    { id:"temple",       label:"Temple",       color:"var(--gold)" },
    { id:"church",       label:"Church",       color:"var(--steel)" },
    { id:"architecture", label:"Architecture", color:"var(--home-purple)" },
    { id:"other",        label:"Other",        color:"var(--ink-faint)" }
  ];
  function placeCategoryById(id){
    var found = PLACE_CATEGORIES.filter(function(c){ return c.id===id; })[0];
    return found ? found.id : "other";
  }
  function placeCategoryMeta(id){ return PLACE_CATEGORIES.filter(function(c){ return c.id===id; })[0] || PLACE_CATEGORIES[PLACE_CATEGORIES.length-1]; }

  var ITINERARY_TYPES = [
    { id:"flight",      label:"Flight" },
    { id:"train",       label:"Train" },
    { id:"car",         label:"Car" },
    { id:"taxi",        label:"Taxi" },
    { id:"transport",   label:"Transport" },
    { id:"hotel-stay",  label:"Hotel stay" },
    { id:"restaurant",  label:"Restaurant" },
    { id:"cafe",        label:"Café" },
    { id:"activity",    label:"Activity" },
    { id:"museum",      label:"Museum" },
    { id:"sightseeing", label:"Sightseeing" },
    { id:"beach",       label:"Beach" },
    { id:"hike",        label:"Hike" },
    { id:"shopping",    label:"Shopping" },
    { id:"reservation", label:"Reservation" },
    { id:"free-time",   label:"Free time" },
    { id:"other",       label:"Other" }
  ];
  function itineraryTypeLabel(id){ var t=ITINERARY_TYPES.filter(function(x){ return x.id===id; })[0]; return t?t.label:"Other"; }

  var TRIP_STATUS_META = {
    planning:  { label:"Planning",  color:"var(--steel)" },
    upcoming:  { label:"Upcoming",  color:"var(--home-blue)" },
    ongoing:   { label:"Ongoing",   color:"var(--good)" },
    completed: { label:"Completed", color:"var(--ink-faint)" },
    archived:  { label:"Archived",  color:"var(--ink-faint)" }
  };
  function tripStatus(t){
    if(t.archived) return "archived";
    var today = todayISO();
    if(!t.startDate) return "planning";
    if(t.endDate && t.endDate<today) return "completed";
    if(t.startDate<=today && (!t.endDate || t.endDate>=today)) return "ongoing";
    if(t.startDate>today) return "upcoming";
    return "planning";
  }

  /* Static country-centroid table for World Map plotting — a disclosed approximation (country
     center, not a real city/place location), not a live geocoding API: this app has no mapping
     API key, and the spec explicitly forbids faking one. ~80 countries, [lat, lng, display name],
     enough coverage for a personal travel log; unmapped countries just don't plot a dot. */
  var COUNTRY_CENTROIDS = {
    AF:[33.9,67.7,"Afghanistan"], AL:[41.2,20.2,"Albania"], DZ:[28.0,1.7,"Algeria"], AR:[-38.4,-63.6,"Argentina"],
    AM:[40.1,45.0,"Armenia"], AU:[-25.3,133.8,"Australia"], AT:[47.5,14.6,"Austria"], AZ:[40.1,47.6,"Azerbaijan"],
    BE:[50.5,4.5,"Belgium"], BZ:[17.2,-88.5,"Belize"], BO:[-16.3,-63.6,"Bolivia"], BA:[43.9,17.7,"Bosnia and Herzegovina"],
    BR:[-14.2,-51.9,"Brazil"], BG:[42.7,25.5,"Bulgaria"], KH:[12.6,105.0,"Cambodia"], CA:[56.1,-106.3,"Canada"],

      .slice().sort(function(a,b){ return (a.dayIndex==null?999:a.dayIndex)-(b.dayIndex==null?999:b.dayIndex) || a.order-b.order; })

    var tripIds = state.travel.tripPlaces.filter(function(tp){ return tp.placeId===placeId; }).map(function(tp){ return tp.tripId; });

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      normalizeLoadedState(raw ? JSON.parse(raw) : null);
    }catch(e){ normalizeLoadedState(null); /* start fresh if storage is unavailable or corrupt */ }
  }
  function saveLocalOnly(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ /* ignore quota / privacy-mode errors */ }
  }
  /* Called with the row fetched from Supabase once a user is signed in — cloud is treated as
     the source of truth once it exists (see the v19 docs section on why: this app has one save
     point that always fires on every change, so a real multi-device edit conflict is rare; a
     full merge/diff UI was judged not worth the complexity for v1). */
  function applyCloudData(parsed){
    normalizeLoadedState(parsed);
    saveLocalOnly();
  }

  function normalizeChallenge(c){
    return {
      id: c.id || uid(),
      name: c.name || "",
      category: c.category || "custom",
      description: c.description || "",
      reason: c.reason || "",
      startDate: c.startDate || todayISO(),
      endDate: c.endDate || "",
      eventDate: c.eventDate || "",
      color: c.color || "",
      icon: c.icon || "",
      status: c.status || "active", // active | completed | archived
      progressType: c.progressType || "manual", // goal | session | day | milestone | manual
      goalTarget: (typeof c.goalTarget==="number") ? c.goalTarget : null,
      goalUnit: c.goalUnit || "",
      sessionsTarget: (typeof c.sessionsTarget==="number") ? c.sessionsTarget : null,
      dayTarget: (typeof c.dayTarget==="number") ? c.dayTarget : null,
      linkedHabitIds: Array.isArray(c.linkedHabitIds) ? c.linkedHabitIds : [],
      manualProgress: (typeof c.manualProgress==="number") ? c.manualProgress : 0,
      goals: Array.isArray(c.goals) ? c.goals.map(normalizeChallengeGoal) : [],
      milestones: Array.isArray(c.milestones) ? c.milestones.map(normalizeChallengeMilestone) : [],
      focus: Array.isArray(c.focus) ? c.focus.map(normalizeChallengeFocus) : [],
      notes: Object.assign({ general:"", weekly:"", event:"", lessons:"", gear:"", nutrition:"" }, c.notes||{}),
      completion: c.completion ? Object.assign({ finalRating:null, finalNote:"", learned:"", doAgain:"" }, c.completion) : null,
      completedDate: c.completedDate || "",
      createdAt: c.createdAt || todayISO(),
      updatedAt: c.updatedAt || c.createdAt || todayISO()
    };
  }
  function normalizeChallengeGoal(g){
    return {
      id: g.id || uid(),
      title: g.title || "",
      type: g.type || "custom", // distance|time|sessions|reps|days|pages|chapters|tasks|percentage|custom
      unit: g.unit || "",
      target: (typeof g.target==="number") ? g.target : null,
      period: g.period || "weekly", // daily|weekly|monthly|overall
      key: g.key || "", // freeform activity-type key this goal auto-sums from, e.g. "swim"
      progressType: g.progressType || "auto", // auto | manual
      manualValue: (typeof g.manualValue==="number") ? g.manualValue : 0,
      status: g.status || "in_progress", // not_started | in_progress | completed
      deadline: g.deadline || "",

  function wireAuthScreen(){
    var form = document.getElementById("auth-form");
    if(form) form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var email = document.getElementById("auth-email").value.trim();
      var pw = document.getElementById("auth-password").value;
      if(!email || !pw) return;
      if(authView==="signup") authSignUp(email, pw); else authSignIn(email, pw);
    });
    var forgotForm = document.getElementById("auth-forgot-form");
    if(forgotForm) forgotForm.addEventListener("submit", function(ev){
      ev.preventDefault();
      var email = document.getElementById("auth-forgot-email").value.trim();
      if(email) authForgotPassword(email);
    });
    var resetForm = document.getElementById("auth-reset-form");
    if(resetForm) resetForm.addEventListener("submit", function(ev){
      ev.preventDefault();
      var pw = document.getElementById("auth-reset-password").value;
      if(pw) authUpdatePassword(pw);
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-auth-switch]"), function(btn){
      btn.addEventListener("click", function(){ authView = btn.getAttribute("data-auth-switch"); authError=""; renderAuthScreen(); });
    });
    var forgotBtn = document.querySelector("[data-auth-forgot]");
    if(forgotBtn) forgotBtn.addEventListener("click", function(){ authView="forgot"; authError=""; renderAuthScreen(); });
    var backBtn = document.querySelector("[data-auth-back]");
    if(backBtn) backBtn.addEventListener("click", function(){ authView="signin"; authError=""; renderAuthScreen(); });
  }

  function authSignIn(email, pw){
    authLoading = true; authError = ""; renderAuthScreen();
    sb.auth.signInWithPassword({ email:email, password:pw }).then(function(res){
      authLoading = false;
      if(res.error){ authError = res.error.message; renderAuthScreen(); return; }
      // onAuthStateChange picks up SIGNED_IN from here and calls onAuthReady()
    }).catch(function(){ authLoading = false; authError = "Couldn't reach the server. Check your connection and try again."; renderAuthScreen(); });
  }
  function authSignUp(email, pw){
    authLoading = true; authError = ""; renderAuthScreen();
    sb.auth.signUp({ email:email, password:pw }).then(function(res){
      authLoading = false;
      if(res.error){ authError = res.error.message; renderAuthScreen(); return; }
      if(res.data && res.data.session){
        // email confirmation is off for this project — onAuthStateChange handles the rest
      } else {
        authView = "check-email";
        authMessage = "We sent a confirmation link to "+email+". Click it, then come back and sign in.";
        renderAuthScreen();
      }
    }).catch(function(){ authLoading = false; authError = "Couldn't reach the server. Check your connection and try again."; renderAuthScreen(); });
  }
  function authForgotPassword(email){
    authLoading = true; authError = ""; renderAuthScreen();
    sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname }).then(function(res){
      authLoading = false;
      if(res.error){ authError = res.error.message; renderAuthScreen(); return; }
      authView = "check-email";
      authMessage = "We sent a password reset link to "+email+".";
      renderAuthScreen();
    }).catch(function(){ authLoading = false; authError = "Couldn't reach the server. Check your connection and try again."; renderAuthScreen(); });
  }
  function authUpdatePassword(pw){
    authLoading = true; authError = ""; renderAuthScreen();
    sb.auth.updateUser({ password: pw }).then(function(res){
      authLoading = false;
      if(res.error){ authError = res.error.message; renderAuthScreen(); return; }
      authView = "signin"; authError = "";
      // a successful recovery link click already leaves the user signed in; onAuthStateChange
      // fired SIGNED_IN for it earlier, so onAuthReady() has already run — just close the screen.
      hideAuthScreen();
    }).catch(function(){ authLoading = false; authError = "Couldn't reach the server. Check your connection and try again."; renderAuthScreen(); });
  }
  function authSignOut(){
    if(!sb) return;
    sb.auth.signOut().then(function(){
      // clear the local cache on sign-out — this may be a shared/public device
      try{ localStorage.removeItem(STORE_KEY); }catch(e){}
      currentUser = null;
      // dozens of transient nav-state vars (bodyPage, libraryPage, chalPage, ...) live at module
      // scope — a full reload is the simplest reliable way to reset every one of them at once.
      location.reload();
    });
  }

  /* ---- boot sequence ---- */
  function onAuthReady(user){
    currentUser = { id:user.id, email:user.email };
    hideAuthScreen();
    var appRoot = document.getElementById("app-root");
    if(appRoot) appRoot.hidden = false;
    renderAccountArea();
    renderTabs(); renderViews(); // paint immediately from whatever's already in localStorage — don't block on the network
    fetchAntwerpWeather();

    if(!sb) return;
    cloudSyncStatus = "syncing"; renderSyncBadge();
    sb.from("waypoint_state").select("data").eq("user_id", user.id).maybeSingle().then(function(res){
      if(res.error){
        cloudSyncStatus = "error"; renderSyncBadge();
        return;
      }
      if(res.data && res.data.data && Object.keys(res.data.data).length){
        applyCloudData(res.data.data);
        cloudSyncStatus = "synced"; renderSyncBadge();
        renderTabs(); renderViews();
      } else if(hasMeaningfulLocalData()){
        cloudSyncStatus = "idle"; renderSyncBadge();
        showMigrationOffer();
      } else {
        pushCloudSync();
      }
    }).catch(function(){
      cloudSyncStatus = "error"; renderSyncBadge();
    });
  }
  function initAuth(){
    if(!sb){
      // Supabase's client script didn't load (offline install, blocked CDN, etc.) — fail open
      // into local-only mode rather than stranding the user behind a broken login screen.
      var appRoot = document.getElementById("app-root");
      if(appRoot) appRoot.hidden = false;
      renderTabs(); renderViews();
      return;
    }
    sb.auth.onAuthStateChange(function(event, session){
      if(event==="PASSWORD_RECOVERY"){
        authView = "reset-password"; authError = "";
        showAuthScreen();
        return;
      }
      if(event==="SIGNED_IN" && session && session.user && (!currentUser || currentUser.id!==session.user.id)){
        onAuthReady(session.user);
      }
      if(event==="SIGNED_OUT"){
        currentUser = null;
        showAuthScreen();
      }
    });
    sb.auth.getSession().then(function(res){
      var session = res.data && res.data.session;
      if(session && session.user) onAuthReady(session.user);
      else showAuthScreen();
    }).catch(function(){ showAuthScreen(); });
  }

  /* ============ date helpers ============ */
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function toISO(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function todayISO(){ return toISO(new Date()); }
  function parseISO(iso){ var p=iso.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
  function addDays(iso, n){ var d=parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function fmtShort(iso){
    if(!iso) return "—";
    var d = parseISO(iso);
    return d.toLocaleDateString(undefined,{ month:"short", day:"numeric" });
  }
  function daysAgoLabel(iso){
    var diff = Math.round((parseISO(todayISO()) - parseISO(iso)) / 86400000);
    if(diff===0) return "today";
    if(diff===1) return "yesterday";
    if(diff>1) return diff+"d ago";
    return fmtShort(iso);
  }
  function startOfWeekISO(iso){
    var d = parseISO(iso);
    var wd = (d.getDay()+6)%7; // Monday=0
    d.setDate(d.getDate()-wd);
    return toISO(d);
  }
  function inSameWeek(iso, refISO){
    return startOfWeekISO(iso) === startOfWeekISO(refISO);
  }
  function inSameMonth(iso, refISO){
    return iso.slice(0,7) === refISO.slice(0,7);
  }
  function last7Days(){
    var out=[]; for(var i=6;i>=0;i--) out.push(addDays(todayISO(),-i)); return out;
  }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function money(n){ return "€"+(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }

  /* small inline sparkline (metric cards) — normalized 0-100 viewBox, own min/max scale */
  function sparklineSVG(values, colorVar){
    var vals = values.filter(function(v){ return typeof v==="number" && !isNaN(v); });
    if(vals.length<2) return '<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none"></svg>';
    var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
    var range = (max-min) || 1;
    var w=100, h=28, pad=2;
    var pts = vals.map(function(v,i){
      var x = pad + i*(w-2*pad)/(vals.length-1);
      var y = h-pad - (v-min)/range*(h-2*pad);
      return x.toFixed(1)+","+y.toFixed(1);
    });
    return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
      '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+colorVar+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
      '</svg>';

  /* larger labeled trend chart (metric detail / Trends / Compare) — takes {date,value} points already
     sorted ascending by date; optionally shades a preferred range band (rangeLow/rangeHigh, metric units) */
  function trendChartSVG(points, colorVar, rangeLow, rangeHigh){
    if(points.length<2){
      return '<svg class="trend-chart" viewBox="0 0 600 110" preserveAspectRatio="none"></svg><p class="empty" style="margin-top:6px">Not enough readings yet for a chart — add a few more.</p>';
    }
    var vals = points.map(function(p){ return p.value; });
    var min = Math.min.apply(null,vals), max = Math.max.apply(null,vals);
    if(typeof rangeLow==="number") min = Math.min(min, rangeLow);
    if(typeof rangeHigh==="number") max = Math.max(max, rangeHigh);
    var range = (max-min) || 1;
    var w=600, h=110, padX=6, padY=10;
    function xAt(i){ return padX + i*(w-2*padX)/(points.length-1); }
    function yAt(v){ return h-padY - (v-min)/range*(h-2*padY); }
    var pts = points.map(function(p,i){ return xAt(i).toFixed(1)+","+yAt(p.value).toFixed(1); });
    var band = "";
    if(typeof rangeLow==="number" && typeof rangeHigh==="number"){
      band = '<rect class="tc-range" x="'+padX+'" y="'+yAt(rangeHigh).toFixed(1)+'" width="'+(w-2*padX)+'" height="'+(yAt(rangeLow)-yAt(rangeHigh)).toFixed(1)+'"></rect>';
    }
    return '<svg class="trend-chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
      band+
      '<polyline class="tc-line" points="'+pts.join(" ")+'" stroke="'+colorVar+'"/>'+
      '</svg>'+
      '<div class="trend-chart-caption"><span>'+fmtShort(points[0].date)+'</span><span>'+fmtShort(points[points.length-1].date)+'</span></div>';

  /* ---- Barcode scan: free public lookups, no API key, no cost ----
     Only Books and Music have a natural free public barcode->metadata source, so those two are
     wired to a live lookup. Every other built-in category (Movies/TV/Podcasts/Wine) and any custom
     category the user adds later has no entry in LOOKUP_PROVIDERS — scanLookup() falls through to
     a generic "matched:false" result for those, which still carries the raw scanned code so it's
     saved on the item (metadataSource:"barcode") rather than discarded. Wiring up a real source for
     one of those categories later is a matter of adding one more entry here; nothing else about the
     scan flow needs to change. Disclosed to the user: the two live sources below are believed
     correct from current public documentation but this sandbox has no camera and cannot reach
     openlibrary.org/musicbrainz.org directly to exercise them end-to-end — worth a real test on a
     phone once deployed. */
  function fetchJSON(url){
    return fetch(url).then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  }
  function isbnLikely(code){ return /^97[89]\d{10}$/.test(code) || /^\d{9}[\dXx]$/.test(code); }
  function lookupOpenLibrary(code){
    return fetchJSON("https://openlibrary.org/api/books?bibkeys=ISBN:"+encodeURIComponent(code)+"&format=json&jscmd=data")
      .then(function(data){
        var rec = data && data["ISBN:"+code];
        if(!rec || !rec.title) return null;
        var authors = (rec.authors||[]).map(function(a){ return a.name; }).filter(Boolean).join(", ");
        var publishers = (rec.publishers||[]).map(function(p){ return p.name; }).filter(Boolean).join(", ");
        var yearMatch = (rec.publish_date||"").match(/\d{4}/);
        var cover = rec.cover ? (rec.cover.large||rec.cover.medium||rec.cover.small||"") : "";
        return {
          title: rec.title, creator: authors, year: yearMatch?yearMatch[0]:"",
          publisher: publishers, coverImage: cover,
          progressTotal: (typeof rec.number_of_pages==="number") ? rec.number_of_pages : null,
          isbn: code
        };
      });
  }
  function lookupMusicBrainz(code){
    return fetchJSON("https://musicbrainz.org/ws/2/release/?query=barcode:"+encodeURIComponent(code)+"&fmt=json")
      .then(function(data){
        var rel = data && (data.releases||[])[0];
        if(!rel || !rel.title) return null;
        var artist = (rel["artist-credit"]||[]).map(function(c){ return c.name; }).filter(Boolean).join(", ");
        var yearMatch = (rel.date||"").match(/\d{4}/);
        var media = (rel.media||[])[0];
        return {
          title: rel.title, creator: artist, year: yearMatch?yearMatch[0]:"",
          tracks: (media && typeof media["track-count"]==="number") ? media["track-count"] : null,
          physicalFormat: (media && media.format) ? media.format : "",
          coverImage: rel.id ? ("https://coverartarchive.org/release/"+rel.id+"/front-250") : ""
        };
      });
  }
  var LOOKUP_PROVIDERS = {
    books: { source:"openlibrary", label:"Open Library", lookup:lookupOpenLibrary },
    music: { source:"musicbrainz", label:"MusicBrainz",  lookup:lookupMusicBrainz }
  };
  /* Resolves to { matched, code, source, fields? }. Never rejects — a network/parse failure is
     reported as an unmatched result (with errored:true) rather than throwing, so the calling UI
     code never needs its own try/catch. */
  function scanLookup(catId, code){
    var provider = LOOKUP_PROVIDERS[catId];
    if(!provider) return Promise.resolve({ matched:false, code:code, source:"barcode" });
    return provider.lookup(code).then(function(fields){
      if(!fields) return { matched:false, code:code, source:"barcode" };
      return { matched:true, code:code, source:provider.source, fields:fields };
    }).catch(function(){ return { matched:false, code:code, source:"barcode", errored:true }; });
  }

  /* Applies a matched lookup/search result's fields onto the currently-open Add/Edit Item form via
     direct DOM patches (never renderViews() — same reasoning as everywhere else in this modal: it
     must survive without wiping anything else the user already typed). Shared by both the barcode
     scan flow and the v22 title-search flow below, since both resolve to the same field shape. */
  function applyLibraryFieldsToForm(f, catId){
    f = f || {};
    var setVal = function(id,val){ var el=document.getElementById(id); if(el && val!=null && val!=="") el.value=val; };
    setVal("lib-title", f.title); setVal("lib-creator", f.creator); setVal("lib-year", f.year);
    if(f.publisher) setVal("lib-publisher", f.publisher);
    if(f.isbn) setVal("lib-isbn", f.isbn);
    if(typeof f.progressTotal==="number") setVal("lib-total-pages", f.progressTotal);
    if(typeof f.tracks==="number") setVal("lib-tracks", f.tracks);
    if(f.physicalFormat) setVal("lib-format", f.physicalFormat);
    if(f.genre){
      if(catId==="movies") setVal("lib-genre-movies", f.genre);
      else if(catId==="tv") setVal("lib-genre-tv", f.genre);
    }
    if(typeof f.runtime==="number") setVal("lib-runtime", f.runtime);
    if(f.coverImage){
      libraryPendingCoverImage = f.coverImage;
      var prev = document.getElementById("lib-cover-preview"), ph = document.getElementById("lib-cover-placeholder");
      if(prev){ prev.src=f.coverImage; prev.style.display="block"; }
      if(ph) ph.style.display="none";
    }
  }

  /* ---- Title search (v22): type a title/name, pick from real candidate results ----
     Same "free, no API key" constraint as the barcode lookups above. Books and Music reuse their
     existing barcode sources' own search-by-text endpoints (Open Library and MusicBrainz both
     support search-by-title, not just search-by-code). Movies and TV have no free source among the
     barcode providers, so both are wired to Apple's iTunes Search API instead — free, no key/signup,
     documented at https://performance-partners.apple.com/search-api, rate-limited to roughly 20
     calls/minute per Apple's own guidance (fine for one person typing). Any category not listed here
     (Podcasts, Wine, any custom category) has no live search source — same disclosed gap as the
     barcode scanner's LOOKUP_PROVIDERS, and for the same reason: no solid free public database
     exists for those categories today. Each provider's search() resolves to an array of
     { title, subtitle, coverImage, sourceId, fields } — fields is the exact same shape
     applyLibraryFieldsToForm() already expects from a matched barcode scan. */
  function searchOpenLibrary(q){
    return fetchJSON("https://openlibrary.org/search.json?q="+encodeURIComponent(q)+"&limit=8&fields=key,title,author_name,first_publish_year,cover_i,isbn,publisher,number_of_pages_median")
      .then(function(data){
        return (data.docs||[]).filter(function(d){ return d.title; }).map(function(d){
          var authors = (d.author_name||[]).join(", ");
          var cover = d.cover_i ? ("https://covers.openlibrary.org/b/id/"+d.cover_i+"-M.jpg") : "";
          return {
            title: d.title, subtitle: [authors, d.first_publish_year].filter(Boolean).join(" · "), coverImage: cover,
            sourceId: d.key || "",
            fields: {
              title: d.title, creator: authors, year: d.first_publish_year ? String(d.first_publish_year) : "",
              publisher: (d.publisher||[])[0] || "", isbn: (d.isbn||[])[0] || "",
              progressTotal: (typeof d.number_of_pages_median==="number") ? d.number_of_pages_median : null,
              coverImage: cover
            }
          };
        });
      });
  }
  function searchMusicBrainz(q){
    return fetchJSON("https://musicbrainz.org/ws/2/release/?query="+encodeURIComponent(q)+"&fmt=json&limit=8")
      .then(function(data){
        return (data.releases||[]).filter(function(rel){ return rel.title; }).map(function(rel){
          var artist = (rel["artist-credit"]||[]).map(function(c){ return c.name; }).filter(Boolean).join(", ");
          var yearMatch = (rel.date||"").match(/\d{4}/);
          var media = (rel.media||[])[0];
          var cover = rel.id ? ("https://coverartarchive.org/release/"+rel.id+"/front-250") : "";
          return {
            title: rel.title, subtitle: [artist, yearMatch?yearMatch[0]:""].filter(Boolean).join(" · "), coverImage: cover,
            sourceId: rel.id || "",
            fields: {
              title: rel.title, creator: artist, year: yearMatch?yearMatch[0]:"",
              tracks: (media && typeof media["track-count"]==="number") ? media["track-count"] : null,
              physicalFormat: (media && media.format) ? media.format : "",
              coverImage: cover
            }
          };
        });
      });
  }
  function searchITunes(q, mediaType){
    return fetchJSON("https://itunes.apple.com/search?term="+encodeURIComponent(q)+"&media="+mediaType+"&limit=8")
      .then(function(data){
        return (data.results||[]).filter(function(r){ return r.trackName||r.collectionName; }).map(function(r){
          var name = r.trackName || r.collectionName || "";
          var yearMatch = (r.releaseDate||"").match(/\d{4}/);
          var runtimeMin = r.trackTimeMillis ? Math.round(r.trackTimeMillis/60000) : null;
          var subtitleParts = [r.primaryGenreName, yearMatch?yearMatch[0]:""];
          if(mediaType==="movie" && runtimeMin) subtitleParts.push(runtimeMin+" min");
          var cover = r.artworkUrl100 ? r.artworkUrl100.replace("100x100bb","300x300bb") : "";
          return {
            title: name, subtitle: subtitleParts.filter(Boolean).join(" · "), coverImage: cover,
            sourceId: r.trackId ? String(r.trackId) : "",
            fields: {
              title: name, creator: r.artistName || "", year: yearMatch?yearMatch[0]:"",
              genre: r.primaryGenreName || "", runtime: mediaType==="movie" ? runtimeMin : null,
              coverImage: cover
            }
          };
        });
      });
  }
  var SEARCH_PROVIDERS = {
    books:  { source:"openlibrary", label:"Open Library", search: searchOpenLibrary },
    music:  { source:"musicbrainz", label:"MusicBrainz",  search: searchMusicBrainz },
    movies: { source:"itunes",      label:"iTunes",       search: function(q){ return searchITunes(q,"movie"); } },
    tv:     { source:"itunes",      label:"iTunes",       search: function(q){ return searchITunes(q,"tvShow"); } }
  };

  /* ---- Barcode scan: camera + decode engine ----
     Driven entirely from wireView (direct DOM patches + explicit renderViews() calls only at real
     state transitions), never from the render functions — see the libScan* state comment above for
     why. Two decode paths: the native BarcodeDetector API (Chrome/Edge/Android, no library needed)
     run through our own requestAnimationFrame loop, or — for browsers without it, notably Safari/
     iOS as of this build — a lazily-loaded ZXing fallback (its own continuous-decode loop, we just
     hand it the video element and a callback). Manual code entry is always offered alongside the
     camera regardless of which path is used, so the feature never fully depends on either working. */
  function stopScanCamera(){
    libScanRunToken++; // invalidates any in-flight getUserMedia/detect callback still resolving
    if(libScanRAFId){ cancelAnimationFrame(libScanRAFId); libScanRAFId=null; }
    if(libScanZXingReader){ try{ libScanZXingReader.stop(); }catch(e){} libScanZXingReader=null; }
    if(libScanStream){
      libScanStream.getTracks().forEach(function(t){ try{ t.stop(); }catch(e){} });
      libScanStream=null;
    }
  }
  function onBarcodeDetected(code){
    stopScanCamera();
    libScanStatus="looking-up";
    renderScanModal();
    var catRow = document.getElementById("lib-form-cat-row");
    var catId = catRow ? catRow.getAttribute("data-selected") : "books";
    scanLookup(catId, code).then(function(result){
      libScanResult = result;
      libScanStatus = result.matched ? "found" : "nomatch";
      renderScanModal();
    });
  }
  function scanDetectLoopNative(video){
    var myToken = libScanRunToken;
    function tick(){
      if(myToken!==libScanRunToken) return; // stopped/superseded — stop looping silently
      if(video.readyState < 2){ libScanRAFId=requestAnimationFrame(tick); return; }
      if(!libScanDetector){
        try{ libScanDetector = new window.BarcodeDetector({ formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39"] }); }
        catch(e){ libScanDetector=null; }
      }
      if(!libScanDetector){ libScanRAFId=requestAnimationFrame(tick); return; }
      libScanDetector.detect(video).then(function(codes){
        if(myToken!==libScanRunToken) return;
        if(codes && codes[0] && codes[0].rawValue){ onBarcodeDetected(codes[0].rawValue); return; }
        libScanRAFId=requestAnimationFrame(tick);
      }).catch(function(){
        if(myToken!==libScanRunToken) return;
        libScanRAFId=requestAnimationFrame(tick);
      });
    }
    tick();
  }
  var libScanZXingLoadPromise = null;
  function ensureZXingLoaded(){
    if(window.ZXingBrowser && window.ZXingBrowser.BrowserMultiFormatReader) return Promise.resolve();
    if(libScanZXingLoadPromise) return libScanZXingLoadPromise;
    libScanZXingLoadPromise = new Promise(function(resolve, reject){
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@zxing/browser@0/umd/index.min.js";
      s.onload = function(){
        if(window.ZXingBrowser && window.ZXingBrowser.BrowserMultiFormatReader) resolve();
        else reject(new Error("ZXing loaded but BrowserMultiFormatReader not found"));
      };
      s.onerror = function(){ reject(new Error("Failed to load barcode-scanning library")); };
      document.head.appendChild(s);
    });
    return libScanZXingLoadPromise;
  }
  function startScanCameraZXing(video){
    var myToken = libScanRunToken;
    ensureZXingLoaded().then(function(){
      if(myToken!==libScanRunToken) return;
      var reader = new window.ZXingBrowser.BrowserMultiFormatReader();
      reader.decodeFromVideoDevice(undefined, video, function(result){
        if(myToken!==libScanRunToken) return;
        if(result && result.getText) onBarcodeDetected(result.getText());
      }).then(function(controls){
        if(myToken!==libScanRunToken){ try{ controls.stop(); }catch(e){} return; }
        libScanZXingReader = controls;
        libScanStatus="scanning";
        var statusEl = document.getElementById("scan-status-text");
        if(statusEl) statusEl.textContent = "Point your camera at the barcode…";
      }).catch(function(err){
        if(myToken!==libScanRunToken) return;
        libScanStatus="error";
        libScanErrorMsg = (err && err.name==="NotAllowedError") ? "Camera access was denied. Enter the code by hand below instead." : "Couldn't start the camera. Enter the code by hand below instead.";
        renderScanModal();
      });
    }).catch(function(){
      if(myToken!==libScanRunToken) return;
      libScanStatus="error";
      libScanErrorMsg = "This browser can't scan a barcode automatically. Enter the code by hand below instead.";
      renderScanModal();
    });
  }
  function startScanCamera(){
    if(libScanStatus!=="idle") return; // caller signals "please start" by leaving status at idle
    libScanStatus="starting";
    var myToken = ++libScanRunToken;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      libScanStatus="error";
      libScanErrorMsg = "Camera not available in this browser. Enter the code by hand below instead.";
      renderScanModal(); return;
    }
    var video = document.getElementById("scan-video");
    if(!video) return; // modal not in the DOM (shouldn't happen, defensive)
    if(!window.BarcodeDetector){
      // Safari/iOS path: let ZXing manage its own camera request, don't also call getUserMedia here.
      startScanCameraZXing(video);
      return;
    }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } }).then(function(stream){
      if(myToken!==libScanRunToken){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
      libScanStream = stream;
      var v = document.getElementById("scan-video");
      if(!v){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
      v.srcObject = stream;
      v.play().catch(function(){});
      libScanStatus = "scanning";
      var statusEl = document.getElementById("scan-status-text");
      if(statusEl) statusEl.textContent = "Point your camera at the barcode…";
      scanDetectLoopNative(v);
    }).catch(function(err){
      if(myToken!==libScanRunToken) return;
      libScanStatus="error";
      libScanErrorMsg = (err && err.name==="NotAllowedError") ? "Camera access was denied. Enter the code by hand below instead." : "Couldn't start the camera. Enter the code by hand below instead.";
      renderScanModal();
    });
  }
  function resetScanState(){
    stopScanCamera();
    libScanStatus="idle"; libScanErrorMsg=""; libScanResult=null; libScanManualCode="";
  }
  /* Switches the Add item form's active category pill via direct DOM patches (no renderViews() —
     same reasoning as the scan modal above: this form must survive an in-progress edit untouched).
     Used both by the pill row's own click handler and by the scan "Use this" flow when a matched
     result implies a different category than whatever was selected when scanning started. */
  function switchLibFormCategory(newCat){
    var row = document.getElementById("lib-form-cat-row");
    if(!row) return;
    Array.prototype.forEach.call(row.querySelectorAll(".subject-pill"), function(x){
      var active = x.getAttribute("data-lib-form-category")===newCat;
      x.classList.toggle("active", active);
      x.style.background = active ? libraryCategoryColorVar(newCat) : "";
    });
    row.setAttribute("data-selected", newCat);
    Array.prototype.forEach.call(document.querySelectorAll("[data-lib-catfields]"), function(block){
      block.style.display = block.getAttribute("data-lib-catfields")===newCat ? "contents" : "none";
    });
    var statusSel = document.getElementById("lib-status");
    if(statusSel) Array.prototype.forEach.call(statusSel.options, function(opt){
      opt.textContent = libraryStatusLabel(newCat, opt.value);
    });
    var searchBtn = document.getElementById("lib-search-btn");
    if(searchBtn) searchBtn.style.display = SEARCH_PROVIDERS[newCat] ? "flex" : "none";
  }
  /* ---- Barcode scan: modal lifecycle, deliberately OUTSIDE the normal render pipeline ----
     The Add item modal lives inside RENDERERS[tab]()'s big HTML string, rebuilt from `vals` (a
     snapshot taken when it opened) on every renderViews() call. If the scan overlay were part of
     that same string, closing/advancing it would call renderViews() and silently wipe out anything
     already typed into the Add item form (including fields the scan itself just filled in — caught
     via a failing test before this was fixed). So instead this overlay is appended directly to
     <body> (same precedent as #auth-screen/#migration-offer/#account-modal) and redrawn by
     replacing only its own subtree — renderViews() is never called while it's open. */
  function renderScanModal(){
    var existing = document.querySelector("[data-scan-modal-backdrop]");
    if(existing) existing.remove();
    if(!libraryShowScan) return;
    document.body.insertAdjacentHTML("beforeend", scanBarcodeModalHTML());
    wireScanModal();
  }
  function closeScanModal(){
    libraryShowScan=false; resetScanState(); renderScanModal();
  }
  function wireScanModal(){
    var backdrop = document.querySelector("[data-scan-modal-backdrop]");
    if(!backdrop) return;
    backdrop.addEventListener("click", function(ev){ if(ev.target===backdrop) closeScanModal(); });
    var cancelBtn = backdrop.querySelector("[data-scan-cancel]");
    if(cancelBtn) cancelBtn.addEventListener("click", closeScanModal);
    var againBtn = backdrop.querySelector("[data-scan-again]");
    if(againBtn) againBtn.addEventListener("click", function(){ resetScanState(); renderScanModal(); });
    var manualBtn = backdrop.querySelector("#scan-manual-submit");
    var manualInput = backdrop.querySelector("#scan-manual-input");
    function submitManual(){
      var code = manualInput ? manualInput.value.trim() : "";
      if(!code) return;
      libScanManualCode = code;
      onBarcodeDetected(code);
    }
    if(manualBtn) manualBtn.addEventListener("click", submitManual);
    if(manualInput){
      // Keep libScanManualCode in sync on every keystroke (not just at submit) — a re-render can
      // land mid-typing (camera/ZXing init resolving asynchronously in the background) and the input
      // is rebuilt from this state, so without this the re-render would silently erase whatever the
      // user had already typed.
      manualInput.addEventListener("input", function(){ libScanManualCode = manualInput.value; });
      manualInput.addEventListener("keydown", function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); submitManual(); } });
    }
    var useBtn = backdrop.querySelector("[data-scan-use]");
    if(useBtn) useBtn.addEventListener("click", function(){
      var r = libScanResult || {};
      libraryPendingScanSource = r.source || "barcode";
      libraryPendingScanCode = r.code || "";
      if(r.matched){
        var f = r.fields||{};
        var catRow = document.getElementById("lib-form-cat-row");
        var curCat = catRow ? catRow.getAttribute("data-selected") : null;
        var wantCat = LOOKUP_PROVIDERS[curCat] ? curCat : (isbnLikely(r.code) ? "books" : curCat);
        if(wantCat && wantCat!==curCat) switchLibFormCategory(wantCat);
        applyLibraryFieldsToForm(f, wantCat);
      } else if(isbnLikely(r.code)){
        var catRow2 = document.getElementById("lib-form-cat-row");
        if(catRow2 && catRow2.getAttribute("data-selected")!=="books") switchLibFormCategory("books");
        var isbnEl = document.getElementById("lib-isbn");
        if(isbnEl) isbnEl.value = r.code;
      }
      libraryShowScan=false; resetScanState(); renderScanModal();
    });
    if(libraryShowScan && libScanStatus==="idle") startScanCamera();
  }

  /* ---- Title search (v22): modal lifecycle, same "outside the render pipeline" rule as the scan
     modal above, and for the same reason — it opens over an in-progress Add item form and must
     never trigger renderViews(). The one extra wrinkle here versus the scan modal: results arrive
     from a debounced, as-you-type search, so a naive "just call renderSearchModal() again" on every
     result would rebuild the whole modal — including the text input — and steal focus/cursor
     position out from under whoever's still typing. So only the initial open/close redraws the full
     modal; a new batch of results patches just the status line + results list via direct DOM
     surgery (updateSearchResultsOnly()), leaving the input element itself untouched. */
  function resetSearchState(){
    clearTimeout(libSearchDebounceTimer); libSearchDebounceTimer = null;
    libSearchRunToken++; // invalidate any in-flight search
    libSearchQuery = ""; libSearchStatus = "idle"; libSearchResults = [];
  }
  function searchStatusLine(){
    if(libSearchStatus==="searching") return "Searching…";
    if(libSearchStatus==="error") return "Couldn't reach the search source — try again, or enter details by hand.";
    if(libSearchStatus==="empty") return "No matches for \""+esc(libSearchQuery)+"\". Try a different spelling, or enter details by hand.";
    return "";
  }
  function searchResultRowHTML(r, idx){
    return '<button type="button" class="search-result-row" data-search-pick="'+idx+'">'+
      '<span class="search-result-cover">'+(r.coverImage?'<img src="'+esc(r.coverImage)+'" alt="" loading="lazy">':TAG_SVG)+'</span>'+
      '<span class="search-result-text">'+
        '<span class="search-result-title">'+esc(r.title)+'</span>'+
        (r.subtitle?'<span class="search-result-sub">'+esc(r.subtitle)+'</span>':'')+
      '</span>'+
    '</button>';
  }
  function searchResultsHTML(){
    return libSearchResults.map(searchResultRowHTML).join("");
  }
  function librarySearchModalHTML(){
    var catRow = document.getElementById("lib-form-cat-row");
    var catId = catRow ? catRow.getAttribute("data-selected") : "books";
    var provider = SEARCH_PROVIDERS[catId];
    var cat = libraryCategoryById(catId);
    var catLabel = cat ? cat.name : capitalize(catId);
    var body;
    if(!provider){
      body = '<p class="plan-empty">No search source for '+esc(catLabel)+' yet — you can still fill this in by hand.</p>';
    } else {
      body = '<input type="text" id="search-query-input" placeholder="Title, artist, or name…" value="'+esc(libSearchQuery)+'" autocomplete="off">'+
        '<div class="scan-status-line" id="search-status-text">'+searchStatusLine()+'</div>'+
        '<div class="search-result-list" id="search-result-list">'+searchResultsHTML()+'</div>';
    }
    return '<div class="modal-backdrop" data-search-modal-backdrop>'+
      '<div class="modal-card">'+
        '<h2>Search '+esc(catLabel)+'</h2>'+
        body+
        '<div class="modal-actions"><button type="button" class="btn-ghost" data-search-cancel>Cancel</button></div>'+
      '</div>'+
    '</div>';
  }
  function closeSearchModal(){
    libraryShowSearch = false;
    resetSearchState();
    renderSearchModal();
  }
  function runLibrarySearch(catId, q){
    var provider = SEARCH_PROVIDERS[catId];
    if(!provider) return;
    var myToken = ++libSearchRunToken;
    libSearchStatus = "searching";
    updateSearchResultsOnly();
    provider.search(q).then(function(results){
      if(myToken!==libSearchRunToken) return; // superseded by newer typing — drop this stale result
      libSearchResults = results;
      libSearchStatus = results.length ? "results" : "empty";
      updateSearchResultsOnly();
    }).catch(function(){
      if(myToken!==libSearchRunToken) return;
      libSearchResults = [];
      libSearchStatus = "error";
      updateSearchResultsOnly();
    });
  }
  function wireSearchResultRows(container){
    Array.prototype.forEach.call(container.querySelectorAll("[data-search-pick]"), function(btn){
      btn.addEventListener("click", function(){
        var idx = Number(btn.getAttribute("data-search-pick"));
        var r = libSearchResults[idx];
        if(!r) return;
        var catRow = document.getElementById("lib-form-cat-row");
        var catId = catRow ? catRow.getAttribute("data-selected") : null;
        applyLibraryFieldsToForm(r.fields, catId);
        var provider = SEARCH_PROVIDERS[catId];
        libraryPendingScanSource = provider ? provider.source : null;
        libraryPendingScanCode = r.sourceId || "";
        closeSearchModal();
      });
    });
  }
  function updateSearchResultsOnly(){
    var statusEl = document.getElementById("search-status-text");
    if(statusEl) statusEl.textContent = searchStatusLine();
    var listEl = document.getElementById("search-result-list");
    if(listEl){
      listEl.innerHTML = searchResultsHTML();
      wireSearchResultRows(listEl);
    }
  }
  function renderSearchModal(){
    var existing = document.querySelector("[data-search-modal-backdrop]");
    if(existing) existing.remove();
    if(!libraryShowSearch) return;
    document.body.insertAdjacentHTML("beforeend", librarySearchModalHTML());
    wireSearchModal();
  }
  function wireSearchModal(){
    var backdrop = document.querySelector("[data-search-modal-backdrop]");
    if(!backdrop) return;
    backdrop.addEventListener("click", function(ev){ if(ev.target===backdrop) closeSearchModal(); });
    var cancelBtn = backdrop.querySelector("[data-search-cancel]");
    if(cancelBtn) cancelBtn.addEventListener("click", closeSearchModal);
    var input = backdrop.querySelector("#search-query-input");
    if(input){
      var catRow = document.getElementById("lib-form-cat-row");
      var catId = catRow ? catRow.getAttribute("data-selected") : null;
      input.addEventListener("input", function(){
        // Live-synced on every keystroke, same lesson as the barcode manual-entry field — nothing
        // here re-renders the input itself, but keeping libSearchQuery current avoids the same class
        // of bug if anything else ever reads it before a debounced search fires.
        libSearchQuery = input.value;
        clearTimeout(libSearchDebounceTimer);
        var q = libSearchQuery.trim();
        if(!q){
          libSearchRunToken++; // drop any in-flight search — an empty box shouldn't show stale results
          libSearchStatus = "idle"; libSearchResults = [];
          updateSearchResultsOnly();
          return;
        }
        libSearchDebounceTimer = setTimeout(function(){ runLibrarySearch(catId, q); }, 400);
      });
      input.focus();
    }
    wireSearchResultRows(backdrop);
  }

  /* All activity for one item, oldest first, kept for pace/history calculations. */
  function libraryItemProgressEntries(itemId){
    return state.library.activity.filter(function(a){ return a.itemId===itemId && a.progressAfter!=null; })
      .slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  }
  function libraryAllActivityForItem(itemId){
    return state.library.activity.filter(function(a){ return a.itemId===itemId; })
      .slice().reverse().sort(byDateDesc); // reverse first so same-day ties show newest-added on top
  }
  /* Short human-readable summary of one activity entry, generalized across every category's
     progress type (pages/percentage/episodes/tracks/none) rather than assuming books' "p.N". */
  function libraryActivityMeta(a, item){
    var meta = item ? categoryMeta(item.categoryId) : DEFAULT_CATEGORY_META;
    var delta = (a.progressBefore!=null && a.progressAfter!=null) ? (a.progressAfter-a.progressBefore) : null;
    switch(a.type){
      case "started": return "Started";
      case "finished": return "Finished";
      case "paused": return "Paused";
      case "resumed": return "Resumed";
      case "acquired": return "Added to collection";
      case "rated": return a.rating!=null ? "Rated "+a.rating+"/10" : "Rated";
      case "status": return a.value ? libraryStatusLabel(item?item.categoryId:null, a.value) : "Status updated";
      case "progress":
        if(a.progressAfter==null) return a.value ? esc(a.value) : "Progress update";
        if(meta.progressType==="pages") return "p."+a.progressAfter+(delta>0?" (+"+delta+")":"");
        if(meta.progressType==="percentage") return a.progressAfter+"%"+(delta>0?" (+"+delta+")":"");
        if(meta.progressType==="episodes") return "Ep "+a.progressAfter+(delta>0?" (+"+delta+")":"");
        if(meta.progressType==="tracks") return "Track "+a.progressAfter+(delta>0?" (+"+delta+")":"");
        return a.value ? esc(a.value) : "Progress update";
      case "note": return a.notes ? (a.notes.length>60 ? esc(a.notes.slice(0,60))+"…" : esc(a.notes)) : "Note added";
      default: return a.value ? esc(a.value) : "";
    }
  }
  var WALLET_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="16.2" cy="14.5" r="1.2" fill="currentColor" stroke="none"/></svg>';
  var CHECKCIRCLE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>';

  /* Icons are looked up by tab id inside a function (not baked into the TABS array itself) so
     this can sit anywhere in the file regardless of where TABS is declared — see the JS-ordering
     note in the project doc about var object literals vs. function declarations. */
  function tabIconSvg(id){
    switch(id){
      case "home": return HOUSE_SVG;
      case "today": return SUN_SVG;
      case "calendar": return CALENDAR_SVG;
      case "habits": return CHECKCIRCLE_SVG;
