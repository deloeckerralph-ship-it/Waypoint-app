<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waypoint</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
  :root{
    --ink:#24251F;
    --ink-soft:#5B5D4C;
    --ink-faint:#8C8B76;
    --ground:#F5F0E7;
    --surface:#EFE7D8;
    --surface-2:#E9DFCB;
    --border:#E1D5BE;
    --border-soft:#EAE0CB;

    --ember:#B8532F;
    --ember-ink:#6E2E17;
    --gold:#59614A;
    --gold-ink:#333A28;
    --plum:#8B4A2B;
    --plum-ink:#4A2413;
    --steel:#8A7B5B;
    --steel-ink:#463D2C;
    --teal:#3E4A32;
    --teal-ink:#1E2417;
    --rose:#A67C3D;
    --rose-ink:#523D1D;

    --mustard:#B8860B;
    --mustard-ink:#5C4408;

    --home-blue:#315F87;
    --home-blue-ink:#1C3A54;
    --home-purple:#6B4BAE;
    --home-purple-ink:#3E2A66;
    --home-teal:#21766C;
    --home-teal-ink:#123F3A;

    --chart-blue:#2F6FE0;
    --chart-ember:#E0492A;
    --chart-mustard:#E6A817;
    --chart-gold:#D9A233;
    --chart-plum:#9C3FA0;
    --chart-steel:#4A5FBF;
    --chart-purple:#7C3FE0;
    --chart-teal:#0E9488;
    --chart-rose:#D93B6C;

    --good:#59614A;
    --warn:#A67C3D;
    --bad:#96371F;

    --shadow: 0 1px 2px rgba(36,37,31,.05);
    --radius: 16px;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F1EAD9;
      --ink-soft:#C9BFA9;
      --ink-faint:#8F8672;
      --ground:#1C1A15;
      --surface:#242019;
      --surface-2:#2C2619;
      --border:#3A3225;
      --border-soft:#332C21;

      --ember:#E38052;
      --ember-ink:#FBDFCF;
      --gold:#8CA073;
      --gold-ink:#E4EEDA;
      --plum:#C97C4F;
      --plum-ink:#F4DDCB;
      --steel:#C7B190;
      --steel-ink:#F1E7D8;
      --teal:#6E8A5C;
      --teal-ink:#DCE6D4;
      --rose:#D9A94E;
      --rose-ink:#F7E8C9;

      --mustard:#E0AA3E;
      --mustard-ink:#3D2E0C;

      --home-blue:#6FA3D1;
      --home-blue-ink:#DCEAF5;
      --home-purple:#A98FE0;
      --home-purple-ink:#EBE2F9;
      --home-teal:#4FA89C;
      --home-teal-ink:#D8EFEB;

      --chart-blue:#5B9AFF;
      --chart-ember:#FF7A52;
      --chart-mustard:#FFC93C;
      --chart-gold:#F2C15C;
      --chart-plum:#D77FDB;
      --chart-steel:#8B9BFF;
      --chart-purple:#B08CFF;
      --chart-teal:#3FD9C7;
      --chart-rose:#FF7FA8;

      --good:#8CA073;
      --warn:#D9A94E;
      --bad:#E2694A;

      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F1EAD9;
    --ink-soft:#C9BFA9;
    --ink-faint:#8F8672;
    --ground:#1C1A15;
    --surface:#242019;
    --surface-2:#2C2619;
    --border:#3A3225;
    --border-soft:#332C21;

    --ember:#E38052;
    --ember-ink:#FBDFCF;
    --gold:#8CA073;
    --gold-ink:#E4EEDA;
    --plum:#C97C4F;
    --plum-ink:#F4DDCB;
    --steel:#C7B190;
    --steel-ink:#F1E7D8;
    --teal:#6E8A5C;
    --teal-ink:#DCE6D4;
    --rose:#D9A94E;
    --rose-ink:#F7E8C9;

    --mustard:#E0AA3E;
    --mustard-ink:#3D2E0C;

    --home-blue:#6FA3D1;
    --home-blue-ink:#DCEAF5;
    --home-purple:#A98FE0;
    --home-purple-ink:#EBE2F9;
    --home-teal:#4FA89C;
    --home-teal-ink:#D8EFEB;

    --chart-blue:#5B9AFF;
    --chart-ember:#FF7A52;
    --chart-mustard:#FFC93C;
    --chart-gold:#F2C15C;
    --chart-plum:#D77FDB;
    --chart-steel:#8B9BFF;
    --chart-purple:#B08CFF;
    --chart-teal:#3FD9C7;
    --chart-rose:#FF7FA8;

    --good:#8CA073;
    --warn:#D9A94E;
    --bad:#E2694A;

    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:'Libre Franklin', system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  h1,h2,h3{
    font-family:'Fraunces', Georgia, serif;
    font-weight:600;
    text-wrap:balance;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums; }

  button{ font-family:inherit; }
  input,select,textarea{
    font-family:inherit;
    font-size:.92rem;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:.55rem .65rem;
  }
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
    outline:2px solid var(--ember);
    outline-offset:1px;
  }
  /* Hide the native up/down spinner on number inputs (amount, duration, page-count fields, etc.)
     — like the native date/time popup, it's browser chrome with no theme access, so instead of
     trying to reskin it we just remove it; typing and arrow-key stepping both still work. */
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }
  button{ cursor:pointer; }

  .app{ max-width:1180px; margin:0 auto; padding:0 20px 96px; }
  footer.note{ padding-bottom:70px; }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; flex-direction:column; gap:18px;
    padding:28px 0 18px;
  }
  .topbar-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:44px; height:44px; border-radius:12px;
    background:var(--good);
    display:flex; align-items:center; justify-content:center;
    font-size:1.3rem; flex:none; color:#FBF7EE;
  }
  .brand-mark svg{ width:24px; height:24px; }
  .brand h1{ font-size:1.5rem; letter-spacing:.01em; }
  .brand .tagline{ margin:2px 0 0; font-size:.82rem; color:var(--ink-faint); }

  .menu-wrap{ position:relative; flex:none; }
  .menu-btn{
    width:42px; height:42px; border-radius:12px;
    background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .menu-btn svg{ width:18px; height:18px; }
  .nav-menu{
    position:absolute; top:calc(100% + 8px); right:0; min-width:190px;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:6px; box-shadow:0 10px 26px -10px rgba(36,37,31,.32); z-index:20;
  }
  .nav-menu[hidden]{ display:none; }
  .nav-menu button.menu-item{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:9px 11px; border-radius:8px;
    font-size:.86rem; color:var(--ink); background:transparent; border:none; font-family:inherit;
  }
  .nav-menu button.menu-item:hover{ background:var(--surface-2); }
  .nav-menu button.menu-item.active{ color:var(--ember); font-weight:700; }

  .tabs{
    display:flex; gap:20px; overflow-x:auto; padding-bottom:2px;
    scrollbar-width:thin;
    border-bottom:1px solid var(--border);
  }
  .tab-btn{
    appearance:none; border:none; background:transparent;
    padding:8px 1px 12px;
    font-size:.92rem; font-weight:500; color:var(--ink-faint);
    border-bottom:2px solid transparent;
    white-space:nowrap;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn[aria-selected="true"]{
    color:var(--ember); font-weight:700;
    border-bottom-color:var(--ember);
  }
  .tab-icon{ width:15px; height:15px; flex:none; display:inline-flex; opacity:.8; }
  .tab-icon svg{ width:100%; height:100%; display:block; }
  .tab-btn[aria-selected="true"] .tab-icon, .menu-item.active .tab-icon{ opacity:1; }

  .view{ padding-top:22px; display:flex; flex-direction:column; gap:24px; }
  .view[hidden]{ display:none; }

  /* ---------- Hero stat (borderless) ---------- */
  .hero-stat{ display:flex; align-items:flex-end; justify-content:space-between; gap:18px; flex-wrap:wrap; padding:4px 2px 8px; }
  .hero-label{ font-size:.76rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .hero-num{ font-family:'IBM Plex Mono',monospace; font-size:2.6rem; font-weight:600; color:var(--ember); margin-top:4px; line-height:1; }
  .hero-sub{ font-size:.8rem; color:var(--ink-soft); margin-top:6px; }
  .hero-spark{ flex:none; }
  .hero-spark .day-bars{ height:60px; gap:9px; }
  .hero-spark .day-bars .stem{ width:5px; max-width:5px; border-radius:3px; }
  .hero-spark .day-bars .lbl{ font-size:.62rem; }

  /* ---------- Stat tiles ---------- */
  .stat-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
  }
  .stat-tile{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px;
    border-left:3px solid var(--accent);
  }
  .stat-tile .label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .stat-tile .value{ font-family:'IBM Plex Mono', monospace; font-size:1.55rem; font-weight:600; margin-top:6px; font-variant-numeric:tabular-nums; }
  .stat-tile .sub{ font-size:.76rem; color:var(--ink-soft); margin-top:2px; }

  /* ---------- Cards / panels ---------- */
  .panel{
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:20px 22px;
  }
  .panel-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .panel-head h2{ font-size:1.05rem; }
  .panel-head .hint{ font-size:.78rem; color:var(--ink-faint); }

  .grid-2{ display:grid; grid-template-columns:minmax(260px,340px) 1fr; gap:20px; align-items:start; }
  @media (max-width:760px){ .grid-2{ grid-template-columns:1fr; } }
  .home-split{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  @media (max-width:760px){ .home-split{ grid-template-columns:1fr; } }
  .stack-col{ display:flex; flex-direction:column; gap:20px; }

  form.stack{ display:flex; flex-direction:column; gap:10px; }
  .field-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .field-row > *{ flex:1 1 120px; }
  .f{ display:flex; flex-direction:column; gap:4px; font-size:.78rem; color:var(--ink-soft); font-weight:600; }

  .btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink);
    border-radius:10px; padding:.55rem .9rem; font-size:.85rem; font-weight:600;
  }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn-primary{
    background:var(--accent, var(--ember)); border-color:transparent; color:#fff;
    border-radius:12px; padding:.7rem .9rem;
  }
  .btn-primary:hover{ filter:brightness(1.07); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-faint); padding:.3rem .5rem; }
  .btn-ghost:hover{ color:var(--bad); }

  /* ---------- Add-block: full-bleed colored "add" moment ---------- */
  .add-block{ background:var(--accent); border:none; color:#fff; }
  .add-block .panel-head h2{ color:#fff; }
  .add-block .panel-head .hint{ color:rgba(255,255,255,.72); }
  .add-block label.f{ color:rgba(255,255,255,.82); }
  .add-block input, .add-block select, .add-block textarea{
    background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.28); color:#fff;
    color-scheme: dark;
  }
  .add-block input::placeholder{ color:rgba(255,255,255,.55); }
  .add-block input:focus-visible, .add-block select:focus-visible{ outline-color:#fff; }
  .add-block .btn-primary{ background:var(--surface); color:var(--accent); }
  .add-block .btn-primary:hover{ filter:none; background:#fff; }
  .add-block .btn-ghost{ color:rgba(255,255,255,.65); }
  .add-block .btn-ghost:hover{ color:#fff; }

  /* ---------- Category rows with icon squares ---------- */
  .cat-row{ display:flex; align-items:center; gap:12px; padding:9px 0; }
  .cat-row + .cat-row{ border-top:1px solid var(--border-soft); }
  .cat-icon{
    width:34px; height:34px; border-radius:9px; flex:none;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:.85rem;
  }
  .cat-icon svg{ width:17px; height:17px; }
  .cat-label{ width:88px; flex:none; font-size:.85rem; font-weight:600; }
  .cat-track{ flex:1; height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .cat-fill{ display:block; height:100%; border-radius:5px; }
  .cat-amt{ font-family:'IBM Plex Mono',monospace; font-size:.85rem; font-weight:600; width:68px; text-align:right; flex:none; }
  .cat-pct{ font-size:.74rem; color:var(--ink-faint); width:34px; text-align:right; flex:none; }
  @media (max-width:480px){ .cat-label{ width:64px; font-size:.78rem; } .cat-pct{ display:none; } }

  /* ---------- Expenses: month nav + pie chart + budget planner ---------- */
  .month-nav{ display:flex; align-items:center; gap:6px; }
  .month-nav .range{ font-size:.8rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; min-width:118px; text-align:center; }
  .cat-pie-row{ display:grid; grid-template-columns:auto 1fr; gap:24px; align-items:center; }
  @media (max-width:560px){ .cat-pie-row{ grid-template-columns:1fr; justify-items:center; } }
  .cat-pie-wrap{ flex:none; }
  .cat-pie-list{ min-width:0; width:100%; }
  .cat-pie-empty{ color:var(--ink-faint); font-size:.85rem; }

  .budget-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px; }
  .budget-copy-row{ margin-bottom:14px; }
  .budget-row{ padding:12px 0; }
  .budget-row + .budget-row{ border-top:1px solid var(--border-soft); }
  .budget-row-top{ display:flex; align-items:center; gap:12px; }
  .budget-cat-label{ flex:1; min-width:0; font-size:.87rem; font-weight:600; }
  .budget-input-wrap{
    flex:none; display:flex; align-items:center; gap:4px;
    font-family:'IBM Plex Mono',monospace; font-size:.85rem; color:var(--ink-soft);
  }
  .budget-input{ width:76px; text-align:right; padding:.35rem .5rem; font-size:.85rem; }
  .budget-bar-track{ height:7px; border-radius:5px; background:var(--surface-2); overflow:hidden; margin-top:10px; }
  .budget-bar-fill{ display:block; height:100%; border-radius:5px; transition:width .2s ease; }
  .budget-row-sub{ font-size:.76rem; color:var(--ink-faint); margin-top:5px; }
  .budget-row-sub.over{ color:var(--bad); font-weight:600; }

  /* ---------- Floating add button ---------- */
  .fab{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    width:56px; height:56px; border-radius:50%; background:var(--ember); color:#fff;
    border:none; font-size:1.7rem; line-height:1; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 24px -6px rgba(36,37,31,.45); z-index:30;
  }
  .fab[hidden]{ display:none; }
  .fab:hover{ filter:brightness(1.06); }

  /* ---------- Lists / rows ---------- */
  .rows{ display:flex; flex-direction:column; }
  .row{
    display:flex; align-items:center; gap:12px;
    padding:10px 0; border-bottom:1px solid var(--border-soft);
  }
  .row:last-child{ border-bottom:none; }
  .row .swatch{ width:8px; align-self:stretch; border-radius:3px; background:var(--accent); flex:none; }
  .row .main{ flex:1; min-width:0; }
  .row .title{ font-weight:600; font-size:.9rem; }
  .row .meta{ font-size:.76rem; color:var(--ink-faint); margin-top:1px; }
  .row .amount{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:.92rem; white-space:nowrap; }
  .empty{ color:var(--ink-faint); font-size:.85rem; padding:14px 0; }

  .chip{
    display:inline-flex; align-items:center; gap:5px;
    font-size:.72rem; font-weight:600; padding:2px 8px; border-radius:99px;
    background:color-mix(in srgb, var(--accent) 16%, transparent);
    color:var(--accent);
  }

  /* ---------- Habits ---------- */
  .habits-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .habits-head h2{ font-size:1.4rem; }
  .habits-head p{ margin:5px 0 0; font-size:.86rem; color:var(--ink-faint); }

  .habit-sum-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; margin-bottom:20px; }
  .habit-sum-card{
    display:flex; align-items:center; gap:14px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:14px 16px;
    border-left:3px solid var(--accent);
  }
  .habit-sum-viz{ flex:none; width:44px; height:44px; display:flex; align-items:center; justify-content:center; }
  .habit-sum-viz svg{ width:100%; height:100%; }
  .habit-sum-viz .flame{ width:28px; height:28px; }
  .habit-sum-text{ flex:1; min-width:0; }
  .habit-sum-label{ font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .habit-sum-value{ font-family:'IBM Plex Mono',monospace; font-size:1.4rem; font-weight:600; margin-top:3px; line-height:1; }
  .habit-sum-sub{ font-size:.73rem; color:var(--ink-soft); margin-top:3px; }
  .sum-spark .day-bars{ height:38px; gap:3px; }
  .sum-spark .day-bars .stem{ width:70%; border-radius:2px; }
  .sum-spark .day-bars .lbl{ display:none; }

  .week-nav{ display:flex; align-items:center; gap:6px; }
  .week-nav .range{ font-size:.8rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; min-width:150px; text-align:center; }
  .week-table-wrap{ overflow-x:auto; }
  table.week-table{ border-collapse:collapse; width:100%; min-width:520px; }
  table.week-table th, table.week-table td{ padding:8px 6px; text-align:center; }
  table.week-table thead th{ font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; }
  table.week-table thead th .dnum{ display:block; font-size:.9rem; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); margin-top:2px; font-weight:600; }
  table.week-table thead th.is-today{ color:var(--mustard); }
  table.week-table thead th.is-today .dnum{ color:var(--mustard); }
  table.week-table tbody tr{ border-top:1px solid var(--border-soft); }
  table.week-table td.wt-name{ text-align:left; font-weight:600; font-size:.87rem; white-space:nowrap; padding-right:14px; }
  table.week-table td.wt-name .wt-sub{ display:block; font-weight:500; font-size:.72rem; color:var(--ink-faint); margin-top:1px; }

  .day-score-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .day-score-tile{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:10px 4px 12px; border-radius:12px; background:var(--surface-2);
  }
  .day-score-tile.is-today{ outline:2px solid var(--mustard); outline-offset:-2px; }
  .day-score-tile .dsl{ font-size:.66rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:600; }
  .day-score-tile .dsd{ font-size:.72rem; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin-top:-3px; }
  .day-score-tile .dsv{
    font-family:'IBM Plex Mono',monospace; font-size:1.1rem; font-weight:700; color:var(--ink);
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-top:2px;
  }
  @media (max-width:560px){
    .day-score-row{ grid-template-columns:repeat(4,1fr); }
  }
  .day-box{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface-2); display:inline-flex; align-items:center; justify-content:center;
    color:var(--ink-faint); position:relative; padding:0;
  }
  .day-box svg{ width:15px; height:15px; opacity:0; }
  .day-box.done{ background:var(--good); border-color:var(--good); }
  .day-box.done svg{ opacity:1; stroke:#fff; }
  .day-box.future{ opacity:.4; cursor:default; }
  .day-box:not(.future):hover{ border-color:var(--mustard); }

  .habits-list-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .habit-row{
    display:flex; align-items:center; gap:10px; padding:11px 0;
    border-bottom:1px solid var(--border-soft);
  }
  .habit-row:last-child{ border-bottom:none; }
  .habit-row.archived{ opacity:.6; }
  .drag-handle{ flex:none; cursor:grab; color:var(--ink-faint); background:transparent; border:none; padding:2px; touch-action:none; }
  .drag-handle:active{ cursor:grabbing; }
  .habit-row-main{ flex:1; min-width:0; }
  .habit-row-name{ font-weight:600; font-size:.9rem; }
  .habit-row-meta{ font-size:.74rem; color:var(--ink-faint); margin-top:2px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .streak-badge{ display:inline-flex; align-items:center; gap:3px; font-weight:600; }
  .streak-badge svg{ width:13px; height:13px; }
  .streak-badge.hot{ color:var(--mustard); }
  .habit-menu-wrap{ position:relative; flex:none; }
  .row-menu-btn{ background:transparent; border:none; color:var(--ink-faint); font-size:1.1rem; padding:4px 8px; border-radius:8px; line-height:1; }
  .row-menu-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .row-menu{
    position:absolute; right:0; top:calc(100% + 4px); z-index:20;
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    box-shadow:0 8px 24px -8px rgba(36,37,31,.35); padding:5px; min-width:150px;
  }
  .row-menu[hidden]{ display:none; }
  .row-menu button{
    display:block; width:100%; text-align:left; background:transparent; border:none;
    padding:8px 10px; border-radius:8px; font-size:.83rem; color:var(--ink);
  }
  .row-menu button:hover{ background:var(--surface-2); }
  .row-menu button.danger{ color:var(--bad); }
  .show-archived-toggle{
    background:transparent; border:none; color:var(--ink-faint); font-size:.8rem; font-weight:600;
    padding:10px 0 2px; text-align:left; width:100%;
  }
  .show-archived-toggle:hover{ color:var(--ink); }

  .heatmap-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .heatmap-head select{ font-size:.78rem; padding:.35rem .5rem; }
  .heatmap-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .heat-weekday{ font-size:.62rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); font-weight:600; text-align:center; padding-bottom:3px; }
  .heat-cell{ aspect-ratio:1/1; border-radius:4px; background:var(--surface-2); }
  .heat-cell.pad{ background:transparent; }
  .heatmap-legend{ display:flex; align-items:center; gap:5px; margin-top:10px; font-size:.68rem; color:var(--ink-faint); }
  .heatmap-legend .heat-cell{ width:11px; height:11px; aspect-ratio:auto; }

  .insight-row{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; }
  .insight-row:not(:last-child){ border-bottom:1px solid var(--border-soft); }
  .insight-dot{ flex:none; width:8px; height:8px; border-radius:50%; margin-top:5px; background:var(--accent); }
  .insight-row p{ margin:0; font-size:.83rem; line-height:1.4; color:var(--ink-soft); }

  #habits-notes{ width:100%; min-height:90px; resize:vertical; font-size:.87rem; line-height:1.5; }
  .notes-save-row{ display:flex; justify-content:flex-end; margin-top:8px; }

  /* ---------- Bars ---------- */
  .bar-list{ display:flex; flex-direction:column; gap:9px; }
  .bar-row{ display:grid; grid-template-columns:96px 1fr auto; align-items:center; gap:10px; font-size:.8rem; }
  .bar-track{ background:var(--surface-2); border-radius:5px; height:9px; overflow:hidden; }
  .bar-fill{ display:block; height:100%; border-radius:5px; background:var(--accent); }
  .bar-val{ font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--ink-soft); white-space:nowrap; }

  /* ---------- Ironman ---------- */
  .countdown{
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  }
  .countdown .num{ font-family:'Fraunces',serif; font-size:3rem; font-weight:600; line-height:1; color:var(--teal); }
  .countdown .num-wrap{ display:flex; flex-direction:column; gap:2px; }
  .countdown .num-label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; }
  .race-edit{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-left:auto; }

  .disc-tag{ font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:5px; }
  .disc-swim{ background:color-mix(in srgb, var(--steel) 18%, transparent); color:var(--steel); }
  .disc-bike{ background:color-mix(in srgb, var(--gold) 18%, transparent); color:var(--gold); }
  .disc-run{ background:color-mix(in srgb, var(--ember) 18%, transparent); color:var(--ember); }
  .disc-brick{ background:color-mix(in srgb, var(--plum) 18%, transparent); color:var(--plum); }
  .disc-strength{ background:color-mix(in srgb, var(--ink-faint) 22%, transparent); color:var(--ink-soft); }

  /* ---------- day-by-day bar charts ---------- */
  .day-bars{ display:flex; gap:6px; align-items:stretch; height:84px; }
  .day-bars .bar{ flex:1; display:flex; flex-direction:column; align-items:center; height:100%; gap:5px; }
  .day-bars .stem-wrap{ flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; }
  .day-bars .stem{ width:60%; max-width:26px; border-radius:5px 5px 2px 2px; min-height:3px; }
  .day-bars .lbl{ font-size:.66rem; color:var(--ink-faint); font-weight:600; flex:none; }

  /* ---------- Reading: books ---------- */
  .book-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .book-card{
    display:flex; gap:12px; padding:14px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius);
  }
  .book-cover{ width:64px; height:96px; flex:none; border-radius:5px; overflow:hidden; box-shadow:0 2px 8px rgba(36,37,31,.28); }
  .book-cover svg{ display:block; width:100%; height:100%; }
  .book-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; }
  .book-title{ font-weight:600; font-size:.87rem; line-height:1.28; }
  .book-author{ font-size:.73rem; color:var(--ink-faint); margin-top:1px; }
  .status-pill{
    font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    padding:2px 7px; border-radius:99px; align-self:flex-start;
  }
  .status-reading{ background:color-mix(in srgb, var(--steel) 18%, transparent); color:var(--steel); }
  .status-finished{ background:color-mix(in srgb, var(--good) 18%, transparent); color:var(--good); }
  .book-progress-row{ display:flex; align-items:center; gap:9px; }
  .ring-wrap{ position:relative; width:38px; height:38px; flex:none; }
  .ring-wrap svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-wrap .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:.6rem; font-weight:700; font-family:'IBM Plex Mono',monospace;
  }
  .book-pages{ font-family:'IBM Plex Mono',monospace; font-size:.75rem; color:var(--ink-soft); }
  .book-update{ display:flex; gap:6px; margin-top:2px; }
  .book-update input{ width:64px; padding:.35rem .5rem; font-size:.76rem; }
  .book-update button{ padding:.35rem .55rem; font-size:.74rem; }

  /* ---------- Library ---------- */
  .lib-head-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between; margin-bottom:14px; }
  .lib-head-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .lib-search{ padding:.45rem .7rem; font-size:.82rem; width:200px; max-width:100%; }
  .lib-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .lib-card{
    display:flex; flex-direction:column; gap:8px; padding:10px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; position:relative;
  }
  .lib-cover{
    width:100%; aspect-ratio:2/3; border-radius:6px; overflow:hidden; position:relative;
    box-shadow:0 2px 8px rgba(36,37,31,.28); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center;
  }
  .lib-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .lib-cover .cover-icon{ width:40%; height:40%; }
  .lib-fav-badge{ position:absolute; top:6px; right:6px; width:22px; height:22px; border-radius:50%; background:rgba(10,9,6,.5); display:flex; align-items:center; justify-content:center; color:#fff; }
  .lib-fav-badge svg{ width:13px; height:13px; }
  .lib-card-title{ font-weight:600; font-size:.84rem; line-height:1.28; }
  .lib-card-creator{ font-size:.72rem; color:var(--ink-faint); margin-top:-4px; }
  .lib-card-meta-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; margin-top:auto; }
  .lib-rating-mini{ font-size:.72rem; font-weight:700; color:var(--ink-soft); display:flex; align-items:center; gap:3px; }
  .lib-rating-mini svg{ width:11px; height:11px; }
  .lib-empty{ padding:28px 10px; text-align:center; color:var(--ink-faint); font-size:.85rem; }

  .lib-hscroll{ display:flex; gap:12px; overflow-x:auto; padding:2px 2px 8px; }
  .lib-hcard{
    flex:none; width:130px; display:flex; flex-direction:column; gap:6px; cursor:pointer;
  }
  .lib-hcard .lib-cover{ width:130px; }
  .lib-hcard-title{ font-size:.78rem; font-weight:600; line-height:1.25; }
  .lib-hcard-sub{ font-size:.7rem; color:var(--ink-faint); }

  .lib-cat-icon-badge{ display:flex; align-items:center; justify-content:center; border-radius:6px; color:#fff; }
  .lib-cat-icon-badge svg{ width:44%; height:44%; }

  .lib-detail-head{ display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; }
  .lib-detail-cover{ width:150px; flex:none; }
  .lib-detail-cover .lib-cover{ width:150px; aspect-ratio:2/3; }
  .lib-detail-info{ flex:1; min-width:220px; display:flex; flex-direction:column; gap:8px; }
  .lib-detail-title{ font-size:1.3rem; font-weight:700; line-height:1.2; }
  .lib-detail-creator{ font-size:.9rem; color:var(--ink-faint); }
  .lib-detail-meta-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .lib-fav-toggle{ background:transparent; border:1px solid var(--border); border-radius:99px; padding:6px 12px; font-size:.8rem; font-weight:600; display:flex; align-items:center; gap:6px; color:var(--ink-soft); cursor:pointer; }
  .lib-fav-toggle svg{ width:14px; height:14px; }
  .lib-fav-toggle.active{ color:var(--bad); border-color:var(--bad); }
  .lib-fav-toggle.active svg{ fill:var(--bad); }

  .rating-stars{ display:flex; gap:2px; }
  .rating-star{ background:transparent; border:none; padding:2px; cursor:pointer; color:var(--border); }
  .rating-star svg{ width:19px; height:19px; }
  .rating-star.filled{ color:var(--mustard); }
  .rating-star.filled svg{ fill:var(--mustard); }

  .lib-tag-row{ display:flex; flex-wrap:wrap; gap:6px; }

  .lib-status-select{ padding:.35rem .6rem; font-size:.78rem; font-weight:600; border-radius:99px; }

  .lib-dotgrid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .lib-dotgrid .lib-dot{ aspect-ratio:1; border-radius:3px; background:var(--surface-2); }
  .lib-dotgrid .lib-dot.on{ background:var(--home-blue); }
  .lib-dotgrid .lib-dot.future{ background:transparent; }

  .cover-dropzone{
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;
    width:96px; height:144px; border:1.5px dashed var(--border); border-radius:6px; cursor:pointer;
    color:var(--ink-faint); font-size:.66rem; text-align:center; padding:6px; overflow:hidden; position:relative; flex:none;
  }
  .cover-dropzone img{ width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
  .cover-dropzone svg{ width:22px; height:22px; }

  /* Barcode scan modal (opens on top of the Add item modal) */
  #lib-scan-btn svg{ width:16px; height:16px; flex:none; } /* unsized inline SVG default-renders huge — see build notes */
  .scan-video-wrap{
    position:relative; width:100%; aspect-ratio:4/3; background:#111; border-radius:10px; overflow:hidden;
  }
  .scan-video-wrap video{ width:100%; height:100%; object-fit:cover; display:block; }
  .scan-viewfinder{
    position:absolute; inset:14%; border:2px solid rgba(255,255,255,.75); border-radius:10px;
    box-shadow:0 0 0 999px rgba(0,0,0,.28); pointer-events:none;
  }
  .scan-status-line{ text-align:center; font-size:.8rem; color:var(--ink-faint); margin:8px 0 0; }
  .scan-result{ display:flex; gap:12px; align-items:center; }
  .scan-result-cover{ width:64px; height:96px; object-fit:cover; border-radius:6px; flex:none; background:var(--surface-2); }
  .scan-result-cover-blank{ display:flex; align-items:center; justify-content:center; color:var(--ink-faint); }
  .scan-result-cover-blank svg{ width:24px; height:24px; }
  .scan-result-title{ font-weight:700; font-size:.95rem; }
  .scan-result-sub{ font-size:.8rem; color:var(--ink-faint); margin-top:2px; }
  .scan-result-source{ font-size:.7rem; color:var(--ink-faint); margin-top:4px; }

  /* Title search (v22) result list */
  .search-result-list{ max-height:340px; overflow-y:auto; margin-top:10px; }
  .search-result-row{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    background:none; border:none; padding:9px 4px; border-bottom:1px solid var(--border-soft);
    font:inherit; color:inherit; cursor:pointer; border-radius:8px;
  }
  .search-result-row:last-child{ border-bottom:none; }
  .search-result-row:hover{ background:var(--surface-2); }
  .search-result-cover{
    width:38px; height:56px; border-radius:5px; flex:none; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .search-result-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .search-result-cover svg{ width:18px; height:18px; color:var(--ink-faint); }
  .search-result-text{ min-width:0; }
  .search-result-title{ display:block; font-weight:600; font-size:.87rem; }
  .search-result-sub{ display:block; font-size:.75rem; color:var(--ink-faint); margin-top:2px; }

  .lib-history-row{ display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-soft); }
  .lib-history-row:last-child{ border-bottom:none; }
  .lib-history-dot{ width:8px; height:8px; border-radius:50%; flex:none; margin-top:6px; }

  .lib-filter-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .lib-filter-row select{ padding:.4rem .6rem; font-size:.78rem; }
  label.chk-f{ flex-direction:row !important; align-items:center; gap:7px !important; }
  label.chk-f input{ width:auto; }

  @media (max-width:480px){
    .lib-grid{ grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); }
    .lib-detail-head{ flex-direction:column; align-items:center; text-align:center; }
    .lib-detail-meta-row{ justify-content:center; }
  }

  /* ---------- Today: daily plan hero ---------- */
  .today-hero-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px; }
  .today-hero-head h2{ font-size:1.32rem; }
  .today-hero-date{ color:var(--ink-soft); font-size:.9rem; margin-top:3px; display:flex; align-items:center; flex-wrap:wrap; gap:2px 10px; }
  .today-view-cal{ font-size:.8rem; color:var(--ink-soft); background:transparent; border:none; text-decoration:underline; cursor:pointer; padding:0; font-family:inherit; }
  .today-view-cal:hover{ color:var(--ink); }
  .today-daynav{ display:flex; align-items:center; gap:6px; flex:none; flex-wrap:wrap; }
  .today-daynav button{ background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--ink-soft); font-size:.78rem; font-weight:600; cursor:pointer; padding:6px 11px; font-family:inherit; }
  .today-daynav button:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .today-daynav .is-today{ background:var(--surface-2); border-color:transparent; color:var(--ink); }

  .today-timeline{ position:relative; margin:18px 0 2px; padding-left:22px; }
  .today-timeline::before{ content:""; position:absolute; left:6px; top:8px; bottom:8px; width:1px; background:var(--border); }
  .today-block-row{ position:relative; display:flex; align-items:flex-start; gap:10px; padding:9px 0; cursor:pointer; }
  .today-block-row:hover .today-block-title{ text-decoration:underline; }
  .today-block-dot{ position:absolute; left:-22px; top:15px; width:9px; height:9px; border-radius:50%; background:var(--accent); border:2px solid var(--ground); }
  .today-block-time{ font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--ink-faint); width:42px; flex:none; padding-top:6px; }
  .today-block-icon{ width:26px; height:26px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--accent) 14%, var(--surface)); color:var(--accent); }
  .today-block-icon svg{ width:14px; height:14px; }
  .today-block-main{ flex:1; min-width:0; display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px; padding-top:5px; }
  .today-block-title{ font-weight:600; font-size:.87rem; }
  .today-block-title.done{ text-decoration:line-through; opacity:.6; }
  .today-block-cat{ font-size:.66rem; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); padding:2px 7px; border-radius:20px; flex:none; }
  .today-block-meta{ font-size:.78rem; color:var(--ink-faint); margin-left:auto; white-space:nowrap; }
  .today-block-check{ flex:none; margin-top:3px; width:22px; height:22px; border-radius:50%; border:1.5px solid var(--border); background:var(--surface); color:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
  .today-block-check svg{ width:11px; height:11px; }
  .today-block-check.done{ background:var(--good); border-color:var(--good); color:#fff; }
  .today-now-row{ position:relative; display:flex; align-items:center; gap:8px; padding:3px 0 3px 56px; }
  .today-now-row .line{ flex:1; height:0; border-top:2px solid var(--ember); }
  .today-now-row .time{ font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--ember); font-weight:700; }
  .today-plan-foot{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-top:14px; flex-wrap:wrap; }
  .today-plan-complete{ display:flex; align-items:center; gap:10px; font-size:.78rem; color:var(--ink-soft); font-weight:600; }
  .today-plan-bar{ width:110px; height:4px; border-radius:3px; background:var(--surface-2); overflow:hidden; flex:none; }
  .today-plan-bar span{ display:block; height:100%; background:var(--good); }

  .today-metrics-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .today-metrics-row .stat-tile{ cursor:pointer; }
  .today-metrics-row .stat-tile .value{ font-size:1.3rem; }
  @media (max-width:900px){ .today-metrics-row{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .today-block-meta{ margin-left:0; } .today-block-time{ width:auto; } }

  .weather-row{ display:flex; align-items:center; gap:16px; }
  .weather-icon svg{ width:32px; height:32px; color:var(--ink-soft); flex:none; }
  .weather-main{ flex:1; min-width:0; }
  .weather-temp{ font-family:'IBM Plex Mono',monospace; font-size:1.55rem; font-weight:700; display:flex; align-items:baseline; gap:9px; }
  .weather-temp .weather-desc{ font-family:'Fraunces',serif; font-size:.85rem; font-weight:500; color:var(--ink-faint); }
  .weather-sub{ font-size:.75rem; color:var(--ink-faint); margin-top:3px; }
  .weather-range{ display:flex; flex-direction:column; gap:3px; font-family:'IBM Plex Mono',monospace; font-size:.78rem; color:var(--ink-soft); text-align:right; flex:none; }
  @media (max-width:420px){ .weather-sub{ display:none; } }

  /* ---------- Challenges ---------- */
  .chal-hscroll{ display:flex; gap:14px; overflow-x:auto; padding:2px 2px 10px; }
  .chal-card{
    flex:none; width:190px; display:flex; flex-direction:column; gap:6px; padding:14px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    cursor:pointer; position:relative;
  }
  .chal-card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .chal-badge{
    font-size:.62rem; font-weight:700; letter-spacing:.04em; border:1px solid; border-radius:99px;
    padding:2px 8px; background:var(--surface-2);
  }
  .chal-card-name{ font-weight:700; font-size:.9rem; line-height:1.25; min-height:2.3em; }
  .chal-card-ring{ position:relative; width:88px; height:88px; margin:2px auto; }
  .chal-card-ring svg{ width:100%; height:100%; }
  .chal-ring-label{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .chal-ring-pct{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.92rem; line-height:1; }
  .chal-ring-sub{ font-size:.56rem; color:var(--ink-faint); margin-top:2px; }
  .chal-countdown-num{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:1.5rem; text-align:center; line-height:1.1; }
  .chal-countdown-sub{ font-size:.68rem; color:var(--ink-faint); text-align:center; margin-top:-4px; }
  .chal-card-bottom{ font-size:.72rem; color:var(--ink-faint); text-align:center; margin-top:auto; padding-top:6px; border-top:1px solid var(--border-soft); }

  .chal-compact-bar{ display:flex; align-items:center; gap:8px; flex:none; }
  .chal-compact-bar .bar-val{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; font-weight:600; color:var(--ink-soft); }
  .chal-type-icon{
    width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    color:#fff; flex:none;
  }
  .chal-type-icon svg{ width:17px; height:17px; }

  .chal-overview-table{ width:100%; border-collapse:collapse; font-size:.82rem; }
  .chal-overview-table th{ text-align:left; font-size:.68rem; color:var(--ink-faint); font-weight:600; padding:4px 10px 8px 0; border-bottom:1px solid var(--border); }
  .chal-overview-table td{ padding:9px 10px 9px 0; border-bottom:1px solid var(--border-soft); cursor:pointer; }
  .chal-overview-table tr:last-child td{ border-bottom:none; }

  .chal-detail-head{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:14px; }
  .chal-detail-icon{ width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; flex:none; }
  .chal-detail-icon svg{ width:26px; height:26px; }
  .chal-detail-info{ flex:1; min-width:200px; }
  .chal-detail-info h2{ font-size:1.3rem; line-height:1.2; }
  .chal-detail-sub{ font-size:.84rem; color:var(--ink-faint); margin-top:2px; }
  .chal-detail-countdown{ text-align:right; flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .chal-status-badge{ font-size:.64rem; font-weight:700; letter-spacing:.04em; border:1px solid; border-radius:99px; padding:2px 9px; }

  .chal-insight-banner{
    display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--border-soft);
    border-radius:var(--radius); padding:10px 14px; font-size:.82rem; color:var(--ink-soft); margin:14px 0;
  }
  .chal-insight-banner svg{ width:15px; height:15px; color:var(--good); flex:none; }

  .chal-act-metrics{ text-align:right; font-size:.78rem; font-weight:600; flex:none; }
  .chal-act-metrics .hint{ font-weight:400; }

  .chal-plan-grid{ width:100%; border-collapse:collapse; font-size:.78rem; }
  .chal-plan-grid th{ text-align:center; font-size:.66rem; color:var(--ink-faint); font-weight:600; padding:4px 6px 8px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .chal-plan-grid th:first-child{ text-align:left; }
  .chal-plan-grid td.chal-plan-cell{ border:1px solid var(--border-soft); padding:5px; vertical-align:top; min-width:96px; height:44px; }
  .chal-plan-grid th:first-child + th, .chal-plan-grid td:first-child{ text-align:left; font-weight:600; padding-right:10px; white-space:nowrap; }
  .chal-plan-add{ display:flex; align-items:center; justify-content:center; height:100%; color:var(--ink-faint); font-size:1rem; cursor:pointer; opacity:0; transition:opacity .1s; }
  .chal-plan-cell:hover .chal-plan-add{ opacity:1; }
  .chal-plan-item{
    font-size:.72rem; background:var(--surface-2); border-radius:6px; padding:4px 6px; margin-bottom:3px;
    cursor:pointer; line-height:1.3;
  }
  .chal-plan-item.done{ background:var(--good); color:#fff; }
  .chal-plan-check{ display:inline-flex; vertical-align:middle; }
  .chal-plan-check svg{ width:10px; height:10px; }

  .chal-focus-row{ display:flex; align-items:center; gap:8px; padding:6px 0; }
  .chal-focus-row span{ flex:1; font-size:.84rem; }
  .chal-focus-check{
    width:20px; height:20px; border-radius:5px; border:1.5px solid var(--border); background:transparent;
    display:flex; align-items:center; justify-content:center; color:#fff; flex:none; cursor:pointer;
  }
  .chal-focus-check.done{ background:var(--good); border-color:var(--good); }
  .chal-focus-row .chal-focus-check svg{ width:11px; height:11px; }

  .chal-milestone-timeline{ position:relative; padding-left:6px; }
  .chal-milestone-row{ display:flex; gap:12px; position:relative; padding-bottom:18px; }
  .chal-milestone-row:last-child{ padding-bottom:0; }
  .chal-milestone-row:not(:last-child)::before{
    content:""; position:absolute; left:9px; top:20px; bottom:0; width:2px; background:var(--border);
  }
  .chal-milestone-dot{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; flex:none; cursor:pointer; color:#fff; z-index:1;
  }
  .chal-milestone-row.done .chal-milestone-dot{ background:var(--good); border-color:var(--good); }
  .chal-milestone-dot svg{ width:10px; height:10px; }
  .chal-milestone-body{ flex:1; padding-top:1px; }
  .chal-milestone-title{ font-weight:600; font-size:.84rem; cursor:pointer; }
  .chal-milestone-row.done .chal-milestone-title{ text-decoration:line-through; opacity:.65; }

  .sport-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .sport-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:9px 12px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
    border-radius:10px; cursor:pointer; font-size:.68rem; min-width:60px;
  }
  .sport-btn svg{ width:18px; height:18px; }
  .sport-btn.active{ background:var(--good); border-color:var(--good); color:#fff; }

  .feel-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .feel-btn{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
    border-radius:99px; padding:6px 12px; font-size:.76rem; cursor:pointer;
  }
  .feel-btn.active{ background:var(--good); border-color:var(--good); color:#fff; }

  .drawer-backdrop{ position:fixed; inset:0; background:rgba(10,9,6,.55); display:flex; justify-content:flex-end; z-index:50; }
  .drawer-card{
    width:420px; max-width:100%; height:100%; background:var(--surface); overflow-y:auto;
    padding:22px; box-shadow:-8px 0 24px rgba(10,9,6,.2); animation:chal-drawer-in .18s ease-out;
  }
  @keyframes chal-drawer-in{ from{ transform:translateX(24px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .drawer-head h2{ font-size:1.05rem; }
  @media (max-width:640px){
    .drawer-card{ width:100%; }
  }

  /* ---------- Studying: subjects ---------- */
  .subject-pills{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
  .subject-pill{
    border:1px solid var(--border); background:var(--surface-2); color:var(--ink-soft);
    border-radius:99px; padding:6px 13px; font-size:.8rem; font-weight:600;
    display:flex; align-items:center; gap:7px;
  }
  .subject-pill .dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .subject-pill .pill-icon{ width:14px; height:14px; flex:none; display:inline-flex; }
  .subject-pill .pill-icon svg{ width:100%; height:100%; display:block; }
  .subject-pill.active{ color:#fff; border-color:transparent; }
  .subject-add{ display:flex; gap:6px; align-items:center; }
  .subject-add input{ width:160px; padding:.4rem .6rem; font-size:.8rem; }

  /* ---------- Calendar ---------- */
  .cal-wrap{ max-width:660px; }
  .cal-header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .cal-header h2{ font-size:1.05rem; }
  .cal-nav{ display:flex; gap:6px; align-items:center; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:5px; }
  .cal-weekday{ font-size:.65rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; text-align:center; padding-bottom:4px; }
  .cal-cell{
    aspect-ratio:1/1; border:1px solid var(--border-soft); border-radius:9px; background:var(--surface-2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:4px;
    cursor:pointer; font-family:inherit; color:var(--ink); font-size:.78rem;
  }
  .cal-cell:hover{ border-color:var(--ink-faint); }
  .cal-cell.empty{ visibility:hidden; cursor:default; }
  .cal-cell.today{ border-color:var(--ember); border-width:2px; }
  .cal-cell.selected{ border-color:var(--border); }
  .cal-date{ font-family:'IBM Plex Mono',monospace; font-weight:600; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto; }
  .cal-cell.selected .cal-date{ background:var(--good); color:#fff; }
  .cal-dots{ display:flex; gap:2px; flex-wrap:wrap; justify-content:center; min-height:6px; margin-top:2px; }
  .cal-dot{ width:5px; height:5px; border-radius:50%; flex:none; }
  .cal-dot-more{ font-size:.5rem; color:var(--ink-faint); line-height:1; margin-left:1px; align-self:center; }
  .cal-detail{ margin-top:18px; }

  /* ---------- Calendar: Selected Day panel + Day view (v9) ---------- */
  .cal-day-date{ font-size:1.15rem; margin:0; }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; align-items:start; }
  @media (max-width:760px){ .grid-3{ grid-template-columns:1fr; } }
  .cal-daycol-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .cal-daycol-head h3{ font-size:.82rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); }
  .cal-daycol-head button{ background:transparent; border:none; color:var(--ink-faint); font-size:.76rem; font-weight:600; cursor:pointer; padding:2px 4px; }
  .cal-daycol-head button:hover{ color:var(--ink); }

  .plan-list{ display:flex; flex-direction:column; }
  .plan-row{ display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--border-soft); }
  .plan-row:last-child{ border-bottom:none; }
  .plan-check{ width:20px; height:20px; border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex:none; background:transparent; cursor:pointer; padding:0; }
  .plan-check svg{ width:11px; height:11px; opacity:0; color:#fff; }
  .plan-row.done .plan-check{ background:var(--good); border-color:var(--good); }
  .plan-row.done .plan-check svg{ opacity:1; }
  .plan-label{ flex:1; font-size:.87rem; cursor:pointer; }
  .plan-row.done .plan-label{ opacity:.6; text-decoration:line-through; }
  .plan-del{ background:transparent; border:none; color:var(--ink-faint); font-size:.85rem; padding:2px 4px; cursor:pointer; flex:none; }
  .plan-del:hover{ color:var(--bad); }
  .plan-progress{ font-size:.78rem; color:var(--ink-faint); margin-top:10px; font-weight:600; }
  .plan-add-row{ display:flex; gap:6px; margin-top:10px; }
  .plan-add-row input{ flex:1; padding:.4rem .55rem; font-size:.82rem; }
  .plan-empty{ color:var(--ink-faint); font-size:.83rem; padding:6px 0; }

  .sched-list{ display:flex; flex-direction:column; }
  .sched-row{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft); cursor:pointer; }
  .sched-row:last-child{ border-bottom:none; }
  .sched-row:hover .sched-title{ text-decoration:underline; }
  .sched-time{ font-family:'IBM Plex Mono',monospace; font-size:.76rem; color:var(--ink-faint); width:44px; flex:none; padding-top:1px; }
  .sched-swatch{ width:6px; align-self:stretch; border-radius:3px; flex:none; }
  .sched-main{ flex:1; min-width:0; }
  .sched-title{ font-weight:600; font-size:.86rem; }
  .sched-title.done{ text-decoration:line-through; opacity:.65; }
  .sched-meta{ font-size:.74rem; color:var(--ink-faint); margin-top:1px; }
  .sched-check{ background:transparent; border:none; color:var(--ink-faint); flex:none; padding:2px; cursor:pointer; }
  .sched-check svg{ width:15px; height:15px; }
  .sched-row.completed .sched-check{ color:var(--good); }
  .sched-del{ background:transparent; border:none; color:var(--ink-faint); font-size:.8rem; padding:2px 4px; cursor:pointer; flex:none; }
  .sched-del:hover{ color:var(--bad); }
  .cal-link-btn{ background:transparent; border:none; color:var(--ember); font-size:.82rem; font-weight:700; padding:10px 0 0; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .cal-link-btn svg{ width:13px; height:13px; }
  .cal-link-btn:hover{ text-decoration:underline; }

  .summary-list{ display:flex; flex-direction:column; }
  .summary-row{ display:flex; align-items:center; gap:9px; padding:7px 0; border-bottom:1px solid var(--border-soft); }
  .summary-row:last-child{ border-bottom:none; }
  .summary-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .summary-label{ flex:1; font-size:.83rem; color:var(--ink-soft); }
  .summary-val{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:.86rem; }
  .summary-val.dim{ color:var(--ink-faint); font-weight:400; }

  /* Day view header */
  .cal-day-topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .cal-back-btn{ background:transparent; border:none; color:var(--ink-faint); font-size:.84rem; font-weight:600; padding:4px 0; cursor:pointer; display:flex; align-items:center; gap:4px; }
  .cal-back-btn:hover{ color:var(--ink); }
  .cal-day-heading{ font-size:1.5rem; margin:4px 0 14px; }
  .cal-quickadd-wrap{ position:relative; flex:none; }
  .cal-subtabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; }
  .cal-subtab{ background:transparent; border:none; padding:8px 12px; font-size:.86rem; font-weight:600; color:var(--ink-faint); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .cal-subtab.active{ color:var(--ember); border-bottom-color:var(--ember); }
  .cal-daynav{ display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:16px; }
  .cal-daynav button{ background:transparent; border:none; color:var(--ink-soft); font-size:.82rem; font-weight:600; cursor:pointer; padding:4px 6px; }
  .cal-daynav button:hover{ color:var(--ink); }
  .cal-daynav .today-pill{ background:var(--surface-2); border-radius:20px; padding:4px 12px; }

  .quickadd-menu{
    position:absolute; top:calc(100% + 6px); right:0; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:0 12px 28px -8px rgba(36,37,31,.3); padding:6px; min-width:190px; z-index:40;
  }
  .quickadd-menu[hidden]{ display:none; }
  .quickadd-menu button{
    display:block; width:100%; text-align:left; background:transparent; border:none; padding:8px 10px;
    font-size:.84rem; color:var(--ink); border-radius:8px; cursor:pointer; font-family:inherit;
  }
  .quickadd-menu button:hover{ background:var(--surface-2); }

  /* Day view: timeline + side panel */
  .cal-dayview-grid{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:24px; align-items:start; }
  @media (max-width:880px){ .cal-dayview-grid{ grid-template-columns:1fr; } }
  .cal-timeline-wrap{ position:relative; }
  .cal-timeline{ position:relative; border-top:1px solid var(--border-soft); }
  .cal-hour-row{ height:56px; border-bottom:1px solid var(--border-soft); position:relative; cursor:pointer; }
  .cal-hour-row:hover{ background:color-mix(in srgb, var(--surface-2) 55%, transparent); }
  .cal-hour-label{ position:absolute; left:0; top:-8px; font-size:.68rem; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; background:var(--surface); padding-right:6px; }
  .cal-events-layer{ position:absolute; left:52px; right:6px; top:0; }
  .cal-event{
    position:absolute; left:0; right:0; border-radius:9px; padding:5px 9px; overflow:hidden;
    border-left:3px solid var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--surface)); cursor:pointer;
  }
  .cal-event:hover{ filter:brightness(0.97); }
  .cal-event-time{ font-family:'IBM Plex Mono',monospace; font-size:.68rem; color:var(--ink-faint); }
  .cal-event-title{ font-weight:700; font-size:.82rem; line-height:1.2; }
  .cal-event-title.completed{ text-decoration:line-through; opacity:.7; }
  .cal-event-meta{ font-size:.72rem; color:var(--ink-faint); }
  .cal-event-actions{ position:absolute; top:4px; right:6px; display:flex; gap:2px; }
  .cal-event-actions button{ background:rgba(255,255,255,.001); border:none; color:var(--ink-faint); padding:2px; cursor:pointer; }
  .cal-event-actions button:hover{ color:var(--ink); }
  .cal-event-actions svg{ width:13px; height:13px; }
  .cal-now-line{ position:absolute; left:52px; right:6px; height:0; border-top:2px solid var(--bad); z-index:5; }
  .cal-now-line span{ position:absolute; left:-46px; top:-8px; font-size:.66rem; color:var(--bad); font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .cal-add-block-btn{ margin-top:14px; }
  .cal-empty-day{ text-align:center; padding:40px 12px; color:var(--ink-faint); }
  .cal-empty-day h3{ color:var(--ink); font-size:1rem; margin-bottom:4px; }
  .cal-empty-day p{ font-size:.84rem; margin-bottom:16px; }

  .cal-side-card{ margin-bottom:20px; }
  .cal-side-card:last-child{ margin-bottom:0; }

  .cal-week-list{ display:flex; flex-direction:column; gap:14px; }
  .cal-week-day{ padding:12px 14px; }
  .cal-week-day-head{ display:flex; align-items:baseline; justify-content:space-between; cursor:pointer; }
  .cal-week-day-head:hover .cal-week-day-title{ text-decoration:underline; }
  .cal-week-day-title{ font-weight:700; font-size:.92rem; }
  .cal-week-day-sub{ font-size:.76rem; color:var(--ink-faint); }

  .cal-agenda-group{ margin-bottom:16px; }
  .cal-agenda-group:last-child{ margin-bottom:0; }
  .cal-agenda-date{ font-size:.78rem; font-weight:700; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }

  /* Add time block modal */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,9,6,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:22px; max-width:440px; width:100%; max-height:88vh; overflow:auto;
    box-shadow:0 24px 60px -14px rgba(36,37,31,.4);
  }
  .modal-card h2{ font-size:1.05rem; margin-bottom:16px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
  .modal-card details summary{ cursor:pointer; font-size:.82rem; font-weight:600; color:var(--ink-soft); padding:4px 0; }
  .modal-card details[open] summary{ margin-bottom:2px; }

  /* ---------- Themed date/time field pickers ----------
     Replace the browser's own native date/time popup (which ignores the app's theme entirely and
     can't be restyled via CSS) with a small in-theme popover, built to sit in for a plain
     input[type=date]/input[type=time] wherever one of those is used. */
  .field-picker-wrap{ position:relative; }
  .field-picker-trigger{
    width:100%; box-sizing:border-box; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-family:inherit; font-size:.92rem; color:var(--ink); background:var(--surface);
    border:1px solid var(--border); border-radius:10px; padding:.55rem .65rem; cursor:pointer;
  }
  .field-picker-trigger:hover{ border-color:var(--good); }
  .field-picker-trigger.empty{ color:var(--ink-faint); }
  .field-picker-trigger .fp-icon{ flex:none; width:15px; height:15px; opacity:.55; }
  .field-picker-trigger .fp-icon svg{ width:100%; height:100%; display:block; }
  .field-picker-pop{
    position:absolute; z-index:60; top:calc(100% + 6px); left:0;
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    box-shadow:0 18px 40px -10px rgba(36,37,31,.35); padding:10px; min-width:230px;
  }
  .fp-cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; padding:0 2px; }
  .fp-cal-head button{ background:none; border:none; color:var(--ink); font-size:1rem; line-height:1; padding:4px 9px; border-radius:8px; cursor:pointer; }
  .fp-cal-head button:hover{ background:var(--surface-2); }
  .fp-cal-label{ font-size:.8rem; font-weight:700; }
  .fp-cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px; }
  .fp-cal-wd{ font-size:.62rem; text-align:center; color:var(--ink-faint); font-weight:700; padding:3px 0 5px; }
  .fp-cal-day{ aspect-ratio:1; border:none; background:none; color:var(--ink); font-family:inherit; font-size:.78rem; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .fp-cal-day:hover:not(:disabled){ background:var(--surface-2); }
  .fp-cal-day.today{ color:var(--ember); font-weight:700; }
  .fp-cal-day.selected{ background:var(--good); color:#FBF7EE; font-weight:700; }
  .fp-cal-day.other-month{ opacity:.28; cursor:default; }
